  <style>
    .flowchart-section { margin-bottom: var(--space-2xl); }
    .flowchart-section-title {
      font-size: var(--text-xl); font-weight: 600;
      margin-bottom: var(--space-md); display: flex; align-items: center; gap: var(--space-sm);
      padding-top: var(--space-xl);
    }
    .flowchart-svg-wrap {
      background: var(--color-surface); border: 1px solid var(--color-border-light);
      border-radius: var(--radius-lg); padding: var(--space-md); overflow-x: auto;
    }
    .flowchart-svg-wrap svg { min-width: 680px; }
    .flowchart-nav {
      position: sticky; top: 0; z-index: 10;
      display: flex; gap: var(--space-sm); padding: var(--space-sm) 0;
      background: var(--color-background); border-bottom: 1px solid var(--color-border-light);
      margin-bottom: var(--space-lg); flex-wrap: wrap;
    }
    .flowchart-nav a {
      padding: var(--space-xs) var(--space-md); border-radius: var(--radius-full);
      background: var(--color-surface); border: 1px solid var(--color-border-light);
      text-decoration: none; color: var(--color-text-secondary); font-size: var(--text-sm);
      transition: all 0.15s;
    }
    .flowchart-nav a:hover { background: var(--color-hover-bg); color: var(--color-text); }
    .flowchart-nav a.active { background: var(--color-primary); color: var(--color-text-inverse); border-color: var(--color-primary); }
    /* SVG 节点交互 */
    .flowchart-svg-wrap svg a { cursor: pointer; }
    .flowchart-svg-wrap svg a rect { transition: filter 0.15s, stroke-width 0.15s; }
    .flowchart-svg-wrap svg a:hover rect { filter: brightness(0.92); stroke-width: 1.5; }
    .flowchart-svg-wrap svg .highlight rect { stroke-width: 2; filter: drop-shadow(0 0 4px rgba(24,95,165,0.5)); }
  </style>
</head>

  <script>
    // 导航高亮
    var navLinks = document.querySelectorAll('.flowchart-nav a');
    var sections = document.querySelectorAll('.flowchart-section');
    navLinks.forEach(function(link) {
      link.addEventListener('click', function(e) {
        navLinks.forEach(function(l) { l.classList.remove('active'); });
        link.classList.add('active');
      });
    });
    // 滚动监听
    window.addEventListener('scroll', function() {
      var scrollY = window.scrollY + 100;
      sections.forEach(function(sec, i) {
        if (sec.offsetTop <= scrollY && sec.offsetTop + sec.offsetHeight > scrollY) {
          navLinks.forEach(function(l) { l.classList.remove('active'); });
          if (navLinks[i]) navLinks[i].classList.add('active');
        }
      });
    });
    // 来源高亮：从某个页面跳转来时，高亮对应节点
    var from = new URLSearchParams(location.search).get('from');
    if (from) {
      var links = document.querySelectorAll('.flowchart-svg-wrap svg a[href="' + from + '.html"]');
      links.forEach(function(a) { a.classList.add('highlight'); });
    }
  </script>
