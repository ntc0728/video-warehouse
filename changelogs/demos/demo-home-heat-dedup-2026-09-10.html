    <h1>首页「分类热度榜」× 顶栏 chip 面板 —— 内容重复去重提案</h1>
    <p>
      议题：<b>首页分类热度榜模块与顶部导航 chip 面板内容重复</b>。本页给出 4 个候选形态（现状 + A/B/C），
      只做「看形态」用。左栏宽度 <code>260px（≥1920: 280px）</code>、栏间 gap <code>--space-lg</code>、
      Hero 高度公式 <code>--hero-banner-h</code> 全部照抄 <code>Home.css:647-706</code> 真实读数。
    </p>
  </div>

  <div class="bar">
    <span class="bar__lab">形态</span>
    <span class="seg" id="planSeg">
      <button data-p="now" class="is-on">现状（重复）</button>
      <button data-p="A">方案 A</button>
      <button data-p="B">方案 B · 推荐</button>
      <button data-p="C">方案 C</button>
    </span>
    <span class="bar__sp"></span>
    <span class="bar__lab">视口</span>
    <span class="seg" id="wSeg">
      <button data-w="1280">1280</button>
      <button data-w="1440" class="is-on">1440</button>
      <button data-w="1920">1920</button>
      <button data-w="2560">2560</button>
    </span>
    <button class="btn-mini" id="themeBtn">深色</button>
  </div>

  <div class="plan-desc" id="desc"></div>

  <div class="sim-wrap"><div class="sim-frame"><div class="plan is-on" id="mount"></div></div></div>
</div>

<script>
(function(){
  'use strict';
  var $=function(s){return document.querySelector(s);};

  /* ── 模拟数据 ─────────────────────────────────────────── */
  var FILMS=[
    '沙丘：第二部','流浪地球 3','奥本海默','繁花','漫长的季节','三体','狂飙','宇宙探索编辑部',
    '蜘蛛侠：纵横宇宙','怒海战记','繁城之下','长安三万里','热辣滚烫','第二十条','飞驰人生 2','年会不能停'
  ];
  /* 现状：aggregateCategoryHeat(/trending/all/day 单页 20 条) 的真实后果——
     电影/剧集桶各约 8~12 条，综艺/动漫/纪录片桶常只有 0~2 条，Σ 值抖动大。
     方案 B 的 TOP10 直接用同一次 trending 结果（连续排名，无分类切分）。 */
  var TREND=[
    {t:'沙丘：第二部',k:'movie',h:4126.8},{t:'繁花',k:'tv',h:3184.2},
    {t:'流浪地球 3',k:'movie',h:2907.5},{t:'漫长的季节',k:'tv',h:2540.9},
    {t:'奥本海默',k:'movie',h:2318.4},{t:'三体',k:'tv',h:2087.1},
    {t:'狂飙',k:'tv',h:1892.6},{t:'蜘蛛侠：纵横宇宙',k:'movie',h:1644.3},
    {t:'宇宙探索编辑部',k:'movie',h:1421.7},{t:'繁城之下',k:'tv',h:1288.5}
  ];
  var CATS=[
    {name:'电影',color:'linear-gradient(135deg,#ff4757,#ff6b81)',heat:12480,list:TREND.filter(function(x){return x.k==='movie';}).slice(0,5).map(function(x){return x.t;})},
    {name:'剧集',color:'linear-gradient(135deg,#7c3aed,#a78bfa)',heat:9860,list:TREND.filter(function(x){return x.k==='tv';}).slice(0,5).map(function(x){return x.t;})},
    {name:'综艺',color:'linear-gradient(135deg,#f97316,#fb923c)',heat:2140,list:['奔跑吧·天路篇','忘不了农场']}
  ];

  /* ── 片段 ─────────────────────────────────────────────── */
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}

  function header(dupeChip){
    var chips=['首页','电影','剧集','综艺','动漫','纪录片','排行榜','全部分类'];
    return '<div class="site-hd"><div class="site-hd__inner">'
      + '<span class="site-logo">KinoTV</span>'
      + '<span class="site-chips">'+chips.map(function(c,i){
          var cls='site-chip'+(i===0?' is-on':'');
          /* 现状：chip「电影」与左栏分类卡「电影」指向同一分类 —— 标红 */
          if(dupeChip && c==='电影') cls+=' is-dupe';
          return '<span class="'+cls+'">'+c+'</span>';
        }).join('')+'</span>'
      + '<span class="site-search">搜索影视 / 演员…</span>'
      + '<span class="site-hd__right"><span>♪</span><span>☆</span><span>⚙</span></span>'
      + '</div></div>';
  }

  function topstrip(withTopCat){
    return '<div class="topstrip"><div class="topstrip__inner">'
      + '<span style="color:var(--color-text-tertiary)">首页</span>'
      + '<span class="topstrip__sep"></span><span class="topstrip__stat">今日趋势 <b>20</b> 条</span>'
      + (withTopCat
          ? '<span class="topstrip__sep"></span><span class="topstrip__stat">'
            +'<span style="color:var(--color-warning)">🔥</span> 最热分类 <b>电影</b></span>'
          : '')
      + '<span class="topstrip__right"><span class="topstrip__pill">继续观看 3</span>'
      + '<span class="topstrip__pill">收藏 12</span>'
      + '<span>完整热度榜 ›</span></span>'
      + '</div></div>';
  }

  function hero(mode){
    var cards='';
    for(var i=0;i<6;i++) cards+='<div class="hb__card">'+esc(FILMS[i])+'</div>';
    var grid='hb__grid'+(mode==='single'?' hb__grid--full':'');
    return '<div class="hb '+(mode==='single'?'hb--single':'hb--two')+'"><div class="'+grid+'">'
      + '<div class="hb__banner"><div class="hb__cap">'
      +   '<div class="hb__meta"><span>★ 8.7</span><span>2024</span><span>电影</span></div>'
      +   '<h3>沙丘：第二部</h3>'
      +   '<p>保罗·厄崔迪与契妮和弗雷曼人联手，踏上复仇之路，对抗那些毁灭其家族的阴谋者。</p>'
      + '</div></div>'
      + '<div class="hb__right"><div class="hb__cards">'+cards+'</div>'
      + '<div class="hb__shuffle">换一换</div></div>'
      + '</div></div>';
  }

  function heatCards(dupe){
    return CATS.map(function(c,i){
      var w=(c.heat/CATS[0].heat*100).toFixed(1);
      return '<div class="heat-card'+(dupe&&i===0?' is-dupe':'')+'">'
        + '<div class="heat-card__head">'
        +   '<span class="heat-card__rank">'+(i+1)+'</span>'
        +   '<span class="heat-card__name">'+c.name+'</span>'
        +   '<span class="heat-card__heat"><span class="n">'+c.heat+'</span><span class="l">分类热度 Σ</span></span>'
        + '</div>'
        + '<div class="heat-card__bar"><i style="width:'+w+'%"></i></div>'
        + '<div class="heat-card__list">'+c.list.map(function(t,j){
            return '<div class="heat-item"><span class="heat-item__idx">'+(j+1)+'</span>'
              + '<span class="heat-item__poster"></span>'
              + '<span class="heat-item__t">'+esc(t)+'</span>'
              + '<span class="heat-item__h">'+(9.9-j*1.6).toFixed(1)+'</span></div>';
          }).join('')+'</div>'
        + (c.list.length<5
            ? '<div style="font-size:var(--text-2xs);color:var(--color-text-tertiary);padding-top:4px">'
              +'桶内不足 5 条（trending 单页 20 条内该分类命中 '+c.list.length+' 条）</div>'
            : '')
        + '</div>';
    }).join('');
  }

  function railHeat(dupe){
    return '<div class="rail-box">'
      + '<div class="rail-head'+(dupe?' is-dupe':'')+'">'
      +   '<span style="color:var(--color-warning)">🔥</span>'
      +   '<span class="rail-head__title">分类热度榜</span>'
      +   '<span class="rail-head__tip">ⓘ</span>'
      +   '<span class="rail-head__sub">今日各分类最热 · 点分类卡进入</span>'
      + '</div>'
      + heatCards(dupe)
      + '</div>';
  }

  /* 方案 B：左栏 = 今日趋势 TOP10 连续榜（无分类切分、无 Σ 指标） */
  function railTrend(){
    return '<div class="rail-box">'
      + '<div class="rail-head">'
      +   '<span style="color:var(--color-warning)">🔥</span>'
      +   '<span class="rail-head__title">今日趋势 TOP 10</span>'
      +   '<span class="rail-head__tip">ⓘ</span>'
      +   '<span class="rail-head__sub">全站不分类型</span>'
      + '</div>'
      + '<div class="trend-card">'
      + TREND.map(function(x,i){
          return '<div class="trend-row">'
            + '<span class="trend-row__rank'+(i<3?' is-top':'')+'">'+(i+1)+'</span>'
            + '<span class="trend-row__poster"></span>'
            + '<span class="trend-row__body">'
            +   '<span class="trend-row__t">'+esc(x.t)+'</span>'
            +   '<span class="trend-row__m">'
            +     '<span class="badge badge--'+x.k+'">'+(x.k==='movie'?'电影':'剧集')+'</span>'
            +     '<span>'+x.h.toFixed(1)+'</span>'
            +   '</span>'
            + '</span>'
            + '<span class="trend-row__h">›</span>'
            + '</div>';
        }).join('')
      + '</div>'
      + '</div>';
  }

  /* 方案 C：左栏只留分类导航卡（去条目列表 → 与面板不再有内容级重复） */
  function railCatNav(){
    return '<div class="rail-box">'
      + '<div class="rail-head">'
      +   '<span style="color:var(--color-warning)">🔥</span>'
      +   '<span class="rail-head__title">分类热度榜</span>'
      +   '<span class="rail-head__tip">ⓘ</span>'
      +   '<span class="rail-head__sub">点分类进完整榜单</span>'
      + '</div>'
      + CATS.map(function(c){
          var w=(c.heat/CATS[0].heat*100).toFixed(1);
          return '<div class="catnav-card">'
            + '<span class="catnav-card__dot" style="background:'+c.color+'"></span>'
            + '<span class="catnav-card__body">'
            +   '<span class="catnav-card__name">'+c.name+'</span>'
            +   '<span class="catnav-card__meta">今日趋势 '+ (c.list.length>=5? '12' : c.list.length) +' 条 · Σ '+c.heat+'</span>'
            +   '<span class="catnav-card__bar"><i style="width:'+w+'%"></i></span>'
            + '</span>'
            + '</div>';
        }).join('')
      + '</div>';
  }

  /* 现状：hover 面板 ghost —— 与左栏同源同内容 */
  function panelGhost(){
    var cards='';
    for(var i=0;i<9;i++) cards+='<div class="panel-ghost__card"><div class="panel-ghost__img"></div>'
      +'<div class="panel-ghost__t">'+esc(FILMS[i])+'</div></div>';
    return '<div class="panel-ghost">'
      + '<div class="panel-ghost__head">'
      +   '<span>🎬</span><span class="panel-ghost__title">电影 · 今日最热</span>'
      +   '<span class="panel-ghost__heat">🔥 12480</span>'
      +   '<span class="panel-ghost__sub">按热度排序 · 点卡片看详情 &#9432;</span>'
      + '</div>'
      + '<div class="panel-ghost__chips">'
      +   ['全部','动作','冒险','动画','喜剧','犯罪','纪录','剧情'].map(function(c,i){
            return '<span class="panel-ghost__chip'+(i===0?' is-on':'')+'">'+c+'</span>';
          }).join('')
      + '</div>'
      + '<div class="panel-ghost__grid">'+cards+'</div>'
      + '</div>';
  }

  function rows(){
    function row(title,n,from){
      var c='';
      for(var i=0;i<n;i++) c+='<div class="mcard"><div class="mcard__img"></div>'
        +'<div class="mcard__t">'+esc(FILMS[(i+from)%FILMS.length])+'</div></div>';
      return '<div class="mrow"><div class="mrow__head"><span class="mrow__title">'+title+'</span>'
        +'<span class="mrow__more">查看全部 ›</span></div><div class="mrow__grid">'+c+'</div></div>';
    }
    return row('继续观看',7,3)+row('正在热映',7,0)+row('热门电影',7,5);
  }

  /* ── 四种形态 ─────────────────────────────────────────── */
  var PLANS={
    now: function(){
      return header(true)
        + '<div class="page">'
        + panelGhost()
        + topstrip(true)
        + '<div class="two-col"><div class="rail">'+railHeat(true)+'</div>'
        + '<div class="col">'+hero('two')+rows()+'</div></div>'
        + '<div class="dupe-note">① 同名分类两处入口 ② 同一 Σ 值三处 ③ 同为「分类→热榜列表」</div>'
        + '</div>';
    },
    A: function(){
      return header(false)
        + '<div class="page">'
        + topstrip(false)
        + hero('single')
        + '<div style="max-width:2200px;margin-inline:auto">'+rows()+'</div>'
        + '</div>';
    },
    B: function(){
      return header(false)
        + '<div class="page">'
        + topstrip(false)
        + '<div class="two-col"><div class="rail">'+railTrend()+'</div>'
        + '<div class="col">'+hero('two')+rows()+'</div></div>'
        + '</div>';
    },
    C: function(){
      return header(false)
        + '<div class="page">'
        + topstrip(false)
        + '<div class="two-col"><div class="rail">'+railCatNav()+'</div>'
        + '<div class="col">'+hero('two')+rows()+'</div></div>'
        + '</div>';
    }
  };

  var DESC={
    now:
      '<h2>现状 —— 三处同源、两种口径</h2>'
      + '<b>重复的实体：</b>顶栏 chip「电影」的 hover 面板（红框）与左栏「分类热度榜」的电影卡（红框），'
      + '是同一个分类的两份「今日最热」列表。同一个 Σ 值 <b>12480</b> 出现在面板头、左栏卡头，'
      + '还以「最热分类 电影」出现在顶部过渡带 —— 三处。<br>'
      + '<b>更麻烦的是口径不一致：</b>'
      + '<ul>'
      + '<li>左栏卡 5 条 ← <code>aggregateCategoryHeat(trending)</code>，数据是 <code>/trending/all/day</code> 的单页 20 条，'
      + '按 <code>mediaType</code> / <code>genre</code> 过滤后再按 popularity 排序（<code>categoryPanelData.ts:106-130</code>）。</li>'
      + '<li>面板「电影 · 全部」20 条 ← <code>/trending/movie/day</code>（<code>categoryPanelData.ts:195-199</code>）。</li>'
      + '</ul>'
      + '<span class="down">两个不同端点 → 同叫「电影今日最热」的两份列表内容不同，上下对不上。</span><br>'
      + '<b>指标本身也不可信：</b>20 条样本里综艺/动漫/纪录片桶通常只有 0~2 条，'
      + 'Σ 值随样本抖动、跨分类不可比；示意中综艺桶只有 <b>2 条</b>，卡片天然填不满 5 行。',
    A:
      '<h2>方案 A · 撤掉左栏，Hero 恢复通栏单列</h2>'
      + '<b>做法：</b>删掉 <code>home-two-col</code> 分支里的 <code>&lt;CategoryHeatRow variant="rail" /&gt;</code>，'
      + '首页回到 Hero 通栏 + 内容行单列；顶栏芯片与 mega 面板成为唯一的「分类 → 热榜预览」入口。<br>'
      + '<b>得到：</b>完全无重复，一眼干净；Hero 宽度 1043 → <b>1320px（1440）、1423 → 1720px（1920）</b>，'
      + '首屏主角回到该有的尺寸。<br>'
      + '<span class="down">代价：</span>撤销 2026-09-10 刚拍板的「方案 C 两栏」，大屏左侧 260px 留白重新出现；'
      + '且 Σ 指标问题在顶部过渡带里仍有残留（需一并删掉「最热分类」）。',
    B:
      '<h2>方案 B · 左栏改「今日趋势 TOP 10」连续榜<span class="tag-reco">推荐</span></h2>'
      + '<b>做法：</b>左栏保留两栏结构，但内容换成 <code>/trending/all/day</code> 的<b>完整连续排名</b>'
      + '（第 1~10 名，每行带 电影/剧集 类型徽标 + popularity），行点击进详情。'
      + '不再做分类切分、不再算 Σ。<br>'
      + '<b>为什么它能同时解决两个问题：</b>'
      + '<ul>'
      + '<li><b>去重：</b>面板负责「按分类切片」（hover 才出现、一次一个分类）；左栏负责「全站趋势一眼看完」（常驻、无需交互）。'
      + '两者不再是同一份数据的两次渲染。</li>'
      + '<li><b>修指标：</b>直接展示 trending 的真实顺序与真实热度值，删掉自造的 Σ —— 不再有「20 条样本求和」这种噪音指标。</li>'
      + '<li><b>零新增请求：</b>数据就是 store 里已有的 <code>trending</code>，onboarding 成本 = 0，纯渲染改造。</li>'
      + '<li><b>不推翻两栏：</b>用户昨天刚拍板的 <code>--home-rail-w 260/280</code>、sticky、hero 高度公式全部沿用，改动面最小。</li>'
      + '</ul>'
      + '<span class="up">连带处理：</span>顶部过渡带的「最热分类」删掉（它读的就是那个 Σ）；'
      + '面板头的 Σ 改为「趋势 12 条」这类可验证的计数。<br>'
      + '<span class="down">代价：</span>失去「分类热度排序」这个（本来就不准的）视角；'
      + '综艺/动漫/纪录片不再在左栏出现，需要靠顶栏 chip 或 /browse 进入 —— 与面板定位一致，属预期行为。',
    C:
      '<h2>方案 C · 左栏只留分类导航卡（去条目列表）</h2>'
      + '<b>做法：</b>左栏 3 张分类卡删掉 5 条条目列表，只保留「图标 + 分类名 + 今日条数 + 热度条」，'
      + '点击进 <code>/chart?category=x</code>。重复度从「内容级」降到「入口级」。<br>'
      + '<span class="up">优点：</span>改动比 B 更小（只删 JSX 一段 + 微调 CSS）；保留了分类维度这个入口。'
      + '左栏总高从 ~700px 降到 ~300px。<br>'
      + '<span class="down">没根治：</span>它仍是「分类导航」，与顶栏 8 个 chip 职责重叠，只是不再共享列表；'
      + '且 <b>Σ 指标问题原样保留</b>（卡头仍要显示 Σ，除非改成真实计数，那就要为 5 个分类各发一次 discover 请求）。'
  };

  /* ── 渲染 ─────────────────────────────────────────────── */
  var curPlan='now';
  function render(){
    $('#mount').innerHTML=PLANS[curPlan]();
    $('#desc').innerHTML=DESC[curPlan];
  }
  $('#planSeg').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    curPlan=b.dataset.p;
    [].forEach.call(this.querySelectorAll('button'),function(x){x.classList.toggle('is-on',x===b);});
    render();
  });
  $('#wSeg').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    document.documentElement.style.setProperty('--sim-w',b.dataset.w+'px');
    [].forEach.call(this.querySelectorAll('button'),function(x){x.classList.toggle('is-on',x===b);});
  });
  $('#themeBtn').addEventListener('click',function(){
    var dark=document.body.classList.toggle('is-dark');
    this.textContent=dark?'浅色':'深色';
  });
  render();
})();
</script>
</body>
</html>
