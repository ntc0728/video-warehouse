<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CategoryQuickAccess >1280 整改方案对比 · 2026-09-05</title>
<style>
  /* ═════════════════════════════════════════════════════════════════
     首页分类快捷入口 >1280 整改 demo（仅 demo，未动真实源码）
     背景：>1280 现状为 7 个彩色圆形图标卡扁平化置于 hero 上方——
       ① 彩色圆盘与 v2 密度契约后的 B 站风 hero（黑白灰 + 内容优先）气质冲突；
       ② 只有 7 个固定分类，TMDB 全量 genre（电影 19 / 剧集 16）未利用；
       ③ 圆卡占高 ~90px，hero 上方留白层级偏重。
     三个候选（均为 >1280 专属，≤1280 与 TV/app 不动）：
       现状  7 彩色圆卡（对照基线）
       A    频道文字导航条 + 「更多」hover 全量 genre 下拉面板（B站/爱奇艺式）★推荐
       B    YouTube 式横向 pill chips（高频分类 + 高频 genre，可滚动）
       C    保留圆卡，hover 弹出对应类型的 genre 子菜单（最小改动）
     token：与 src/assets/styles/variables.css v2.2 段2 曲线逐字对齐。
     ═════════════════════════════════════════════════════════════════ */

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #f5f6f8; color: #18191c;
  }

  /* ── 顶栏 ── */
  .topbar { position: sticky; top: 0; z-index: 50; background: #fff; border-bottom: 1px solid #e3e5e7; padding: 12px 24px; }
  .topbar h1 { font-size: 15px; font-weight: 600; }
  .topbar p { font-size: 12px; color: #61666d; margin-top: 4px; line-height: 1.6; }
  .topbar .vp { font-variant-numeric: tabular-nums; color: #00a1d6; font-weight: 600; }
  .topbar .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; margin-left: 6px; }
  .tag--rec { background: #fff1f4; color: #fb7299; font-weight: 600; }

  /* ── 方案段 ── */
  .stage-wrap { padding: 16px 24px 0; }
  .stage-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .stage-head .name { font-size: 14px; font-weight: 700; }
  .stage-head .desc { font-size: 12px; color: #61666d; }
  .stage-head .vals { font-size: 12px; color: #9499a0; font-variant-numeric: tabular-nums; }
  .stage { background: #fff; border: 1px solid #e3e5e7; border-radius: 10px; overflow: hidden; margin-bottom: 6px; }
  .stage--now { border: 1px solid #e3e5e7; }
  .stage--a { border: 2px solid #fb7299; }
  .note { font-size: 12px; color: #61666d; line-height: 1.7; padding: 10px 16px; background: #fafbfc; border-top: 1px dashed #e3e5e7; }
  .note b { color: #18191c; }
  .note .url { font-family: Consolas, monospace; font-size: 11px; color: #00a1d6; background: #f0f8ff; padding: 0 4px; border-radius: 3px; }

  /* ═══ 真实 token（v2.2 段2 曲线逐字拷贝，仅取本 demo 用到的档）═══ */
  .stage {
    --ui-scale: 1;
    --text-xs: calc(clamp(11px, 14.195px - 0.19896vw, 12.667px) * var(--ui-scale));
    --text-sm: calc(clamp(12px, 15.32071px - 0.21533vw, 13.667px) * var(--ui-scale));
    --text-base: calc(clamp(13px, 14.91429px - 0.11905vw, 14px) * var(--ui-scale));
    --text-lg: calc(clamp(13.5px, 17.05071px - 0.22366vw, 15.333px) * var(--ui-scale));
    --text-xl: calc(clamp(15px, 19.325px - 0.25937vw, 17.333px) * var(--ui-scale));
    --space-xs: calc(clamp(3.5px, 2.96371px + 0.06983vw, 4.5px) * var(--ui-scale));
    --space-sm: calc(clamp(7px, 5.92741px + 0.13966vw, 9px) * var(--ui-scale));
    --space-md: calc(clamp(9.5px, 7.89104px + 0.2095vw, 12.5px) * var(--ui-scale));
    --space-lg: calc(clamp(14.333px, 11.83001px + 0.32591vw, 19px) * var(--ui-scale));
    --space-xl: calc(clamp(19.667px, 15.73423px + 0.51208vw, 27px) * var(--ui-scale));
    --comp-tab-height: calc(clamp(35.827px, 41.28871px - 0.34137vw, 38.667px) * var(--ui-scale));
    --comp-btn-min-width: calc(clamp(49.136px, 57.27471px - 0.51324vw, 53.333px) * var(--ui-scale));
    --radius-md: calc(clamp(6px, 3.455px + 0.679vw, 8.667px) * var(--ui-scale));
    --radius-lg: calc(clamp(10px, 4.911px + 1.357vw, 15.333px) * var(--ui-scale));
    --icon-md: calc(var(--text-base) * 1.43);
    --icon-lg: calc(var(--text-xl) * 1.50);
  }

  /* ── mini 首页上下文（各方案共用，渲染 CategoryQuickAccess 的真实位置：hero 上方）── */
  .pagepad { padding: 0 var(--space-lg); }
  .mini-hero {
    height: calc((100% ) * 0); /* placeholder */
  }
  .mini-hero {
    height: 150px; border-radius: var(--radius-lg); overflow: hidden; position: relative;
    background: linear-gradient(120deg, #00a1d6 0%, #6b7cff 55%, #9b6bff 100%);
    color: #fff; display: flex; flex-direction: column; justify-content: flex-end;
    padding: var(--space-md) var(--space-lg); margin-top: var(--space-md);
  }
  .mini-hero__t { font-size: var(--text-lg); font-weight: 600; }
  .mini-hero__m { font-size: var(--text-xs); opacity: .85; margin-top: var(--space-xs); }
  .mini-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-md); margin-top: var(--space-md); padding-bottom: var(--space-lg); }
  .mini-card__cover { aspect-ratio: 16/9; border-radius: var(--radius-md); background: linear-gradient(135deg, #dfe3e8, #c9d2dc); }
  .mini-card__t { font-size: var(--text-sm); font-weight: 500; margin-top: var(--space-xs); }
  .mini-card__m { font-size: var(--text-xs); color: #9499a0; margin-top: 2px; }
  @media (width < 1500px) { .mini-row { grid-template-columns: repeat(3, 1fr); } }

  /* ═══ 现状：7 彩色圆卡（>1280 扁平态，照抄真实 CSS 逻辑）═══ */
  .qa-now { display: grid; grid-auto-flow: column; grid-auto-columns: max-content; gap: var(--space-lg); justify-content: center; padding: var(--space-lg) var(--space-md); }
  .qa-now__card { display: flex; flex-direction: column; gap: var(--space-xs); align-items: center; background: none; border: none; cursor: pointer; font: inherit; }
  .qa-now__disc {
    width: calc(var(--icon-lg) * 1.8); height: calc(var(--icon-lg) * 1.8);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: var(--icon-lg); box-shadow: var(--shadow-md, 0 4px 12px rgba(0,0,0,.15));
    transition: transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .qa-now__card:hover .qa-now__disc { transform: translateY(-4px) scale(1.08); }
  .qa-now__label { color: var(--color-text-secondary, #666); font-size: var(--text-xs); font-weight: 500; }

  /* ═══ 方案 A：频道文字导航条 + 全量 genre 下拉 ═══ */
  .qa-a { display: flex; align-items: center; gap: var(--space-md); padding: 0 var(--space-md); height: calc(var(--comp-tab-height) + var(--space-sm)); border-bottom: 1px solid #f0f1f3; position: relative; }
  .qa-a__item {
    display: inline-flex; align-items: center; gap: var(--space-xs);
    height: var(--comp-tab-height); padding: 0 var(--space-sm);
    border: none; background: none; border-radius: var(--radius-md);
    font-size: var(--text-sm); color: #61666d; cursor: pointer; font-family: inherit;
    transition: color .15s ease, background .15s ease; white-space: nowrap;
  }
  .qa-a__item .ic { font-size: var(--icon-md); line-height: 1; opacity: .75; }
  .qa-a__item:hover, .qa-a__item--hot { color: #18191c; }
  .qa-a__item:hover { background: #f6f7f8; }
  .qa-a__item--hot { font-weight: 600; }
  .qa-a__more { margin-left: auto; color: #9499a0; }
  .qa-a__more:hover { color: #fb7299; background: #fff1f4; }
  .qa-a__more .caret { display: inline-block; transition: transform .2s; font-size: 10px; }
  .qa-a:hover .qa-a__more .caret, .qa-a__more-wrap:hover .caret { transform: rotate(180deg); }

  /* 下拉面板：hover 容器（demo 用 CSS hover；真实实现用 hover + focus-within + Esc） */
  .qa-a__panel {
    position: absolute; left: var(--space-md); right: var(--space-md); top: 100%;
    background: #fff; border: 1px solid #e3e5e7; border-radius: var(--radius-lg);
    box-shadow: 0 8px 28px rgba(0,0,0,.12); padding: var(--space-lg);
    display: none; z-index: 40; text-align: left;
  }
  .qa-a:hover .qa-a__panel, .qa-a:focus-within .qa-a__panel { display: block; }
  .qa-a__panel-cols { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-lg); }
  .qa-a__panel h5 { font-size: var(--text-sm); color: #18191c; margin-bottom: var(--space-sm); display: flex; align-items: center; gap: var(--space-xs); }
  .qa-a__panel h5 .n { font-size: var(--text-xs); color: #9499a0; font-weight: 400; }
  .qa-a__chips { display: flex; flex-wrap: wrap; gap: var(--space-xs); }
  .gchip {
    padding: var(--space-xs) var(--space-sm); border-radius: 999px;
    font-size: var(--text-xs); color: #61666d; background: #f6f7f8;
    border: 1px solid transparent; cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .gchip:hover { color: #fb7299; background: #fff1f4; border-color: #ffd0de; }
  .qa-a__panel-foot { margin-top: var(--space-md); padding-top: var(--space-sm); border-top: 1px solid #f0f1f3; font-size: var(--text-xs); color: #9499a0; display: flex; justify-content: space-between; align-items: center; }
  .qa-a__panel-foot a { color: #00a1d6; text-decoration: none; cursor: pointer; }
  .qa-a__panel-foot a:hover { text-decoration: underline; }

  /* ═══ 方案 B：YouTube 式 pill chips 单行 ═══ */
  .qa-b-wrap { display: flex; align-items: center; gap: var(--space-sm); padding: var(--space-sm) var(--space-md); }
  .qa-b__arrow {
    flex: 0 0 auto; width: var(--comp-tab-height); height: var(--comp-tab-height);
    border-radius: 50%; border: none; background: #f6f7f8; color: #61666d;
    cursor: pointer; font-size: var(--icon-md); display: flex; align-items: center; justify-content: center;
  }
  .qa-b__arrow:hover { background: #e3e5e7; }
  .qa-b { display: flex; gap: var(--space-sm); overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth; }
  .qa-b::-webkit-scrollbar { display: none; }
  .qa-b__chip {
    flex: 0 0 auto; height: var(--comp-tab-height); padding: 0 var(--space-lg);
    display: inline-flex; align-items: center; border-radius: 999px;
    font-size: var(--text-sm); color: #18191c; background: #f6f7f8;
    border: 1px solid #e3e5e7; cursor: pointer; font-family: inherit; white-space: nowrap;
    transition: background .15s;
  }
  .qa-b__chip:hover { background: #e9eaee; }
  .qa-b__chip--on { background: #18191c; color: #fff; border-color: #18191c; }
  .qa-b__chip--filter { color: #00a1d6; background: #fff; border-color: #cfe9f5; }
  .qa-b__chip .ic { font-size: var(--icon-md); margin-right: var(--space-xs); }
  .qa-b__sep { flex: 0 0 1px; background: #e3e5e7; margin: var(--space-xs) 0; }

  /* ═══ 方案 C：现状圆卡 + hover 类型 genre 子菜单 ═══ */
  .qa-c { display: grid; grid-auto-flow: column; grid-auto-columns: max-content; gap: var(--space-lg); justify-content: center; padding: var(--space-lg) var(--space-md); }
  .qa-c__card { position: relative; display: flex; flex-direction: column; gap: var(--space-xs); align-items: center; background: none; border: none; cursor: pointer; font: inherit; }
  .qa-c__pop {
    position: absolute; top: calc(100% + var(--space-xs)); left: 50%; transform: translateX(-50%);
    background: #fff; border: 1px solid #e3e5e7; border-radius: var(--radius-md);
    box-shadow: 0 8px 28px rgba(0,0,0,.12); padding: var(--space-sm);
    display: none; z-index: 40; min-width: 200px; text-align: left;
  }
  .qa-c__card:hover .qa-c__pop, .qa-c__card:focus-within .qa-c__pop { display: block; }
  .qa-c__pop .t { font-size: var(--text-xs); color: #9499a0; padding: 0 var(--space-xs) var(--space-xs); }
  .qa-c__pop .gchip { display: block; width: 100%; border-radius: var(--radius-md); background: none; text-align: left; }
  .qa-c__pop .gchip:hover { background: #fff1f4; }
</style>
</head>
<body>

<header class="topbar">
  <h1>CategoryQuickAccess &gt;1280 整改方案对比<span class="tag tag--rec">推荐 A</span></h1>
  <p>当前视口 <span class="vp" id="vpw">—</span>px（本 demo 只针对 &gt;1280 桌面；≤1280 / TV / app 不动）。分类行渲染在 hero 上方的真实位置，token 与 variables.css v2.2 逐字对齐。<br>
  数据基础：TMDB 全量 genre（电影 <b>19</b> 个 / 剧集 <b>16</b> 个，zh-CN），现状仅用其中 3 个（10764 综艺 / 16 动漫 / 99 纪录）。</p>
</header>

<main id="stages"></main>

<script>
  // ── 真实 TMDB genre 数据（zh-CN，/genre/movie/list 与 /genre/tv/list）──
  const MOVIE_GENRES = [
    [28,'动作'],[12,'冒险'],[16,'动画'],[35,'喜剧'],[80,'犯罪'],[99,'纪录'],[18,'剧情'],
    [10751,'家庭'],[14,'奇幻'],[36,'历史'],[27,'恐怖'],[10402,'音乐'],[9648,'悬疑'],
    [10749,'爱情'],[878,'科幻'],[10770,'电视电影'],[53,'惊悚'],[10752,'战争'],[37,'西部'],
  ];
  const TV_GENRES = [
    [10759,'动作冒险'],[16,'动画'],[10762,'儿童'],[35,'喜剧'],[80,'犯罪'],[99,'纪录'],
    [18,'剧情'],[10751,'家庭'],[10763,'新闻'],[10764,'真人秀'],[10765,'科幻&奇幻'],
    [10766,'肥皂剧'],[10767,'谈话'],[10768,'战争&政治'],[37,'西部'],[9648,'悬疑'],
  ];
  const chip = (g) => `<button class="gchip" data-url="/browse?mediaType=movie&genre=${g[0]}">${g[1]}</button>`;
  const chipTv = (g) => `<button class="gchip" data-url="/browse?mediaType=tv&genre=${g[0]}">${g[1]}</button>`;

  // ── 共用 mini 上下文 ──
  const CONTEXT = `
    <div class="pagepad">
      {{CATEGORY}}
      <div class="mini-hero">
        <div class="mini-hero__t">沙丘 3（2026）</div>
        <div class="mini-hero__m">科幻 / 冒险 · 8.6 分 · v2.2 token 渲染</div>
      </div>
      <div class="mini-row">
        <div><div class="mini-card__cover"></div><div class="mini-card__t">星际穿越</div><div class="mini-card__m">2014 · 科幻</div></div>
        <div><div class="mini-card__cover"></div><div class="mini-card__t">奥本海默</div><div class="mini-card__m">2023 · 传记</div></div>
        <div><div class="mini-card__cover"></div><div class="mini-card__t">沙丘 2</div><div class="mini-card__m">2024 · 科幻</div></div>
      </div>
    </div>`;

  // ── 现状 ──
  const NOW_CATS = [
    ['▦','#6366f1','全部'],['🎬','#ff4757','电影'],['📺','#7c3aed','剧集'],['🎤','#f97316','综艺'],
    ['✨','#06b6d4','动漫'],['📷','#16a34a','纪录片'],['🏆','#eab308','排行榜'],
  ];
  const nowHTML = `
    <div class="qa-now">
      ${NOW_CATS.map(c => `<button class="qa-now__card"><span class="qa-now__disc" style="background:linear-gradient(135deg,${c[1]},${c[1]}cc)">${c[0]}</span><span class="qa-now__label">${c[2]}</span></button>`).join('')}
    </div>`;

  // ── 方案 A ──
  const aHTML = `
    <div class="qa-a">
      <button class="qa-a__item qa-a__item--hot"><span class="ic">▦</span>首页</button>
      <button class="qa-a__item"><span class="ic">🎬</span>电影</button>
      <button class="qa-a__item"><span class="ic">📺</span>剧集</button>
      <button class="qa-a__item"><span class="ic">🎤</span>综艺</button>
      <button class="qa-a__item"><span class="ic">✨</span>动漫</button>
      <button class="qa-a__item"><span class="ic">📷</span>纪录片</button>
      <button class="qa-a__item"><span class="ic">🏆</span>排行榜</button>
      <button class="qa-a__item qa-a__more qa-a__more-wrap"><span class="ic">☰</span>全部分类 <span class="caret">▾</span></button>
      <div class="qa-a__panel">
        <div class="qa-a__panel-cols">
          <div>
            <h5>🎬 电影类型 <span class="n">TMDB movie · 19</span></h5>
            <div class="qa-a__chips">${MOVIE_GENRES.map(chip).join('')}</div>
          </div>
          <div>
            <h5>📺 剧集类型 <span class="n">TMDB tv · 16</span></h5>
            <div class="qa-a__chips">${TV_GENRES.map(chipTv).join('')}</div>
          </div>
        </div>
        <div class="qa-a__panel-foot">
          <span>hover 顶部导航即展开（真实实现：hover + focus-within + Esc 关闭）</span>
          <a data-url="/browse">去 Browse 自定义筛选 →</a>
        </div>
      </div>
    </div>`;

  // ── 方案 B ──
  const HOT_GENRES = [[28,'动作'],[35,'喜剧'],[878,'科幻'],[9648,'悬疑'],[10749,'爱情'],[16,'动画电影'],[27,'恐怖'],[18,'剧情']];
  const bHTML = `
    <div class="qa-b-wrap">
      <button class="qa-b__arrow" onclick="scrollQa(-1)">‹</button>
      <div class="qa-b" id="qa-b">
        <button class="qa-b__chip qa-b__chip--on"><span class="ic">▦</span>全部</button>
        <button class="qa-b__chip"><span class="ic">🎬</span>电影</button>
        <button class="qa-b__chip"><span class="ic">📺</span>剧集</button>
        <button class="qa-b__chip">综艺</button>
        <button class="qa-b__chip">动漫</button>
        <button class="qa-b__chip">纪录片</button>
        <button class="qa-b__chip">排行榜</button>
        <div class="qa-b__sep"></div>
        ${HOT_GENRES.map(g => `<button class="qa-b__chip" data-url="/browse?mediaType=movie&genre=${g[0]}">${g[1]}</button>`).join('')}
        <button class="qa-b__chip qa-b__chip--filter"><span class="ic">⚙</span>全部类型…</button>
      </div>
      <button class="qa-b__arrow" onclick="scrollQa(1)">›</button>
    </div>`;
  window.scrollQa = (d) => { document.getElementById('qa-b').scrollBy({ left: d * 320 }); };

  // ── 方案 C ──
  const cHTML = `
    <div class="qa-c">
      ${NOW_CATS.slice(0, 6).map(c => {
        const pops = { '电影': MOVIE_GENRES.slice(0, 8), '剧集': TV_GENRES.slice(0, 8) };
        const pop = pops[c[2]];
        return `<button class="qa-c__card">
          <span class="qa-now__disc" style="background:linear-gradient(135deg,${c[1]},${c[1]}cc)">${c[0]}</span>
          <span class="qa-now__label">${c[2]}</span>
          ${pop ? `<span class="qa-c__pop"><span class="t">${c[2]} · 热门类型（demo 取前 8，真实取全量）</span>${pop.map(g => `<button class="gchip" data-url="/browse?mediaType=${c[2]==='电影'?'movie':'tv'}&genre=${g[0]}">${g[1]}</button>`).join('')}</span>` : ''}
        </button>`;
      }).join('')}
    </div>`;

  const STAGES = [
    { key: 'now', name: '现状基线', desc: '7 彩色圆卡扁平化（真实 CSS 照抄）', cls: 'stage--now', cat: nowHTML,
      note: '<b>问题</b>：① 彩色圆盘与 B 站风黑白灰 hero 气质冲突、7 个渐变色抢视线；② 只覆盖 3 个 TMDB genre，类型探索路径弱；③ 占高 ≈90px（底盘 47 + 图标间距 + label），hero 之上层级偏重。' },
    { key: 'a', name: 'A · 频道导航条 + 全量 genre 下拉 ★推荐', desc: 'B站/爱奇艺式：文字导航（hover 浅灰底）+ 右侧「全部分类 ▾」hover 展开双列面板', cls: 'stage--a', cat: aHTML,
      note: '<b>跳转</b>：主导航项 → <span class="url">/browse?category=movie</span>（现状不变）；genre chip → <span class="url">/browse?mediaType=movie&genre=878</span>（browse 需新增 genre query 支持，CATEGORY_CONFIG 已有 defaultGenreIds 机制可复用）。<br><b>优点</b>：与 B 站 hero 气质一致（无彩色、密度高）、行高从 ≈90px 压到 ≈50px（comp-tab-height+space-sm）、全量 35 个 genre 一次可达；<b>代价</b>：改动面最大（重写组件 + browse genre query + 下拉键盘导航）。' },
    { key: 'b', name: 'B · YouTube 式 pill chips', desc: '单行横向 pill：7 分类 + 高频 genre + 「全部类型…」，两侧箭头滚动', cls: '', cat: bHTML,
      note: '<b>跳转</b>：同 A（genre chip 直达）。<b>优点</b>：现代轻量、 genre 常驻可见（无需 hover）；<b>缺点</b>：与 B 站参照差异大、chips 数量多时滚动查找成本高、「当前态」高亮需要 Home↔Browse 状态同步。' },
    { key: 'c', name: 'C · 圆卡保留 + hover genre 子菜单', desc: '最小改动：现状圆卡不动，仅电影/剧集 hover 弹出类型子菜单', cls: '', cat: cHTML,
      note: '<b>优点</b>：改动面最小（组件内加 popover）、移动端零风险；<b>缺点</b>：彩色圆盘的气质问题原样保留、子菜单 hover 瞄准路径长（每卡一个 popover）。' },
  ];

  const root = document.getElementById('stages');
  root.innerHTML = STAGES.map(s => `
    <section class="stage-wrap">
      <div class="stage-head">
        <span class="name">${s.name}</span>
        <span class="desc">${s.desc}</span>
        <span class="vals" data-vals="${s.key}"></span>
      </div>
      <div class="stage ${s.cls}">${CONTEXT.replace('{{CATEGORY}}', s.cat)}</div>
      <div class="note">${s.note}</div>
    </section>`).join('');

  // 值回显（1440 处关键 token 解析值）
  function render() {
    document.getElementById('vpw').textContent = window.innerWidth;
    const probe = document.querySelector('.valprobe');
    if (!probe) return;
    probe.style.fontSize = 'var(--text-sm)';
    const sm = parseFloat(getComputedStyle(probe).fontSize).toFixed(2);
    probe.style.height = 'var(--comp-tab-height)';
    const tab = parseFloat(getComputedStyle(probe).height).toFixed(1);
    document.querySelectorAll('[data-vals]').forEach(el => {
      el.innerHTML = `1440: text-sm <b>${sm}</b> · 行高 <b>${tab}px</b>`;
    });
  }
  const probe = document.createElement('div');
  probe.className = 'valprobe';
  probe.style.cssText = 'position:absolute;visibility:hidden;pointer-events:none;';
  document.body.appendChild(probe);
  window.addEventListener('resize', render);
  render();

  // genre chip 点击 → 演示跳转目标（demo 不真跳）
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-url]');
    if (t) console.log('[demo] 跳转目标:', t.dataset.url);
  });
</script>
</body>
</html>
