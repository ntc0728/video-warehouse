<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KinoTV 首页 Demo 总览 · 7 款风格 × 4 端</title>
<style>
  :root {
    --shell-bg: #101014;
    --shell-fg: #e8e6e1;
    --shell-dim: #8a8880;
    --shell-line: #2c2c33;
    --shell-accent: #d4a24e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--shell-bg);
    color: var(--shell-fg);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  /* ── 顶部切换条 ─────────────────────────── */
  .shell-bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 7px 16px 5px;
    border-bottom: 1px solid var(--shell-line);
    background: #16161b;
    flex-wrap: wrap;
  }
  .shell-bar.row2 {
    padding: 5px 16px 8px;
    border-bottom: 1px solid #202026;
    background: #121217;
  }
  .shell-brand {
    font-family: Georgia, "Songti SC", "SimSun", serif;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-right: 14px;
    font-size: 14px;
    color: var(--shell-accent);
    white-space: nowrap;
  }
  .shell-label {
    font-size: 11px;
    color: var(--shell-dim);
    letter-spacing: 0.14em;
    margin: 0 8px 0 2px;
    white-space: nowrap;
  }
  .shell-tab {
    appearance: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--shell-dim);
    font-size: 12.5px;
    line-height: 1;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
    font-family: inherit;
  }
  .shell-tab:hover { color: var(--shell-fg); }
  .shell-tab.active {
    color: var(--shell-fg);
    border-color: var(--shell-line);
    background: #22222a;
  }
  .shell-tab .tno {
    font-family: Georgia, serif;
    color: var(--shell-accent);
    margin-right: 5px;
    font-size: 11px;
  }
  .shell-tab .dno {
    margin-right: 5px;
    font-size: 11px;
    color: var(--shell-accent);
  }
  .shell-note {
    margin-left: auto;
    font-size: 11.5px;
    color: var(--shell-dim);
    white-space: nowrap;
  }
  /* ── demo 容器 ─────────────────────────── */
  .shell-stage {
    flex: 1 1 auto;
    position: relative;
    background: var(--shell-bg);
    overflow: hidden;
  }
  .shell-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: none;
    background: #fff;
  }
  .shell-frame.active { display: block; }
  /* 21:9 超宽模拟：iframe 固定 3440×1440 CSS 视口，JS scale contain 居中 */
  .shell-stage.uw .shell-frame {
    width: 3440px;
    height: 1440px;
    inset: auto;
    left: 0;
    top: 0;
    transform-origin: 0 0;
    box-shadow: 0 0 0 1px #000, 0 20px 80px rgba(0,0,0,.6);
  }
  .uw-caption {
    position: absolute;
    left: 50%;
    bottom: 10px;
    transform: translateX(-50%);
    z-index: 10;
    font-size: 11.5px;
    letter-spacing: 0.12em;
    color: var(--shell-dim);
    background: rgba(16,16,20,.85);
    border: 1px solid var(--shell-line);
    border-radius: 999px;
    padding: 6px 14px;
    display: none;
    pointer-events: none;
    white-space: nowrap;
  }
  .shell-stage.uw .uw-caption { display: block; }
</style>
</head>
<body>

<nav class="shell-bar" id="shellBar">
  <span class="shell-brand">KinoTV · Demo 总览</span>
  <span class="shell-label">风格</span>
  <button class="shell-tab" data-demo="home-style-e-typographic"><span class="tno">00</span>E 报刊排版（旧基准）</button>
  <button class="shell-tab" data-demo="home-e-v1-faithful"><span class="tno">V1</span>V1 结构忠实版</button>
  <button class="shell-tab" data-demo="home-e-v2-edit"><span class="tno">V2</span>V2 编辑部重排版</button>
  <button class="shell-tab" data-demo="home-e-v3-rail"><span class="tno">V3</span>V3 左栏动线版</button>
  <button class="shell-tab active" data-demo="home-n1-cinemaglow"><span class="tno">N1</span>N1 光晕影院</button>
  <button class="shell-tab" data-demo="home-n2-gallery"><span class="tno">N2</span>N2 画廊白盒</button>
  <button class="shell-tab" data-demo="home-n3-stage"><span class="tno">N3</span>N3 宽幅舞台</button>
  <span class="shell-note">真实 CMS 数据 · N 系 = 全新方向（非报刊系）</span>
</nav>

<nav class="shell-bar row2" id="devBar">
  <span class="shell-label">设备</span>
  <button class="shell-tab active" data-device="desktop"><span class="dno">▣</span>桌面</button>
  <button class="shell-tab" data-device="tv"><span class="dno">◉</span>TV · 10-foot</button>
  <button class="shell-tab" data-device="beamer"><span class="dno">▤</span>投影仪</button>
  <button class="shell-tab" data-device="uw"><span class="dno">▭</span>21:9 超宽模拟</button>
  <span class="shell-note" id="devNote">TV = zoom 1.5×·列数锁低档·安全区 3.5%·焦点高亮｜投影 = zoom 1.4×·浅色自动转深｜超宽 = 3440×1440 视口·列数升档</span>
</nav>

<div class="shell-stage" id="shellStage">
  <div class="uw-caption">模拟 3440×1440 · 21:9 —— 触发 width≥2560 与 aspect-ratio≥21/9 两档升列</div>
</div>

<script>
(function () {
  var stage = document.getElementById("shellStage");
  var tabs = Array.prototype.slice.call(document.querySelectorAll("#shellBar .shell-tab"));
  var devBtns = Array.prototype.slice.call(document.querySelectorAll("#devBar .shell-tab"));
  var frames = {};
  var current = null;
  var device = "desktop";
  var UW_W = 3440, UW_H = 1440;

  function frameSrc(name) {
    return name + ".html" + ((device === "tv" || device === "beamer") ? "?device=" + device : "");
  }

  function getFrame(name) {
    if (!frames[name]) {
      var f = document.createElement("iframe");
      f.className = "shell-frame";
      f.setAttribute("title", name);
      f.src = frameSrc(name);
      stage.appendChild(f);
      frames[name] = f;
    }
    return frames[name];
  }

  function fitUw() {
    if (device !== "uw") return;
    var r = stage.getBoundingClientRect();
    var k = Math.min(r.width / UW_W, r.height / UW_H);
    Object.keys(frames).forEach(function (n) {
      var f = frames[n];
      f.style.transform = "scale(" + k + ")";
      f.style.left = Math.max(0, (r.width - UW_W * k) / 2) + "px";
      f.style.top = Math.max(0, (r.height - UW_H * k) / 2) + "px";
    });
  }

  function applyDevice(dev) {
    if (device === dev) return;
    device = dev;
    devBtns.forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-device") === dev);
    });
    stage.classList.toggle("uw", dev === "uw");
    if (current) {
      var f = getFrame(current);
      f.src = frameSrc(current); // 重载以应用/清除 device 参数
    }
    fitUw();
  }

  function show(name) {
    if (current === name) return;
    tabs.forEach(function (t) {
      t.classList.toggle("active", t.getAttribute("data-demo") === name);
    });
    if (current && frames[current]) frames[current].classList.remove("active");
    var f = getFrame(name);
    if (f.getAttribute("src") !== frameSrc(name)) f.src = frameSrc(name);
    f.classList.add("active");
    current = name;
    fitUw();
  }

  tabs.forEach(function (t) {
    t.addEventListener("click", function () {
      show(t.getAttribute("data-demo"));
    });
  });
  devBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      applyDevice(b.getAttribute("data-device"));
    });
  });
  addEventListener("resize", fitUw);

  // 默认：N1 光晕影院
  show("home-n1-cinemaglow");
})();
</script>
</body>
</html>
