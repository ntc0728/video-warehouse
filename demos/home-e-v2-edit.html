<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KinoTV Demo E-V2 — 报刊版式 · 现有首页编辑部重排版</title>
<style>
/* ============================================================
   Demo E-V2 · 报刊版式 × 现有首页模块编辑部式重排
   重排策略：趋势榜（CategoryHeatRow）升为首屏右栏报纸榜单表；
   7 行（正在热映/热门电影/高分电影/即将上映/热门剧集/高分剧集/今日播出）
   收敛为 4 个编号版块（院线/电影/剧集/今日播出），版块内 tab 切换；
   继续观看=晚间节目单；分类索引并入版块 tabs。
   数据：CMS 真实接口；零卡片；首屏预算制；封顶 2200
   ============================================================ */
:root{
  --paper:#fbfaf7; --ink:#141416; --ink-2:#57575f; --ink-3:#98989f;
  --rule:#d8d5cd; --accent:#b03a1e;
  --serif:"Noto Serif SC","Source Han Serif SC","STSong",serif;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --content-max:2200px;
  --pad-x:clamp(16px,2.4vw,44px); --gap:clamp(12px,1vw,20px);
  --poster-n:6; --cont-n:4;
}
@media (width>=1440px){ :root{--pad-x:60px; --poster-n:7; --cont-n:5} }
@media (width>=1920px){ :root{--pad-x:100px; --poster-n:8; --cont-n:6} }
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:100%;object-fit:cover}
.page{max-width:var(--content-max);margin:0 auto;padding:0 var(--pad-x)}

/* ---------- 报头 ---------- */
.masthead{padding-top:clamp(16px,2.4vh,28px)}
.mast-row{display:flex;align-items:baseline;justify-content:space-between;gap:20px;
  border-bottom:3px solid var(--ink);padding-bottom:clamp(8px,1.2vh,14px)}
.brand{font-family:var(--serif);font-size:clamp(26px,2.2vw,42px);font-weight:900;letter-spacing:.04em}
.brand em{color:var(--accent);font-style:normal}
.edition{font-size:clamp(11.5px,.76vw,13.5px);color:var(--ink-2);text-align:right;line-height:1.7}
.mast-nav{display:flex;gap:clamp(16px,1.6vw,32px);padding:clamp(8px,1.2vh,12px) 0;
  border-bottom:1px solid var(--rule);font-size:clamp(13px,.85vw,15px);align-items:center;flex-wrap:wrap}
.mast-nav a{color:var(--ink-2);transition:.2s}
.mast-nav a.on,.mast-nav a:hover{color:var(--ink);font-weight:700}
.mast-nav .search{margin-left:auto;color:var(--ink-3)}
.data-badge{font-size:clamp(10.5px,.68vw,12px);color:var(--ink-3);border:1px solid var(--rule);
  border-radius:99px;padding:2px 10px;white-space:nowrap}
.data-badge b{color:var(--accent);font-weight:700}

/* ---------- 首屏：头条对开 + 右栏趋势榜（两栏 7:5） ---------- */
.front{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);
  gap:clamp(24px,2.6vw,56px);height:clamp(340px,48vh,560px);margin-top:clamp(16px,2.4vh,28px)}
.hl-text{display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:clamp(6px,1.4vh,18px);min-width:0}
.hl-text .kick{font-size:clamp(11.5px,.76vw,13.5px);letter-spacing:.28em;text-transform:uppercase;color:var(--accent);
  font-weight:800;margin-bottom:clamp(8px,1.2vh,14px)}
.hl-text h1{font-family:var(--serif);font-size:clamp(26px,4.6vh,54px);font-weight:900;line-height:1.18;margin-bottom:clamp(8px,1.4vh,16px)}
.hl-text .deck{font-size:clamp(13px,.92vw,16.5px);line-height:1.8;color:var(--ink-2);max-width:56ch;margin-bottom:clamp(10px,1.8vh,20px);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hl-text .meta{font-size:clamp(12px,.8vw,14px);color:var(--ink-3);display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:clamp(12px,2vh,22px)}
.hl-text .meta .star{color:var(--accent);font-weight:800}
.hl-actions{display:flex;gap:clamp(14px,1.4vw,26px);align-items:center}
.hl-actions .play{font-weight:800;font-size:clamp(13.5px,.9vw,16px);border-bottom:2px solid var(--accent);padding-bottom:3px;cursor:pointer}
.hl-actions .ghost{font-size:clamp(12.5px,.82vw,14.5px);color:var(--ink-2);cursor:pointer}
.hl-pic{position:relative;overflow:hidden;border-radius:clamp(6px,.5vw,10px);background:#eceade}
.hl-pic img{position:absolute;inset:0;transition:transform 6s}
.hl-pic:hover img{transform:scale(1.025)}
.hl-pic .cap{position:absolute;left:0;right:0;bottom:0;padding:38px 16px 12px;color:#fff;
  background:linear-gradient(180deg,transparent,rgba(12,12,14,.82));font-size:clamp(11.5px,.74vw,13px)}

/* 右栏：今日趋势报纸榜单（对应 CategoryHeatRow 升版） */
.trend-rail{border-top:3px solid var(--ink);min-width:0}
.trend-rail .tr-head{padding:clamp(8px,1.2vh,14px) 0 clamp(6px,1vh,10px);display:flex;align-items:baseline;gap:10px}
.trend-rail .tr-head h3{font-family:var(--serif);font-size:clamp(17px,1.3vw,24px);font-weight:900}
.trend-rail .tr-head span{font-size:clamp(11px,.72vw,13px);color:var(--ink-3);margin-left:auto}
.trend-rail .tri{display:grid;grid-template-columns:clamp(24px,2vw,36px) minmax(0,1fr) auto;
  gap:clamp(10px,1vw,18px);align-items:baseline;padding:clamp(7px,1.1vh,12px) 0;border-bottom:1px solid var(--rule);cursor:pointer}
.trend-rail .tri .no{font-family:var(--serif);font-weight:900;color:var(--ink-3);font-size:clamp(15px,1.2vw,21px)}
.trend-rail .tri:nth-child(-n+3) .no{color:var(--accent)}
.trend-rail .tri b{font-size:clamp(13px,.9vw,15.5px);font-weight:700;display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trend-rail .tri span{font-size:clamp(10.5px,.7vw,12.5px);color:var(--ink-3)}
.trend-rail .tri .heat{font-size:clamp(12px,.84vw,14.5px);font-weight:800}

/* ---------- 小节头 ---------- */
.sec{margin-top:clamp(24px,4vh,48px)}
.sec-head{display:flex;align-items:baseline;gap:clamp(12px,1.1vw,20px);
  border-bottom:1px solid var(--rule);padding-bottom:clamp(8px,1.2vh,14px);margin-bottom:clamp(14px,2vh,24px)}
.sec-head .no{font-family:var(--serif);font-size:clamp(22px,2vw,38px);font-weight:900;color:var(--accent);line-height:1}
.sec-head h2{font-family:var(--serif);font-size:clamp(20px,1.9vw,34px);font-weight:900}
.sec-head .sub{font-size:clamp(11.5px,.76vw,13.5px);color:var(--ink-3)}
.sec-head .more{margin-left:auto;font-size:clamp(12px,.8vw,14px);color:var(--ink-2)}
.sec-head .more:hover{color:var(--ink)}

/* ---------- 继续观看（晚间节目单） ---------- */
.cont-grid{display:grid;grid-template-columns:repeat(var(--cont-n),minmax(0,1fr));gap:var(--gap)}
.cont-cell{cursor:pointer;min-width:0}
.cont-cell .th{aspect-ratio:16/9;overflow:hidden;border-radius:clamp(4px,.4vw,7px);position:relative;background:#eceade}
.cont-cell .th img{position:absolute;inset:0;transition:transform .5s}
.cont-cell:hover .th img{transform:scale(1.05)}
.cont-cell .th .time{position:absolute;right:7px;bottom:7px;font-size:clamp(10px,.66vw,11.5px);color:#fff;background:rgba(12,12,14,.6);padding:2px 7px;border-radius:4px}
.cont-cell .prog{height:2px;background:var(--rule);position:relative;margin-top:clamp(6px,.9vh,10px)}
.cont-cell .prog b{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.cont-cell h4{font-family:var(--serif);font-size:clamp(14px,.95vw,17px);font-weight:900;margin-top:clamp(6px,1vh,11px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cont-cell p{font-size:clamp(11.5px,.74vw,13px);color:var(--ink-3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 版块 tabs（7 行收敛） ---------- */
.blk-tabs{display:flex;gap:clamp(14px,1.4vw,28px);margin-bottom:clamp(12px,1.8vh,20px);flex-wrap:wrap;align-items:baseline}
.blk-tabs a{font-size:clamp(13px,.9vw,16px);color:var(--ink-2);padding-bottom:4px;border-bottom:2px solid transparent;cursor:pointer;transition:.2s}
.blk-tabs a.on{color:var(--ink);font-weight:800;border-bottom-color:var(--accent)}
.blk-tabs a:hover{color:var(--ink)}
.blk-tabs .cnt{font-family:var(--sans);font-weight:500;font-size:clamp(11px,.72vw,13px);color:var(--ink-3);margin-left:4px}
.poster-row{display:grid;grid-auto-flow:column;
  grid-auto-columns:calc((100% - (var(--poster-n) - 1)*var(--gap)) / var(--poster-n));gap:var(--gap);
  transition:opacity .25s}
.poster-row.fading{opacity:0}
.poster-row .p{position:relative;aspect-ratio:2/3;overflow:hidden;border-radius:clamp(4px,.4vw,7px);cursor:pointer;background:#eceade}
.poster-row .p img{position:absolute;inset:0;transition:transform .5s}
.poster-row .p:hover img{transform:scale(1.05)}
.poster-row .p .lab{position:absolute;left:0;right:0;bottom:0;padding:40px 11px 9px;color:#fff;
  background:linear-gradient(180deg,transparent,rgba(12,12,14,.85));opacity:0;transition:.3s}
.poster-row .p:hover .lab{opacity:1}
.poster-row .p .lab h4{font-size:clamp(12.5px,.88vw,15.5px);font-weight:700}
.poster-row .p .lab p{font-size:clamp(10.5px,.68vw,12px);opacity:.75}
.poster-row .p .sc{position:absolute;top:clamp(6px,.55vw,10px);right:clamp(6px,.55vw,10px);
  font-size:clamp(10.5px,.7vw,12px);font-weight:800;background:#fff;color:var(--ink);
  padding:2px 7px;border-radius:4px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 骨架 ---------- */
.skl{position:relative;overflow:hidden;background:#eceade}
.skl::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shimmer 1.4s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.skl-line{height:13px;border-radius:4px;margin-top:8px}

footer{margin:clamp(28px,5vh,56px) 0 clamp(22px,3vh,40px);padding-top:clamp(12px,1.6vh,20px);
  border-top:3px solid var(--ink);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;
  font-size:clamp(11.5px,.76vw,13.5px);color:var(--ink-3)}
</style>
<style id="xdev-css">
/* ==== 设备适配层：TV 10-foot / 投影仪 / 超宽 ==== */
html[data-device="tv"]{--poster-n:6;--cont-n:4;--content-max:2200px}
html[data-device="tv"] body{zoom:1.5;padding:3.5vh 3.5vw!important;box-sizing:border-box}
html[data-device="tv"] :focus{outline:3px solid #d4a24e!important;outline-offset:3px;border-radius:4px}
html[data-device="beamer"]{--poster-n:7;--cont-n:5}
html[data-device="beamer"] body{zoom:1.4}
html[data-device="beamer"][data-invert="1"] body{filter:invert(1) hue-rotate(180deg);background:#fff}
html[data-device="beamer"][data-invert="1"] img,html[data-device="beamer"][data-invert="1"] video{filter:invert(1) hue-rotate(180deg)}
@media (width>=2560px){:root{--content-max:2600px;--pad-x:120px;--poster-n:9;--cont-n:7}}
@media (min-aspect-ratio:21/9){:root{--content-max:min(3000px,92vw);--pad-x:140px;--poster-n:10;--cont-n:8}}
.xdev-badge{position:fixed;right:14px;bottom:12px;z-index:99999;font:600 11px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.12em;color:#d4a24e;background:rgba(16,16,20,.82);border:1px solid rgba(212,162,78,.5);border-radius:999px;padding:6px 12px;pointer-events:none}
</style>
</head>
<body>
<div class="page">

  <header class="masthead">
    <div class="mast-row">
      <div class="brand">Kino<em>TV</em> 影视日报</div>
      <div class="edition" id="edition"></div>
    </div>
    <nav class="mast-nav">
      <a class="on" href="#">首页</a><a href="#">剧集</a><a href="#">电影</a><a href="#">综艺</a><a href="#">动漫</a><a href="#">榜单</a><a href="#">IPTV</a>
      <span class="data-badge" id="data-badge">真实接口拉取中…</span>
      <span class="search">搜索 ⌘K</span>
    </nav>
  </header>

  <!-- 首屏：头条对开 + 右栏今日趋势榜（对应 HeroBanner + CategoryHeatRow 同屏） -->
  <section class="front">
    <div class="hl-text" id="hl-text"></div>
    <div class="hl-pic" id="hl-pic"></div>
    <aside class="trend-rail" id="trend-rail"></aside>
  </section>

  <!-- 继续观看 → 晚间节目单 -->
  <section class="sec">
    <div class="sec-head">
      <span class="no">01</span><h2>晚间节目单 · 继续观看</h2><span class="sub">真实片源 · 进度为演示值</span>
      <a class="more" href="#">全部记录 →</a>
    </div>
    <div class="cont-grid" id="cont-grid"></div>
  </section>

  <!-- 7 行收敛为 4 版块 -->
  <div id="blocks"></div>

  <footer>
    <span>KinoTV — Demo E-V2 · 报刊版式 × 编辑部重排版 · 原 7 行收敛为 4 版块（院线/电影/剧集/今日），趋势榜升为首屏右栏榜单表</span>
    <span>仅供风格评审</span>
  </footer>

</div>

<script>
/* ============ 数据层：与 E 基准同口径 ============ */
const SOURCES = [
  { name: "豆瓣资源", api: "https://caiji.dbzy5.com/api.php/provide/vod" },
  { name: "茅台资源", api: "https://caiji.maotaizy.cc/api.php/provide/vod" }
];
const TYPE_NAME = { 1: "电影", 2: "剧集", 3: "综艺", 4: "动漫" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const stripHtml = (s) => String(s ?? "").replace(/<[^>]*>/g, "").replace(/\s+/g, " ").trim();
const hash = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };

async function cms(api, params) {
  const url = api + "?" + new URLSearchParams(params).toString();
  const res = await fetch(url, { signal: AbortSignal.timeout(10000) });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const j = await res.json();
  if (j.code != null && j.code !== 1) throw new Error(j.msg || "CMS 业务异常");
  return j;
}
function mapItem(x, srcName) {
  return {
    id: x.vod_id, title: x.vod_name || "未命名", pic: x.vod_pic || "",
    type: TYPE_NAME[x.type_id_1 ?? x.type_id] || "影视", year: x.vod_year || "",
    remarks: x.vod_remarks || "", cls: (x.vod_class || "").split(",")[0] || "",
    score: parseFloat(x.vod_score) > 0 ? x.vod_score : null,
    content: stripHtml(x.vod_content), src: srcName
  };
}
async function fetchAll() {
  const jobs = [
    cms(SOURCES[0].api, { ac: "videolist", pg: 1, h: 168 }),
    cms(SOURCES[1].api, { ac: "videolist", pg: 1, h: 168 }),
    ...[1, 2].flatMap((t) => SOURCES.map((s) => cms(s.api, { ac: "videolist", t, pg: 1 })))
  ];
  const [latestDb, latestMt, movieDb, movieMt, tvDb, tvMt] = (await Promise.allSettled(jobs)).map((r) => r.status === "fulfilled" ? r.value.list ?? [] : []);
  const uniq = (arr) => { const s = new Set(); return arr.filter((x) => !s.has(x.title) && s.add(x.title)); };
  return {
    latest: uniq([...latestDb, ...latestMt].map((x) => mapItem(x, x.vod_pic?.includes("dbzy") ? SOURCES[0].name : SOURCES[1].name))),
    movies: uniq([...movieDb, ...movieMt].map((x) => mapItem(x, SOURCES[0].name))),
    tvs: uniq([...tvDb, ...tvMt].map((x) => mapItem(x, SOURCES[1].name)))
  };
}

/* ============ 渲染 ============ */
let DATA = null;
const ROT = (arr, k) => arr.length ? [...arr.slice(k % arr.length), ...arr.slice(0, k % arr.length)] : arr;
const byScore = (arr) => [...arr].sort((a, b) => (b.score || 0) - (a.score || 0));

/* 4 版块定义（原 7 行收敛，tab 内为原行标题） */
const BLOCKS = [
  { no: "02", title: "院线", sub: "正在热映 × 即将上映",
    tabs: [{ t: "正在热映", items: () => DATA.movies.slice(0, 16) }, { t: "即将上映", items: () => ROT(DATA.movies, 9) }] },
  { no: "03", title: "电影片库", sub: "热门 × 高分",
    tabs: [{ t: "热门电影", items: () => ROT(DATA.movies, 5) }, { t: "高分电影", items: () => byScore(DATA.movies) }] },
  { no: "04", title: "剧集场", sub: "热门 × 高分",
    tabs: [{ t: "热门剧集", items: () => DATA.tvs.slice(0, 16) }, { t: "高分剧集", items: () => byScore(DATA.tvs) }] },
  { no: "05", title: "今日播出", sub: "近 24h 真实更新 · 对应原「今日播出」行",
    tabs: [{ t: "今日更新", items: () => DATA.latest.slice(0, 16) }] }
];

function renderSkeletons() {
  $("hl-text").innerHTML = `<div class="skl skl-line" style="width:90px"></div>
    <div class="skl skl-line" style="height:34px;margin-top:14px"></div>
    <div class="skl skl-line"></div><div class="skl skl-line" style="width:70%"></div>`;
  $("hl-pic").innerHTML = `<div class="skl" style="position:absolute;inset:0"></div>`;
  $("trend-rail").innerHTML = `<div class="tr-head"><span class="skl skl-line" style="width:90px;margin:0"></span></div>`
    + Array(6).fill(0).map(() => `<div class="tri"><span class="skl skl-line" style="width:22px;margin:0"></span><span class="skl skl-line" style="margin:0"></span><span class="skl skl-line" style="width:40px;margin:0"></span></div>`).join("");
  $("cont-grid").innerHTML = Array(4).fill(0).map(() =>
    `<div class="cont-cell"><div class="th skl"></div><div class="skl skl-line" style="width:60%"></div></div>`).join("");
  $("blocks").innerHTML = Array(2).fill(0).map(() => `
    <section class="sec"><div class="sec-head"><span class="skl skl-line" style="width:34px;margin:0"></span>
      <span class="skl skl-line" style="width:120px;margin:0"></span></div>
      <div class="poster-row">${Array(6).fill(0).map(() => `<div class="p skl"></div>`).join("")}</div></section>`).join("");
}

function renderMasthead(ok) {
  const d = new Date();
  const week = Math.ceil(((d - new Date(d.getFullYear(), 0, 1)) / 864e5 + 1) / 7);
  const wc = "日一二三四五六"[d.getDay()];
  $("edition").innerHTML = `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日 · 星期${wc}<br>第 ${week} 周 · 总第 1,204 期`;
  $("data-badge").innerHTML = ok
    ? `真实数据 · <b>${esc(SOURCES.map((s) => s.name).join("/"))}</b>`
    : `离线演示数据（接口不可达）`;
}

function renderFront(items) {
  const h = items[0];
  if (!h) return;
  $("hl-text").innerHTML = `
    <div class="kick">今日头条 · ${esc(h.src)} 最新收录</div>
    <h1>${esc(h.title)}</h1>
    <p class="deck">${esc(h.content || `${h.cls || h.type} · ${h.year} 年作品，已更新至「${h.remarks || "正片"}」。`)}</p>
    <div class="meta">
      <span>${esc(h.year)}</span><span>${esc(h.type)}</span>
      ${h.cls ? `<span>${esc(h.cls)}</span>` : ""}${h.remarks ? `<span>${esc(h.remarks)}</span>` : ""}
      ${h.score ? `<span class="star">★ ${esc(h.score)}</span>` : ""}
    </div>
    <div class="hl-actions"><a class="play">▶ 立即播放</a><a class="ghost">＋ 加入待看</a><a class="ghost">查看详情</a></div>`;
  $("hl-pic").innerHTML = `<img src="${esc(h.pic)}" alt="${esc(h.title)}" loading="eager" onerror="this.remove()">
    <div class="cap">《${esc(h.title)}》· ${esc(h.remarks || h.cls || h.type)}</div>`;
}

function renderTrendRail(items) {
  $("trend-rail").innerHTML = `<div class="tr-head"><h3>今日趋势</h3><span>近 7 日 · 热度为演示口径</span></div>`
    + items.slice(0, 10).map((t, i) => {
      const heat = (98.4 - i * 2.1 - (hash(t.title) % 10) / 10).toFixed(1);
      return `<div class="tri"><span class="no">${String(i + 1).padStart(2, "0")}</span>
        <div><b>${esc(t.title)}</b><span>${esc(t.cls || t.type)} · ${esc(t.year)}</span></div>
        <span class="heat">${heat}</span></div>`;
    }).join("");
}

function renderContinue(items) {
  $("cont-grid").innerHTML = items.slice(1, 7).map((c) => {
    const prog = 20 + (hash(c.title) % 70);
    return `<div class="cont-cell">
      <div class="th"><img src="${esc(c.pic)}" alt="${esc(c.title)}" loading="lazy" onerror="this.parentElement.classList.add('skl');this.remove()">
        <span class="time">${esc(c.remarks || c.cls || c.type)}</span></div>
      <div class="prog"><b style="width:${prog}%"></b></div>
      <h4>${esc(c.title)}</h4><p>${esc(c.cls || c.type)} · ${esc(c.year)} · ${esc(c.src)}</p></div>`;
  }).join("");
}

function renderBlocks() {
  $("blocks").innerHTML = BLOCKS.map((b, bi) => `
    <section class="sec" data-block="${bi}">
      <div class="sec-head"><span class="no">${b.no}</span><h2>${esc(b.title)}</h2>
        <span class="sub">${esc(b.sub)}</span><a class="more" href="#">进入版块 →</a></div>
      <div class="blk-tabs">${b.tabs.map((t, ti) =>
        `<a class="${ti === 0 ? "on" : ""}" data-b="${bi}" data-t="${ti}">${esc(t.t)}<span class="cnt"></span></a>`).join("")}</div>
      <div class="poster-row">${posterHtml(b.tabs[0].items())}</div>
    </section>`).join("");
  // tab 计数
  document.querySelectorAll(".blk-tabs a").forEach((a) => {
    const b = BLOCKS[+a.dataset.b];
    a.querySelector(".cnt").textContent = b.tabs[+a.dataset.t].items().length + " 部";
  });
  // tab 切换
  document.querySelectorAll(".blk-tabs").forEach((tabsEl) => {
    tabsEl.addEventListener("click", (e) => {
      const a = e.target.closest("[data-t]");
      if (!a || a.classList.contains("on")) return;
      const sec = tabsEl.closest(".sec");
      const b = BLOCKS[+a.dataset.b];
      tabsEl.querySelectorAll("a").forEach((x) => x.classList.remove("on"));
      a.classList.add("on");
      const row = sec.querySelector(".poster-row");
      row.classList.add("fading");
      setTimeout(() => { row.innerHTML = posterHtml(b.tabs[+a.dataset.t].items()); row.classList.remove("fading"); }, 250);
    });
  });
}
function posterHtml(items) {
  const n = +(getComputedStyle(document.documentElement).getPropertyValue("--poster-n").trim() || 6);
  return items.slice(0, n).map((it) => `
    <div class="p"><img src="${esc(it.pic)}" alt="${esc(it.title)}" loading="lazy" onerror="this.parentElement.classList.add('skl');this.remove()">
      <span class="sc">${esc(it.remarks || it.score || it.year)}</span>
      <div class="lab"><h4>${esc(it.title)}</h4><p>${esc(it.cls || it.type)} · ${esc(it.year)}</p></div>
    </div>`).join("");
}

function useFallback() {
  const mk = (n, t) => Array.from({ length: n }, (_, i) => ({
    title: t + " " + (i + 1), pic: "", type: "剧集", year: "2026",
    remarks: "更新至第 " + (i + 3) + " 集", cls: "演示", score: null, src: "离线", content: ""
  }));
  DATA = { latest: mk(12, "演示条目"), movies: mk(12, "演示电影"), tvs: mk(12, "演示剧集") };
}

(async () => {
  renderSkeletons();
  try {
    DATA = await fetchAll();
    if (!DATA.latest.length) throw new Error("empty");
    renderMasthead(true);
  } catch (e) {
    useFallback();
    renderMasthead(false);
  }
  renderFront(DATA.latest);
  renderTrendRail(DATA.latest);
  renderContinue(DATA.latest);
  renderBlocks();
})();
</script>
<script id="xdev-js">
(function(){
  var d=new URLSearchParams(location.search).get("device");
  if(!d)return;
  document.documentElement.setAttribute("data-device",d);
  var b=document.createElement("div");
  b.className="xdev-badge";
  b.textContent=d==="tv"?"TV · 10-FOOT MODE":d==="beamer"?"PROJECTOR MODE":"";
  if(b.textContent)document.body.appendChild(b);
  if(d==="beamer"){
    addEventListener("load",function(){setTimeout(function(){
      var lum=function(a){if(!a)return 1;var m=a.match(/[\d.]+/g);if(!m||m.length<3)return 1;if(m.length>3&&+m[3]===0)return 1;return .2126*(+m[0]/255)+.7152*(+m[1]/255)+.0722*(+m[2]/255)};
      var lv=lum(getComputedStyle(document.body).backgroundColor);
      if(lv>=1)lv=lum(getComputedStyle(document.documentElement).backgroundColor);
      if(lv>.5)document.documentElement.setAttribute("data-invert","1");
    },300)});
  }
})();
</script>
