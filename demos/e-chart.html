<!DOCTYPE html>
<html lang="zh-CN" data-theme="day" class="booting">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KinoTV Demo E · 热度榜 — 报刊排版式</title>
<script>try{var m=localStorage.getItem('kino-demo-theme-mode')||(localStorage.getItem('kino-demo-theme')==='night'?'dark':'light');if(m==='system')m=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';if(m==='dark')document.documentElement.setAttribute('data-theme','night')}catch(e){}</script>
<link rel="stylesheet" href="style-e.css">
<style>
/* 榜单页专属：分类 tab（报纸栏目标）+ 无缝滚动追加 + 口径 tooltip */
.tabs{display:flex;gap:clamp(14px,1.4vw,30px);align-items:baseline;flex-wrap:wrap;
  border-bottom:2px solid var(--ink);padding-bottom:clamp(8px,1.2vh,12px)}
.tabs button{font-family:var(--serif);font-size:clamp(15px,1.15vw,22px);font-weight:900;color:var(--ink-3);
  transition:.2s;padding:0}
.tabs button:hover{color:var(--ink-2)}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";display:block;height:3px;background:var(--accent);margin-top:4px}
.tabs .win{margin-left:auto;display:flex;align-items:center;gap:8px}
.caliber{display:inline-flex;align-items:center;gap:6px;font-size:clamp(11px,.72vw,12.5px);color:var(--ink-3);
  border:1px solid var(--rule);border-radius:99px;padding:2px 10px;cursor:help;position:relative}
.caliber:hover{color:var(--ink);border-color:var(--ink)}
.caliber .tip{position:absolute;right:0;top:calc(100% + 8px);width:clamp(220px,20vw,300px);
  background:var(--ink);color:var(--paper);font-size:12px;line-height:1.7;padding:10px 12px;border-radius:6px;
  opacity:0;pointer-events:none;transition:.2s;z-index:30}
.caliber:hover .tip{opacity:1}
.lead{margin-top:clamp(14px,2vh,24px);font-size:clamp(12px,.8vw,14.5px);color:var(--ink-2);line-height:1.9;
  max-width:78ch;padding-bottom:clamp(12px,1.8vh,20px);border-bottom:1px solid var(--rule)}
.more-bar{display:flex;justify-content:center;padding:clamp(16px,3vh,32px) 0}
.more-bar button{font-size:clamp(12.5px,.82vw,14.5px);color:var(--ink-2);border:1px solid var(--rule);
  border-radius:99px;padding:7px 22px;transition:.18s}
.more-bar button:hover{color:var(--ink);border-color:var(--ink)}
.more-bar button[disabled]{opacity:.5;cursor:default}
.sticky-cap{position:sticky;top:0;z-index:20;display:flex;justify-content:center;
  background:var(--paper);padding:6px 0;font-size:12.5px;color:var(--ink-3)}
.sticky-cap span{border:1px solid var(--rule);border-radius:99px;padding:3px 14px;background:var(--band)}

/* ── 榜单行（对齐 ChartRow：≥1024 横版 160×90 backdrop 双列，<1024 竖版 112×168 poster 单列；
      列数 = --chart-cols 真实口径 2 / 1；热度列 = 🔥popularity + 「热度值」+ ★评分） ── */
.trend-table{display:grid;grid-template-columns:repeat(var(--chart-cols,2),minmax(0,1fr));
  column-gap:clamp(24px,2.6vw,56px)}
.trow{grid-template-columns:clamp(30px,2.6vw,44px) 160px minmax(0,1fr) clamp(92px,8vw,140px)}
.trow .th{aspect-ratio:auto;width:160px;height:90px}
.trow .th .kpic{position:absolute;inset:0}
.trow .th .kpic.port{display:none}
.trow .ti .desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:clamp(11px,.74vw,13px);color:var(--ink-3);line-height:1.7;margin-top:5px;white-space:normal}
.trow .ti em.badge{font-style:normal;font-size:clamp(10px,.66vw,11.5px);border:1px solid var(--rule);
  border-radius:99px;padding:1px 8px;margin-right:8px;color:var(--ink-2)}
.trow .heat .n,.trow .heat .v{display:flex;align-items:center;justify-content:flex-end;gap:4px;
  font-weight:800;font-variant-numeric:tabular-nums}
.trow .heat .l{display:block;font-size:clamp(10px,.66vw,11.5px);color:var(--ink-3);font-weight:400;margin-top:2px}
.trow .heat .v{font-weight:400;font-size:clamp(11px,.74vw,13px);color:var(--ink-2);margin-top:2px}
@media (width<1024px){
  .trend-table{grid-template-columns:1fr}
  .trow{grid-template-columns:clamp(24px,7vw,40px) 112px minmax(0,1fr) auto}
  .trow .th{width:112px;height:168px}
  .trow .th .kpic.land{display:none}
  .trow .th .kpic.port{display:block}
  .trow .ti .desc{display:none}
}
@media (width<=767px){ .trow .heat{display:block} }   /* 真实榜单移动端保留热度列（覆盖共享层隐藏） */
</style>
</head>
<body>
<div class="page">

  <header class="topbar">
    <a class="tb-brand" href="home-style-e-typographic.html">Kino<em>TV</em></a>
    <span class="tb-page" id="tb-page"></span>
    <span class="tb-links" id="tb-links">
      <a href="home-style-e-typographic.html">首页</a>
      <span class="search-wrap" id="search-wrap">
        <button class="search" id="search-btn" type="button" aria-label="搜索" title="搜索 (Ctrl+K)">⌕</button>
        <form class="search-form" id="search-form" hidden>
          <input id="search-input" type="text" placeholder="搜索电影 / 剧集…" autocomplete="off">
          <button class="go" type="submit" aria-label="搜索">⌕</button>
          <button class="close" id="search-close" type="button" aria-label="关闭">✕</button>
        </form>
        <div class="search-drop" id="search-drop" hidden></div>
      </span>
      <button class="theme-btn" id="theme-btn" type="button">☾</button>
    </span>
  </header>

  <section class="sec" style="margin-top:clamp(18px,2.6vh,30px)">
    <div class="sec-cap">
      <h2>热度榜</h2>
      <span class="sub" id="caliber-sub">TMDB discover · popularity.desc</span>
      <span class="caliber" id="caliber">口径说明 ?
        <span class="tip" id="caliber-tip"></span>
      </span>
    </div>

    <div class="tabs" id="tabs">
      <span class="win" id="win-wrap"></span>
    </div>

    <p class="lead" id="lead"></p>

    <div class="trend-table" id="table"></div>
    <div class="empty" id="empty" hidden><b>暂无排行数据</b><span>该分类在快照中没有条目</span></div>
    <div class="sticky-cap" id="cap" hidden><span>加载中…</span></div>
    <div class="more-bar" id="more-bar"></div>
  </section>

  <footer>
    <span>KinoTV — Demo E · 热度榜页 · 报刊排版式；6 分类 tab + 榜单行（≥1024 双列横版 160×90 / <1024 单列竖版 112×168，--chart-cols 口径）+ 无缝滚动；标题海报评分年份热度为真实 TMDB 快照</span>
    <span class="foot-links"></span>
    <span>仅供风格评审</span>
  </footer>

</div>

<div class="fab" id="fab">
  <button id="fab-refresh" type="button" title="刷新数据">↻</button>
  <button id="fab-top" type="button" title="返回顶部">↑</button>
</div>

<script src="_data.js"></script>
<script src="_data-e-tmdb.js"></script>
<script src="style-e-boot.js"></script>
<script>
/* 真实口径：Chart/index.tsx CHART_TABS（6 分类）+ TREND_WINDOWS（今日/本周） */
var TABS = [
  {key:'movie',label:'电影',genre:null,media:'movie'},
  {key:'tv',label:'剧集',genre:null,media:'tv'},
  {key:'variety',label:'综艺',genre:10764,media:'tv'},
  {key:'anime',label:'动漫',genre:16,media:'tv'},
  {key:'documentary',label:'纪录片',genre:99,media:'movie'},
  {key:'trend',label:'趋势榜',genre:null,media:null},
];
var WINS = [{key:'day',label:'今日'},{key:'week',label:'本周'}];
var CALIBER = {
  discover:'榜单统一 discover 口径：sort_by=popularity.desc 分页拉取；追加后按 id 去重 + popularity 降序重排（跨页漂移会乱序）。',
  trend:'趋势榜走 /trending（趋势序不可控），只去重、保留趋势序，不重排。综艺 / 动漫 / 纪录片无 trending 端点，仅本 tab 使用。',
};

var state = { tab:'movie', win:'day', shown:20 };

function pool(){
  var t = TABS.filter(function(x){return x.key===state.tab})[0];
  var all = KINO_E.all();
  if(t.key==='trend') return (KINO_E.data().trending||[]).slice();
  var list = all.filter(function(it){
    if(t.media==='tv' && it.mediaType!=='tv') return false;
    if(t.media==='movie' && it.mediaType==='tv') return false;
    if(t.genre && (it.genreIds||[]).indexOf(t.genre)<0) return false;
    return true;
  });
  return list.sort(function(a,b){ return (+b.popularity||0)-(+a.popularity||0); });
}

function rowHTML(it,i){
  var rank = i+1;
  /* 封面双源：≥1024 横版取 backdrop（ChartRow 桌面口径），<1024 竖版取 poster（CSS 切换显隐） */
  var land = '<div class="kpic land" data-raw="'+KINO_E.esc(it.backdrop||it.pic)+'" data-w="300" data-alt="'+KINO_E.esc(it.title)+'"></div>';
  var port = KINO_E.pic(it,154).replace('class="kpic"','class="kpic port"');
  return '<div class="trow" data-id="'+KINO_E.esc(it.id)+'">'+
    '<span class="rank">'+rank+'</span>'+
    '<span class="th">'+land+port+'</span>'+
    '<span class="ti"><b>'+KINO_E.esc(it.title)+'</b>'+
      '<span>'+(state.tab==='trend'?'<em class="badge">'+(it.mediaType==='movie'?'电影':'剧集')+'</em>':'')+KINO_E.esc(it.year||'—')+'</span>'+
      (it.content?'<span class="desc">'+KINO_E.esc(it.content)+'</span>':'')+
    '</span>'+
    '<span class="heat"><span class="n">🔥 '+(+it.popularity||0).toFixed(1)+'</span><span class="l">热度值</span><span class="v">★ '+(+it.score||0).toFixed(1)+'</span></span>'+
  '</div>';
}

function render(){
  var list = pool();
  var slice = list.slice(0, state.shown);
  document.getElementById('table').innerHTML = slice.map(rowHTML).join('');
  document.getElementById('empty').hidden = list.length>0;
  var mb = document.getElementById('more-bar');
  mb.innerHTML = state.shown < list.length
    ? '<button id="more" type="button">继续加载（剩余 '+(list.length-state.shown)+' 条）</button>'
    : '<button disabled type="button">已加载全部 '+list.length+' 条</button>';
  KINO_E.bindPics(document.getElementById('table'));

  /* tab 栏 */
  document.getElementById('tabs').innerHTML =
    TABS.map(function(t){
      return '<button class="'+(t.key===state.tab?'on':'')+'" data-tab="'+t.key+'" type="button">'+t.label+'</button>';
    }).join('')+
    '<span class="win">'+(state.tab==='trend'
      ? '<div class="seg">'+WINS.map(function(w){
          return '<button class="'+(w.key===state.win?'on':'')+'" data-win="'+w.key+'" type="button">'+w.label+'</button>';
        }).join('')+'</div>' : '')+'</span>';

  var t = TABS.filter(function(x){return x.key===state.tab})[0];
  document.getElementById('caliber-sub').textContent = t.key==='trend' ? 'TMDB /trending · 趋势序' : 'TMDB discover · popularity.desc';
  document.getElementById('caliber-tip').textContent = t.key==='trend' ? CALIBER.trend : CALIBER.discover;
  document.getElementById('lead').innerHTML = t.key==='trend'
    ? '趋势榜按 TMDB 趋势序排列，反映近 24 小时的关注度变化；本页展示前 '+slice.length+' 条，热度为演示值。'
    : '本榜按 popularity 降序排列：'+t.label+'共 '+list.length+' 条，展示前 '+slice.length+' 条；海报 / 评分 / 年份为真实快照数据。';
}

function bind(){
  document.getElementById('tabs').addEventListener('click', function(e){
    var b = e.target.closest('[data-tab],[data-win]'); if(!b) return;
    if(b.hasAttribute('data-tab')){ state.tab=b.getAttribute('data-tab'); state.shown=20; }
    else { state.win=b.getAttribute('data-win'); }
    render();
  });
  document.getElementById('more-bar').addEventListener('click', function(e){
    var b = e.target.closest('#more'); if(!b) return;
    var cap = document.getElementById('cap');
    cap.hidden = false; b.disabled = true; b.textContent = '加载中…';
    setTimeout(function(){                       /* 慢取页反馈：≥400ms 才显形（Browse/constants.ts PENDING_FEEDBACK_DELAY_MS） */
      state.shown += 20; cap.hidden = true; render();
    }, 420);
  });
  document.getElementById('table').addEventListener('click', function(e){
    var r = e.target.closest('.trow'); if(!r) return;
    location.href = 'e-detail.html?id='+encodeURIComponent(r.getAttribute('data-id'));
  });
}

KINO_E.boot({ key:'chart', title:'热度榜' }).then(function(){
  /* ?category=movie|tv|variety|anime|documentary|trend & ?window=day|week（对齐真实路由 /chart?category=） */
  var qs = new URLSearchParams(location.search);
  var cat = qs.get('category');
  if(cat && TABS.some(function(t){return t.key===cat})) state.tab = cat;
  var win = qs.get('window');
  if(win==='week') state.win = 'week';
  render(); bind();
});
</script>
</body>
</html>
