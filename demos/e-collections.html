<!DOCTYPE html>
<html lang="zh-CN" data-theme="day" class="booting">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KinoTV Demo E · 收藏 — 报刊排版式</title>
<script>try{var m=localStorage.getItem('kino-demo-theme-mode')||(localStorage.getItem('kino-demo-theme')==='night'?'dark':'light');if(m==='system')m=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';if(m==='dark')document.documentElement.setAttribute('data-theme','night')}catch(e){}</script>
<link rel="stylesheet" href="style-e.css">
<style>
/* 收藏页专属：桌面算珠时间轴列 + 网格（RecordShell 方案 A：左栏 200px 单列，非卡片） */
.records{position:relative}
.grid-wrap{display:grid;grid-template-columns:1fr}
@media (width>=1024px){
  .grid-wrap{grid-template-columns:clamp(24px,2.4vw,40px) minmax(0,1fr)}
  .beads{position:sticky;top:clamp(12px,2vh,20px);align-self:start;padding-top:clamp(12px,1.6vh,18px)}
}
.beads{display:flex;flex-direction:column;gap:clamp(10px,1.4vh,18px)}
.bead{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:clamp(10.5px,.7vw,12.5px);
  color:var(--ink-3);cursor:pointer;transition:.2s;text-align:center;line-height:1.3}
.bead .dot{width:clamp(9px,.7vw,13px);height:clamp(9px,.7vw,13px);border-radius:50%;
  border:1px solid var(--rule);background:var(--paper);transition:.2s;flex:none}
.bead .ln{width:1px;flex:1;min-height:clamp(14px,2vh,26px);background:var(--rule)}
.bead:last-child .ln{display:none}
.bead.on{color:var(--ink);font-weight:800}
.bead.on .dot{background:var(--accent);border-color:var(--accent);transform:scale(1.15)}
.bead:hover{color:var(--ink)}
@media (width<=1023px){ .beads{flex-direction:row;flex-wrap:wrap;gap:10px;margin-bottom:14px}
  .bead{flex-direction:row}.bead .ln{display:none} }
.status-tag{font-size:clamp(10px,.66vw,11.5px);color:var(--ink-3);margin-top:3px}
.batch-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:clamp(8px,1.2vh,12px) 0;
  border-bottom:1px solid var(--rule);margin-bottom:clamp(12px,1.8vh,20px);font-size:clamp(12px,.78vw,14px);color:var(--ink-2)}
.batch-bar .sp{margin-left:auto;display:flex;gap:10px;align-items:center}
.check{position:absolute;left:6px;bottom:6px;z-index:3;width:22px;height:22px;border-radius:50%;
  border:1px solid var(--ink);background:color-mix(in srgb, var(--paper) 86%, transparent);color:var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:12px;opacity:0;transition:.18s;cursor:pointer}
.batch .check{opacity:1}
.check.on{background:var(--ink);color:var(--paper)}
/* IPTV 收藏：频道卡（对齐 IPTVChannelCard：3:2 封面 + LIVE 角标 + 分组角标 + 标题；
   列数与真实 .iptv-channel-grid 同源 = --iptv-cols，口径 src/assets/styles/index.css:924） */
.chan-grid{display:grid;grid-template-columns:repeat(var(--iptv-cols,2),minmax(0,1fr));gap:var(--gap)}
.chan{cursor:pointer;min-width:0}
.chan .cov{position:relative;aspect-ratio:3/2;overflow:hidden;border-radius:clamp(4px,.4vw,7px);background:var(--fill)}
.chan .cov .logo-fb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;color:var(--ink-3)}
.chan .cov .logo-fb b{font-family:var(--serif);font-size:clamp(15px,1.3vw,22px);font-weight:900;letter-spacing:.04em}
.chan .cov .logo-fb b em{color:var(--accent);font-style:normal}
.chan .cov .logo-fb span{font-size:10.5px}
.chan .cov .live{position:absolute;left:8px;top:8px;z-index:3;font-size:10.5px;font-weight:700;letter-spacing:.1em;
  color:#fff;background:rgba(22,163,110,.9);border-radius:4px;padding:2px 8px}
.chan .cov .grp{position:absolute;left:8px;bottom:8px;z-index:3;font-size:10.5px;color:#fff;
  background:rgba(0,0,0,.55);border-radius:4px;padding:2px 8px}
.chan.batch .cov .live{display:none}      /* 批量模式隐藏 LIVE，避免与勾选框重叠（RecordCard 同口径） */
.chan .check{left:8px;top:8px;bottom:auto}   /* 频道卡勾选框左上（对齐 record-card__check） */
.chan b{display:block;font-size:clamp(12.5px,.82vw,15px);font-weight:700;margin-top:clamp(6px,.9vh,9px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ── ≤767 移动端（口径同 Collections.css:80：批量/删除类操作按钮常驻可见） ── */
@media (width<=767px){
  .check{opacity:1}
  .chan-grid{gap:clamp(8px,1.4vh,12px) var(--gap)}
}
</style>
</head>
<body>
<div class="page">

  <header class="topbar">
    <a class="tb-brand" href="home-style-e-typographic.html">Kino<em>TV</em></a>
    <span class="tb-page" id="tb-page"></span>
    <span class="tb-links" id="tb-links">
      <a href="home-style-e-typographic.html">首页</a>
      <span class="search-wrap" id="search-wrap">
        <button class="search" id="search-btn" type="button" aria-label="搜索" title="搜索 (Ctrl+K)">⌕</button>
        <form class="search-form" id="search-form" hidden>
          <input id="search-input" type="text" placeholder="搜索电影 / 剧集…" autocomplete="off">
          <button class="go" type="submit" aria-label="搜索">⌕</button>
          <button class="close" id="search-close" type="button" aria-label="关闭">✕</button>
        </form>
        <div class="search-drop" id="search-drop" hidden></div>
      </span>
      <button class="theme-btn" id="theme-btn" type="button">☾</button>
    </span>
  </header>

  <div class="rail-aside" style="margin-top:clamp(14px,2vh,24px)">

    <!-- 左栏（对齐 RecordShell 方案 A：单列 200px，非卡片） -->
    <aside class="rail">
      <div class="rail-group">
        <div class="rail-title">收藏分类<span class="en">TABS</span></div>
        <div class="rail-list" id="tabs">
          <button class="rail-item on" data-tab="all" type="button"><span class="ic">▦</span>综合<span class="cnt" id="c-all">0</span></button>
          <button class="rail-item" data-tab="video" type="button"><span class="ic">▶</span>视频<span class="cnt" id="c-video">0</span></button>
          <button class="rail-item" data-tab="iptv" type="button"><span class="ic">📺</span>IPTV<span class="cnt" id="c-iptv">0</span></button>
        </div>
      </div>
      <div class="rail-group">
        <div class="rail-title">观看状态<span class="en">STATUS</span></div>
        <div class="chips" id="status">
          <button class="chip on" data-st="all" type="button">全部</button>
          <button class="chip" data-st="unwatched" type="button">未观看</button>
          <button class="chip" data-st="watching" type="button">正在看</button>
          <button class="chip" data-st="watched" type="button">已看完</button>
        </div>
      </div>
      <div class="rail-group">
        <div class="rail-title">排序<span class="en">SORT</span></div>
        <div class="chips" id="sort">
          <button class="chip on chip--full" data-so="recent" type="button">最近收藏</button>
          <button class="chip chip--full" data-so="oldest" type="button">最早收藏</button>
          <button class="chip chip--full" data-so="title-asc" type="button">名称A-Z</button>
          <button class="chip chip--full" data-so="title-desc" type="button">名称Z-A</button>
          <button class="chip chip--full" data-so="rating-desc" type="button">评分从高到低</button>
          <button class="chip chip--full" data-so="rating-asc" type="button">评分从低到高</button>
        </div>
      </div>
      <div class="rail-group">
        <div class="rail-actions">
          <button class="rail-btn" id="batch-btn" type="button">批量管理</button>
          <button class="rail-btn danger" id="clear-btn" type="button">清除全部</button>
        </div>
      </div>
    </aside>

    <main class="records">
      <section class="sec" style="margin-top:0">
        <div class="sec-cap">
          <h2 id="title">我的收藏</h2>
          <span class="sub" id="sub">真实收藏写在 localStorage，跨 demo 共享</span>
          <span class="more" id="count"></span>
        </div>

        <div class="batch-bar" id="batch-bar" hidden>
          <span id="batch-n">已选择 0 项</span>
          <span class="sp">
            <button class="btn" id="sel-all" type="button">全选</button>
            <button class="btn btn--accent" id="del-sel" type="button">删除所选</button>
            <button class="btn" id="exit-batch" type="button">退出管理</button>
          </span>
        </div>

        <div class="grid-wrap">
          <div class="beads" id="beads"></div>
          <div>
            <div class="pgrid" id="grid"></div>
            <div id="iptv-list" hidden></div>
            <div class="empty" id="empty" hidden><b>暂无收藏</b><span>去首页或浏览页点封面右上角 ♥ 收藏，回来即可看到</span></div>
          </div>
        </div>
      </section>
    </main>

  </div>

  <footer>
    <span>KinoTV — Demo E · 收藏页 · 报刊排版式；左栏对齐 RecordShell 方案 A（单列、非卡片），主区含桌面算珠时间轴；视频收藏为真实 localStorage（跨 demo 共享），IPTV 收藏与状态为演示值</span>
    <span class="foot-links"></span>
    <span>仅供风格评审</span>
  </footer>

</div>

<div class="fab" id="fab">
  <button id="fab-refresh" type="button" title="刷新数据">↻</button>
  <button id="fab-top" type="button" title="返回顶部">↑</button>
</div>

<script src="_data.js"></script>
<script src="_data-e-tmdb.js"></script>
<script src="style-e-boot.js"></script>
<script>
/* 收藏数据源：window.KINO_E.fav（localStorage kino-demo-favs，与首页/浏览/详情/播放共享）。
   首次进入播种 3 条（首页同做法），状态与收藏时间为演示值。 */
var ST_LABEL = { all:'全部', unwatched:'未观看', watching:'正在看', watched:'已看完' };
var S = { tab:'all', st:'all', so:'recent', batch:false, sel:new Set() };
var STATUS_KEY = 'kino-demo-coll-status';
var STATUS = {};
try { STATUS = JSON.parse(localStorage.getItem(STATUS_KEY)||'{}'); } catch(e) { STATUS = {}; }

var CHANNELS = [
  {id:'iptv-cctv1',title:'CCTV-1 综合',group:'央视 CCTV',no:'1'},
  {id:'iptv-cctv5',title:'CCTV-5 体育',group:'央视 CCTV',no:'5'},
  {id:'iptv-hunan',title:'湖南卫视',group:'主流卫视',no:'21'},
  {id:'iptv-zhejiang',title:'浙江卫视',group:'主流卫视',no:'22'},
  {id:'iptv-dragon',title:'东方卫视',group:'主流卫视',no:'23'},
];

function videoItems(){
  var ids = Array.from(KINO_E.fav.all());
  var all = KINO_E.all();
  return ids.map(function(id){ return all.filter(function(x){return String(x.id)===String(id)})[0]; })
            .filter(Boolean)
            .filter(function(x){ return x.id.indexOf('iptv-')!==0; });
}
function iptvItems(){
  var ids = Array.from(KINO_E.fav.all()).filter(function(i){ return String(i).indexOf('iptv-')===0; });
  return CHANNELS.filter(function(c){ return ids.indexOf(c.id)>=0; });
}
function statusOf(id){
  if(!STATUS[id]){
    var i = Math.floor(KINO_E.seeded(id,9)*3);
    STATUS[id] = ['unwatched','watching','watched'][i];
    try { localStorage.setItem(STATUS_KEY, JSON.stringify(STATUS)); } catch(e) {}
  }
  return STATUS[id];
}
/* 排序键对齐 src/pages/Collections/index.tsx:43 SORT_OPTIONS（6 项） */
function sortList(list, getScore, getTime, getName){
  var l = list.slice();
  var byTimeDesc = function(a,b){ return getTime(b)-getTime(a); };     /* 同分时按收藏时间倒序兜底 */
  if(S.so==='rating-desc') l.sort(function(a,b){ return (getScore(b)-getScore(a)) || byTimeDesc(a,b); });
  else if(S.so==='rating-asc') l.sort(function(a,b){ return (getScore(a)-getScore(b)) || byTimeDesc(a,b); });
  else if(S.so==='title-asc') l.sort(function(a,b){ return String(getName(a)).localeCompare(String(getName(b)),'zh-Hans-CN') || byTimeDesc(a,b); });
  else if(S.so==='title-desc') l.sort(function(a,b){ return String(getName(b)).localeCompare(String(getName(a)),'zh-Hans-CN') || byTimeDesc(a,b); });
  else if(S.so==='oldest') l.sort(function(a,b){ return getTime(a)-getTime(b); });
  else l.sort(byTimeDesc);
  return l;
}
function timeOf(id){ return KINO_E.seeded(id,13); }

function render(){
  var vids = videoItems(), chans = iptvItems();
  document.getElementById('c-all').textContent = vids.length + chans.length;
  document.getElementById('c-video').textContent = vids.length;
  document.getElementById('c-iptv').textContent = chans.length;

  var showVideo = S.tab!=='iptv', showIptv = S.tab!=='video';
  var vlist = sortList(vids, function(x){ return +x.score||0; }, function(x){ return timeOf(x.id); },
    function(x){ return x.title||''; })
    .filter(function(x){ return S.st==='all' || statusOf(x.id)===S.st; });
  var clist = chans.filter(function(c){ return S.st==='all' || statusOf(c.id)===S.st; });

  var grid = document.getElementById('grid'), ilist = document.getElementById('iptv-list'), empty = document.getElementById('empty');
  grid.hidden = !showVideo || !vlist.length;
  ilist.hidden = !showIptv || !clist.length;
  empty.hidden = (showVideo && vlist.length) || (showIptv && clist.length);

  if(showVideo) grid.innerHTML = vlist.map(function(it){
    var st = statusOf(it.id), sel = S.sel.has(it.id);
    return '<article class="rcard'+(S.batch?' batch':'')+'" data-id="'+KINO_E.esc(it.id)+'">'+
      '<div class="rc-cover">'+
        KINO_E.pic(it,480,
          (it.score?'<span class="b-tl">★'+(+it.score).toFixed(1)+'</span>':'')+
          '<span class="b-bl">'+KINO_E.esc(it.year||'—')+'</span>'+
          '<span class="b-br">'+KINO_E.esc(KINO_E.genreName(it))+'</span>'+
          '<button class="check'+(sel?' on':'')+'" data-check="'+KINO_E.esc(it.id)+'" type="button" aria-label="选择">✓</button>')+
      '</div>'+
      '<h4>'+KINO_E.esc(it.title)+'</h4>'+
      '<p class="status-tag">'+ST_LABEL[st]+' · 收藏于 '+Math.round(timeOf(it.id)*100)+' 天前（演示）</p>'+
    '</article>';
  }).join('');

  if(showIptv) ilist.innerHTML =
    '<div class="rail-title" style="margin-bottom:8px">IPTV 收藏频道<span class="en">CHANNELS</span></div>'+
    '<div class="chan-grid">'+clist.map(function(c){
      var sel = S.sel.has(c.id);
      return '<div class="chan'+(S.batch?' batch':'')+'" data-id="'+KINO_E.esc(c.id)+'">'+
        '<div class="cov">'+
          '<span class="logo-fb"><b>kino<em>TV</em></b><span>台标占位</span></span>'+
          '<span class="live">● LIVE</span>'+
          '<span class="grp">'+KINO_E.esc(c.group)+'</span>'+
          '<button class="check'+(sel?' on':'')+'" data-check="'+KINO_E.esc(c.id)+'" type="button" aria-label="选择">✓</button>'+
        '</div>'+
        '<b>'+KINO_E.esc(c.title)+'</b>'+
      '</div>';
    }).join('')+'</div>';

  var total = (showVideo?vlist.length:0) + (showIptv?clist.length:0);
  document.getElementById('count').textContent = '共 '+total+' 条';
  document.getElementById('title').textContent = S.tab==='video'?'视频收藏':S.tab==='iptv'?'IPTV 收藏':'我的收藏';

  /* 时间轴算珠（按收藏时间分组，演示值） */
  var groups = [['近 7 天','7'],['近 30 天','30'],['更早','∞']];
  document.getElementById('beads').innerHTML = groups.map(function(g,i){
    return '<div class="bead'+(i===0?' on':'')+'" data-bead="'+i+'"><span class="dot"></span><span>'+g[0]+'</span><span class="ln"></span></div>';
  }).join('');

  document.getElementById('batch-bar').hidden = !S.batch;
  document.getElementById('batch-n').textContent = '已选择 '+S.sel.size+' 项';
  document.getElementById('batch-btn').textContent = S.batch?'退出管理':'批量管理';
  KINO_E.bindPics(document);
}

function bind(){
  document.getElementById('tabs').addEventListener('click', function(e){
    var b = e.target.closest('[data-tab]'); if(!b) return;
    Array.prototype.forEach.call(this.children, function(x){ x.classList.toggle('on', x===b); });
    S.tab = b.getAttribute('data-tab'); render();
  });
  document.getElementById('status').addEventListener('click', function(e){
    var b = e.target.closest('[data-st]'); if(!b) return;
    Array.prototype.forEach.call(this.children, function(x){ x.classList.toggle('on', x===b); });
    S.st = b.getAttribute('data-st'); render();
  });
  document.getElementById('sort').addEventListener('click', function(e){
    var b = e.target.closest('[data-so]'); if(!b) return;
    Array.prototype.forEach.call(this.children, function(x){ x.classList.toggle('on', x===b); });
    S.so = b.getAttribute('data-so'); render();
  });
  document.getElementById('beads').addEventListener('click', function(e){
    var b = e.target.closest('[data-bead]'); if(!b) return;
    Array.prototype.forEach.call(this.children, function(x){ x.classList.toggle('on', x===b); });
  });
  document.addEventListener('click', function(e){
    var ck = e.target.closest('[data-check]');
    if(ck){
      e.stopPropagation();
      var id = ck.getAttribute('data-check');
      if(S.sel.has(id)) S.sel.delete(id); else S.sel.add(id);
      ck.classList.toggle('on', S.sel.has(id));
      document.getElementById('batch-n').textContent = '已选择 '+S.sel.size+' 项';
      return;
    }
    if(e.target.closest('#batch-btn')){ S.batch=!S.batch; if(!S.batch) S.sel.clear(); render(); return; }
    if(e.target.closest('#exit-batch')){ S.batch=false; S.sel.clear(); render(); return; }
    if(e.target.closest('#sel-all')){
      var vids = videoItems();
      vids.forEach(function(x){ S.sel.add(x.id); });
      render(); return;
    }
    if(e.target.closest('#del-sel')){
      S.sel.forEach(function(id){ KINO_E.fav.toggle(id); });
      S.sel.clear(); render(); return;
    }
    if(e.target.closest('#clear-btn')){
      var ids = Array.from(KINO_E.fav.all());
      ids.forEach(function(id){ KINO_E.fav.toggle(id); });
      render(); return;
    }
    var c = e.target.closest('.rcard');
    if(c && !S.batch){ location.href='e-detail.html?id='+encodeURIComponent(c.getAttribute('data-id')); }
    var ch = e.target.closest('.chan');
    if(ch){ location.href='e-iptv-player.html?ch='+encodeURIComponent(ch.getAttribute('data-id')); }
  });
}

KINO_E.boot({ key:'collections', title:'我的收藏' }).then(function(){
  /* 首次播种：让形态可评审（与首页 Demo E 同做法，收藏本身真实写入 localStorage） */
  if(!KINO_E.fav.all().size && !localStorage.getItem('kino-demo-coll-seeded')){
    KINO_E.pick(KINO_E.all(), 6, 'collections').forEach(function(x, i){ if(i<5) KINO_E.fav.toggle(x.id); });
    CHANNELS.slice(0,2).forEach(function(c){ KINO_E.fav.toggle(c.id); });
    try { localStorage.setItem('kino-demo-coll-seeded','1'); } catch(e) {}
  }
  render(); bind();
});
</script>
</body>
</html>
