<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KinoTV Demo E-V3 — 报刊版式 · 现有首页左栏动线版</title>
<style>
/* ============================================================
   Demo E-V3 · 报刊版式 × 现有首页左栏动线融合
   对应项目桌面习惯（rail 从 1024 起、200px 左栏体系）：
   常驻左栏（sticky）= 报纸「目录页」：版块导航 + 今日趋势 Top6 + 继续观看竖排进度；
   右侧主流 = HeroBili 对开（banner+换一换）+ 原 7 行横滚全保留（编号小节）。
   数据：CMS 真实接口；零卡片；首屏预算制；封顶 2200
   ============================================================ */
:root{
  --paper:#fbfaf7; --ink:#141416; --ink-2:#57575f; --ink-3:#98989f;
  --rule:#d8d5cd; --accent:#b03a1e;
  --serif:"Noto Serif SC","Source Han Serif SC","STSong",serif;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --content-max:2200px; --rail-w:clamp(230px,17vw,300px);
  --pad-x:clamp(16px,2.4vw,44px); --gap:clamp(12px,1vw,20px);
  --poster-n:6;
}
@media (width>=1440px){ :root{--pad-x:60px; --poster-n:7} }
@media (width>=1920px){ :root{--pad-x:100px; --poster-n:8} }
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:100%;object-fit:cover}
.frame{max-width:var(--content-max);margin:0 auto;padding:0 var(--pad-x);
  display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);gap:clamp(24px,2.6vw,56px);align-items:start}

/* ---------- 左栏目录页（sticky，对应 home-two-col__rail） ---------- */
.rail{position:sticky;top:clamp(12px,2vh,24px);max-height:calc(100vh - 24px);overflow-y:auto;
  scrollbar-width:thin;padding-bottom:12px}
.rail .r-sec{border-top:3px solid var(--ink);margin-bottom:clamp(16px,2.4vh,30px)}
.rail .r-sec h3{font-family:var(--serif);font-size:clamp(16px,1.2vw,22px);font-weight:900;
  padding:clamp(8px,1.2vh,14px) 0 clamp(4px,.8vh,10px)}
.rail .r-sec .r-sub{font-size:clamp(10.5px,.7vw,12.5px);color:var(--ink-3);margin:-2px 0 clamp(6px,1vh,12px)}
.rail .r-sec .r-more{border-top:1px solid var(--rule)}
.rail-nav a{display:flex;justify-content:space-between;align-items:baseline;
  padding:clamp(7px,1.1vh,12px) 2px;border-bottom:1px solid var(--rule);
  font-size:clamp(13px,.9vw,15.5px);color:var(--ink-2);transition:.2s}
.rail-nav a:hover,.rail-nav a.on{color:var(--ink);font-weight:700}
.rail-nav a .n{font-size:clamp(10.5px,.7vw,12px);color:var(--ink-3);font-weight:400}
.rail-trend .ri{display:grid;grid-template-columns:clamp(20px,1.6vw,28px) minmax(0,1fr);gap:8px;
  align-items:baseline;padding:clamp(6px,1vh,10px) 2px;border-bottom:1px solid var(--rule);cursor:pointer}
.rail-trend .ri .no{font-family:var(--serif);font-weight:900;color:var(--ink-3);font-size:clamp(12px,.94vw,15px)}
.rail-trend .ri:nth-child(-n+3) .no{color:var(--accent)}
.rail-trend .ri b{font-size:clamp(12.5px,.86vw,14.5px);font-weight:700;display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-trend .ri span{font-size:clamp(10px,.66vw,11.5px);color:var(--ink-3)}
.rail-cont .ci{padding:clamp(7px,1.1vh,12px) 2px;border-bottom:1px solid var(--rule);cursor:pointer}
.rail-cont .ci b{font-size:clamp(12.5px,.86vw,14.5px);font-weight:700;display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-cont .ci .prog{height:2px;background:var(--rule);position:relative;margin-top:6px}
.rail-cont .ci .prog b{position:absolute;left:0;top:0;bottom:0;background:var(--accent);font-weight:400}
.rail-cont .ci span{font-size:clamp(10px,.66vw,11.5px);color:var(--ink-3)}

/* ---------- 右主流列 ---------- */
.main{min-width:0}
.mast{padding-top:clamp(16px,2.4vh,28px);margin-bottom:clamp(6px,1vh,12px)}
.mast-row{display:flex;align-items:baseline;justify-content:space-between;gap:20px;
  border-bottom:3px solid var(--ink);padding-bottom:clamp(8px,1.2vh,14px)}
.brand{font-family:var(--serif);font-size:clamp(24px,2vw,38px);font-weight:900;letter-spacing:.04em}
.brand em{color:var(--accent);font-style:normal}
.edition{font-size:clamp(11.5px,.76vw,13.5px);color:var(--ink-2);text-align:right;line-height:1.7}
.mast-nav{display:flex;gap:clamp(14px,1.4vw,28px);padding:clamp(8px,1.2vh,12px) 0;
  border-bottom:1px solid var(--rule);font-size:clamp(13px,.85vw,15px);align-items:center;flex-wrap:wrap}
.mast-nav a{color:var(--ink-2);transition:.2s}
.mast-nav a.on,.mast-nav a:hover{color:var(--ink);font-weight:700}
.data-badge{margin-left:auto;font-size:clamp(10.5px,.68vw,12px);color:var(--ink-3);border:1px solid var(--rule);
  border-radius:99px;padding:2px 10px;white-space:nowrap}
.data-badge b{color:var(--accent);font-weight:700}

/* ---------- HeroBili 对开（banner + 换一换，右卡由左栏继续观看承担故省） ---------- */
.hero{height:clamp(300px,44vh,520px);position:relative;overflow:hidden;
  border-radius:clamp(6px,.5vw,10px);background:#eceade;margin-top:clamp(14px,2.2vh,26px)}
.hero img{position:absolute;inset:0;transition:transform 6s}
.hero:hover img{transform:scale(1.025)}
.hero .veil{position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(12,12,14,.88))}
.hero .cap{position:absolute;left:0;right:0;bottom:0;padding:clamp(14px,2.2vh,28px);color:#fff}
.hero .cap .kick{font-size:clamp(10.5px,.68vw,12px);letter-spacing:.26em;color:#e8c9a0;font-weight:800;margin-bottom:6px}
.hero .cap h1{font-family:var(--serif);font-size:clamp(24px,3.8vh,46px);font-weight:900;line-height:1.2;margin-bottom:6px}
.hero .cap p{font-size:clamp(11.5px,.74vw,13px);opacity:.85;max-width:64ch;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero .cap .row{display:flex;gap:clamp(12px,1.2vw,22px);align-items:center;margin-top:clamp(8px,1.4vh,16px)}
.hero .cap .play{font-weight:800;font-size:clamp(13px,.88vw,15.5px);border-bottom:2px solid #e8c9a0;padding-bottom:3px;cursor:pointer}
.hero .shuffle{position:absolute;right:clamp(12px,1.4vw,24px);top:clamp(10px,1.6vh,18px);color:#fff;
  font-size:clamp(11.5px,.76vw,13px);font-weight:700;background:rgba(12,12,14,.5);
  border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:5px 13px;cursor:pointer;transition:.2s}
.hero .shuffle:hover{background:rgba(12,12,14,.8)}

/* ---------- 小节 + 7 行横滚 ---------- */
.sec{margin-top:clamp(24px,4vh,48px)}
.sec-head{display:flex;align-items:baseline;gap:clamp(12px,1.1vw,20px);
  border-bottom:1px solid var(--rule);padding-bottom:clamp(8px,1.2vh,14px);margin-bottom:clamp(14px,2vh,24px)}
.sec-head .no{font-family:var(--serif);font-size:clamp(22px,2vw,38px);font-weight:900;color:var(--accent);line-height:1}
.sec-head h2{font-family:var(--serif);font-size:clamp(20px,1.9vw,34px);font-weight:900}
.sec-head .sub{font-size:clamp(11.5px,.76vw,13.5px);color:var(--ink-3)}
.sec-head .more{margin-left:auto;font-size:clamp(12px,.8vw,14px);color:var(--ink-2)}
.sec-head .more:hover{color:var(--ink)}
.row-scroll{display:grid;grid-auto-flow:column;
  grid-auto-columns:calc((100% - (var(--poster-n) - 1)*var(--gap)) / var(--poster-n));gap:var(--gap);
  overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px;scrollbar-width:thin}
.row-scroll::-webkit-scrollbar{height:5px}
.row-scroll::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}
.row-scroll .p{scroll-snap-align:start;position:relative;aspect-ratio:2/3;overflow:hidden;
  border-radius:clamp(4px,.4vw,7px);cursor:pointer;background:#eceade}
.row-scroll .p img{position:absolute;inset:0;transition:transform .5s}
.row-scroll .p:hover img{transform:scale(1.05)}
.row-scroll .p .lab{position:absolute;left:0;right:0;bottom:0;padding:40px 11px 9px;color:#fff;
  background:linear-gradient(180deg,transparent,rgba(12,12,14,.85));opacity:0;transition:.3s}
.row-scroll .p:hover .lab{opacity:1}
.row-scroll .p .lab h4{font-size:clamp(12.5px,.88vw,15.5px);font-weight:700}
.row-scroll .p .lab p{font-size:clamp(10.5px,.68vw,12px);opacity:.75}
.row-scroll .p .sc{position:absolute;top:clamp(6px,.55vw,10px);right:clamp(6px,.55vw,10px);
  font-size:clamp(10.5px,.7vw,12px);font-weight:800;background:#fff;color:var(--ink);
  padding:2px 7px;border-radius:4px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 骨架 ---------- */
.skl{position:relative;overflow:hidden;background:#eceade}
.skl::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shimmer 1.4s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.skl-line{height:13px;border-radius:4px;margin-top:8px}

footer{grid-column:2;margin:clamp(28px,5vh,56px) 0 clamp(22px,3vh,40px);padding-top:clamp(12px,1.6vh,20px);
  border-top:3px solid var(--ink);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;
  font-size:clamp(11.5px,.76vw,13.5px);color:var(--ink-3)}
</style>
<style id="xdev-css">
/* ==== 设备适配层：TV 10-foot / 投影仪 / 超宽 ==== */
html[data-device="tv"]{--poster-n:6;--rail-w:280px;--content-max:2200px}
html[data-device="tv"] body{zoom:1.5;padding:3.5vh 3.5vw!important;box-sizing:border-box}
html[data-device="tv"] :focus{outline:3px solid #d4a24e!important;outline-offset:3px;border-radius:4px}
html[data-device="tv"] .rail{position:static;max-height:none}
html[data-device="beamer"]{--poster-n:7}
html[data-device="beamer"] body{zoom:1.4}
html[data-device="beamer"][data-invert="1"] body{filter:invert(1) hue-rotate(180deg);background:#fff}
html[data-device="beamer"][data-invert="1"] img,html[data-device="beamer"][data-invert="1"] video{filter:invert(1) hue-rotate(180deg)}
@media (width>=2560px){:root{--content-max:2600px;--pad-x:120px;--poster-n:9;--rail-w:320px}}
@media (min-aspect-ratio:21/9){:root{--content-max:min(3000px,92vw);--pad-x:140px;--poster-n:10}}
@media (max-width:1023px){.frame{grid-template-columns:minmax(0,1fr)}.rail{display:none}footer{grid-column:1}}
.xdev-badge{position:fixed;right:14px;bottom:12px;z-index:99999;font:600 11px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.12em;color:#d4a24e;background:rgba(16,16,20,.82);border:1px solid rgba(212,162,78,.5);border-radius:999px;padding:6px 12px;pointer-events:none}
</style>
</head>
<body>
<div class="frame">

  <!-- 左栏目录页 -->
  <aside class="rail">
    <div class="r-sec">
      <h3>版块目录</h3><div class="r-sub">对应首页七行 · 点击跳转</div>
      <nav class="rail-nav" id="rail-nav"></nav>
    </div>
    <div class="r-sec r-more">
      <h3>今日趋势</h3><div class="r-sub">近 7 日真实收录 · 热度演示</div>
      <div class="rail-trend" id="rail-trend"></div>
    </div>
    <div class="r-sec r-more">
      <h3>继续观看</h3><div class="r-sub">进度为演示值</div>
      <div class="rail-cont" id="rail-cont"></div>
    </div>
  </aside>

  <!-- 右主流列 -->
  <div class="main">
    <header class="mast">
      <div class="mast-row">
        <div class="brand">Kino<em>TV</em> 影视日报</div>
        <div class="edition" id="edition"></div>
      </div>
      <nav class="mast-nav">
        <a class="on" href="#">首页</a><a href="#">剧集</a><a href="#">电影</a><a href="#">综艺</a><a href="#">动漫</a><a href="#">榜单</a><a href="#">IPTV</a>
        <span class="data-badge" id="data-badge">真实接口拉取中…</span>
      </nav>
    </header>

    <div class="hero" id="hero"></div>
    <div id="rows"></div>
  </div>

  <footer>
    <span>KinoTV — Demo E-V3 · 报刊版式 × 左栏动线版 · 左栏=目录页（导航/趋势/继续观看），右侧原 7 行全保留</span>
    <span>仅供风格评审</span>
  </footer>

</div>

<script>
/* ============ 数据层：与 E 基准同口径 ============ */
const SOURCES = [
  { name: "豆瓣资源", api: "https://caiji.dbzy5.com/api.php/provide/vod" },
  { name: "茅台资源", api: "https://caiji.maotaizy.cc/api.php/provide/vod" }
];
const TYPE_NAME = { 1: "电影", 2: "剧集", 3: "综艺", 4: "动漫" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const stripHtml = (s) => String(s ?? "").replace(/<[^>]*>/g, "").replace(/\s+/g, " ").trim();
const hash = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };

async function cms(api, params) {
  const url = api + "?" + new URLSearchParams(params).toString();
  const res = await fetch(url, { signal: AbortSignal.timeout(10000) });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const j = await res.json();
  if (j.code != null && j.code !== 1) throw new Error(j.msg || "CMS 业务异常");
  return j;
}
function mapItem(x, srcName) {
  return {
    id: x.vod_id, title: x.vod_name || "未命名", pic: x.vod_pic || "",
    type: TYPE_NAME[x.type_id_1 ?? x.type_id] || "影视", year: x.vod_year || "",
    remarks: x.vod_remarks || "", cls: (x.vod_class || "").split(",")[0] || "",
    score: parseFloat(x.vod_score) > 0 ? x.vod_score : null,
    content: stripHtml(x.vod_content), src: srcName
  };
}
async function fetchAll() {
  const jobs = [
    cms(SOURCES[0].api, { ac: "videolist", pg: 1, h: 168 }),
    cms(SOURCES[1].api, { ac: "videolist", pg: 1, h: 168 }),
    ...[1, 2].flatMap((t) => SOURCES.map((s) => cms(s.api, { ac: "videolist", t, pg: 1 })))
  ];
  const [latestDb, latestMt, movieDb, movieMt, tvDb, tvMt] = (await Promise.allSettled(jobs)).map((r) => r.status === "fulfilled" ? r.value.list ?? [] : []);
  const uniq = (arr) => { const s = new Set(); return arr.filter((x) => !s.has(x.title) && s.add(x.title)); };
  return {
    latest: uniq([...latestDb, ...latestMt].map((x) => mapItem(x, x.vod_pic?.includes("dbzy") ? SOURCES[0].name : SOURCES[1].name))),
    movies: uniq([...movieDb, ...movieMt].map((x) => mapItem(x, SOURCES[0].name))),
    tvs: uniq([...tvDb, ...tvMt].map((x) => mapItem(x, SOURCES[1].name)))
  };
}

const ROT = (arr, k) => arr.length ? [...arr.slice(k % arr.length), ...arr.slice(0, k % arr.length)] : arr;
const byScore = (arr) => [...arr].sort((a, b) => (b.score || 0) - (a.score || 0));
let DATA = null, ROWS = [], heroIdx = 0;

/* 7 行定义（与现有首页同标题同顺序） */
function buildRows(D) {
  return [
    { title: "正在热映", sub: "院线在映", items: D.movies.slice(0, 14) },
    { title: "热门电影", sub: "按收录热度", items: ROT(D.movies, 5) },
    { title: "高分电影", sub: "评分优先", items: byScore(D.movies) },
    { title: "即将上映", sub: "新片预告", items: ROT(D.movies, 9) },
    { title: "热门剧集", sub: "按收录热度", items: D.tvs.slice(0, 14) },
    { title: "高分剧集", sub: "评分优先", items: byScore(D.tvs) },
    { title: "今日播出", sub: "近 24h 更新", items: D.latest.slice(0, 14) }
  ];
}

function renderSkeletons() {
  $("rail-trend").innerHTML = Array(6).fill(0).map(() =>
    `<div class="ri"><span class="skl skl-line" style="width:18px;margin:0"></span><span class="skl skl-line" style="margin:0"></span></div>`).join("");
  $("rail-cont").innerHTML = Array(3).fill(0).map(() =>
    `<div class="ci"><span class="skl skl-line" style="margin:0"></span><div class="prog"></div></div>`).join("");
  $("hero").innerHTML = `<div class="skl" style="position:absolute;inset:0"></div>`;
  $("rows").innerHTML = Array(3).fill(0).map(() => `
    <section class="sec"><div class="sec-head"><span class="skl skl-line" style="width:34px;margin:0"></span>
      <span class="skl skl-line" style="width:120px;margin:0"></span></div>
      <div class="row-scroll">${Array(6).fill(0).map(() => `<div class="p skl"></div>`).join("")}</div></section>`).join("");
}

function renderMasthead(ok) {
  const d = new Date();
  const week = Math.ceil(((d - new Date(d.getFullYear(), 0, 1)) / 864e5 + 1) / 7);
  const wc = "日一二三四五六"[d.getDay()];
  $("edition").innerHTML = `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日 · 星期${wc}<br>第 ${week} 周 · 总第 1,204 期`;
  $("data-badge").innerHTML = ok
    ? `真实数据 · <b>${esc(SOURCES.map((s) => s.name).join("/"))}</b>`
    : `离线演示数据（接口不可达）`;
}

/* 左栏三节 */
function renderRail() {
  $("rail-nav").innerHTML = ROWS.map((r, i) =>
    `<a href="#" class="${i === 0 ? "on" : ""}"><span><b>${String(i + 1).padStart(2, "0")}</b>　${esc(r.title)}</span><span class="n">${r.items.length} 部</span></a>`).join("");
  $("rail-trend").innerHTML = DATA.latest.slice(0, 6).map((t, i) => {
    const heat = (98.4 - i * 2.1 - (hash(t.title) % 10) / 10).toFixed(1);
    return `<div class="ri"><span class="no">${String(i + 1).padStart(2, "0")}</span>
      <div><b>${esc(t.title)}</b><span>${esc(t.cls || t.type)} · ${heat}</span></div></div>`;
  }).join("");
  $("rail-cont").innerHTML = DATA.latest.slice(1, 5).map((c) => {
    const prog = 20 + (hash(c.title) % 70);
    return `<div class="ci"><b>${esc(c.title)}</b><div class="prog"><b style="width:${prog}%"></b></div>
      <span>看到 ${prog}% · ${esc(c.remarks || c.cls || c.type)}</span></div>`;
  }).join("");
}

function renderHero() {
  const pool = DATA.latest;
  const h = pool[heroIdx % pool.length];
  $("hero").innerHTML = `
    <img src="${esc(h.pic)}" alt="${esc(h.title)}" loading="eager" onerror="this.remove()">
    <div class="veil"></div>
    <a class="shuffle" id="shuffle">⟳ 换一换</a>
    <div class="cap"><div class="kick">今日头条 · ${esc(h.src)} 收录</div>
      <h1>${esc(h.title)}</h1>
      <p>${esc(h.content || `${h.cls || h.type} · ${h.year} 年作品 · ${h.remarks || "正片"}`)}</p>
      <div class="row"><a class="play">▶ 立即播放</a></div>
    </div>`;
  $("shuffle").addEventListener("click", () => { heroIdx += 1 + Math.floor(hash(String(heroIdx)) % 3); renderHero(); });
}

function renderRows() {
  $("rows").innerHTML = ROWS.map((r, i) => `
    <section class="sec" id="row-${i}">
      <div class="sec-head"><span class="no">${String(i + 1).padStart(2, "0")}</span><h2>${esc(r.title)}</h2>
        <span class="sub">${esc(r.sub)} · 真实片库</span><a class="more" href="#">更多 →</a></div>
      <div class="row-scroll">${r.items.slice(0, 12).map((it) => `
        <div class="p"><img src="${esc(it.pic)}" alt="${esc(it.title)}" loading="lazy" onerror="this.parentElement.classList.add('skl');this.remove()">
          <span class="sc">${esc(it.remarks || it.score || it.year)}</span>
          <div class="lab"><h4>${esc(it.title)}</h4><p>${esc(it.cls || it.type)} · ${esc(it.year)}</p></div>
        </div>`).join("")}</div>
    </section>`).join("");
  // 左栏目录点击 → 滚动定位
  $("rail-nav").addEventListener("click", (e) => {
    const a = e.target.closest("a"); if (!a) return;
    const idx = [...$("rail-nav").children].indexOf(a);
    const el = $("row-" + idx);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  });
}

function useFallback() {
  const mk = (n, t) => Array.from({ length: n }, (_, i) => ({
    title: t + " " + (i + 1), pic: "", type: "剧集", year: "2026",
    remarks: "更新至第 " + (i + 3) + " 集", cls: "演示", score: null, src: "离线", content: ""
  }));
  DATA = { latest: mk(12, "演示条目"), movies: mk(12, "演示电影"), tvs: mk(12, "演示剧集") };
}

(async () => {
  renderSkeletons();
  try {
    DATA = await fetchAll();
    if (!DATA.latest.length) throw new Error("empty");
    renderMasthead(true);
  } catch (e) {
    useFallback();
    renderMasthead(false);
  }
  ROWS = buildRows(DATA);
  renderRail();
  renderHero();
  renderRows();
})();
</script>
<script id="xdev-js">
(function(){
  var d=new URLSearchParams(location.search).get("device");
  if(!d)return;
  document.documentElement.setAttribute("data-device",d);
  var b=document.createElement("div");
  b.className="xdev-badge";
  b.textContent=d==="tv"?"TV · 10-FOOT MODE":d==="beamer"?"PROJECTOR MODE":"";
  if(b.textContent)document.body.appendChild(b);
  if(d==="beamer"){
    addEventListener("load",function(){setTimeout(function(){
      var lum=function(a){if(!a)return 1;var m=a.match(/[\d.]+/g);if(!m||m.length<3)return 1;if(m.length>3&&+m[3]===0)return 1;return .2126*(+m[0]/255)+.7152*(+m[1]/255)+.0722*(+m[2]/255)};
      var lv=lum(getComputedStyle(document.body).backgroundColor);
      if(lv>=1)lv=lum(getComputedStyle(document.documentElement).backgroundColor);
      if(lv>.5)document.documentElement.setAttribute("data-invert","1");
    },300)});
  }
})();
</script>
