/* 设置页专属：左栏 6 tab（对齐 SettingsTabBar）+ 右栏分组字段。
   控件全部为报刊版：规则线分隔 / 衬线小标题 / 无卡片。 */
.set-head{display:flex;align-items:baseline;gap:16px;border-bottom:2px solid var(--ink);
  padding-bottom:clamp(10px,1.4vh,16px);margin-bottom:clamp(14px,2vh,24px)}
.set-head h2{font-family:var(--serif);font-size:clamp(19px,1.7vw,32px);font-weight:900}
.set-head span{font-size:clamp(11px,.72vw,13px);color:var(--ink-3);letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.group{margin-bottom:clamp(20px,3vh,38px)}
.group .rail-title{border-bottom:1px solid var(--rule);padding-bottom:8px}
.note{font-size:clamp(11px,.72vw,12.5px);color:var(--ink-3);margin-top:8px;line-height:1.6}
/* 计数器（− 值 +）：对齐 settings-counter（片头/片尾时长、更新间隔、刷新间隔） */
.counter{display:flex;align-items:center;gap:clamp(8px,.8vw,12px)}
.counter button{width:clamp(24px,1.8vw,30px);height:clamp(24px,1.8vw,30px);border:1px solid var(--rule);
  border-radius:50%;font-size:14px;line-height:1;transition:.18s}
.counter button:hover:not(:disabled){border-color:var(--ink);background:var(--band)}
.counter button:disabled{opacity:.35;cursor:not-allowed}
.counter .v{min-width:2.2em;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.counter .u{font-size:clamp(11px,.72vw,12.5px);color:var(--ink-3)}
/* 滑块（TV 过扫描安全区 0–20 step5） */
.slider{display:flex;align-items:center;gap:clamp(8px,.8vw,12px);min-width:clamp(150px,18vw,240px)}
.slider input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.slider .v{min-width:3.2em;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
/* 皮肤选择（默认 / 卡通 / 机械 / 复古） */
.skins{display:flex;gap:clamp(8px,.9vw,14px);flex-wrap:wrap}
.skin-btn{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:clamp(11px,.74vw,12.5px);color:var(--ink-2)}
.skin-btn .sw{width:clamp(40px,3.4vw,58px);height:clamp(28px,2.4vw,40px);border:1px solid var(--rule);border-radius:4px;transition:.18s}
.skin-btn.on{color:var(--ink);font-weight:800}
.skin-btn.on .sw{border:2px solid var(--ink)}
/* 源管理表格（视频源 / IPTV 源 / EPG 源） */
.src-head{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--rule);
  padding-bottom:8px;margin-bottom:8px}
.src-head b{font-family:var(--serif);font-size:clamp(14px,1vw,18px);font-weight:900}
.src-head .cap{font-size:clamp(10.5px,.7vw,12px);color:var(--ink-3)}
.src-head .ops{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto}
.tbl-wrap .tbl{min-width:clamp(420px,52vw,720px)}
.tbl .u{color:var(--ink-3);font-size:clamp(10.5px,.68vw,12px);word-break:break-all}
.tbl .ops{display:flex;gap:8px;white-space:nowrap}
.tbl .ops button{font-size:clamp(11px,.72vw,12.5px);color:var(--ink-2)}
.tbl .ops button:hover{color:var(--accent)}
.tbl .ops .del{color:var(--accent)}
/* 个人资料（头像 + 昵称，点击编辑） */
.profile{display:flex;align-items:center;gap:clamp(14px,1.6vw,26px);width:100%;text-align:left;
  padding:clamp(10px,1.4vh,16px) 0;border-bottom:1px solid var(--rule);transition:background .18s}
.profile:hover{background:var(--band)}
.avatar{width:clamp(56px,5vw,84px);height:clamp(56px,5vw,84px);border-radius:50%;overflow:hidden;

.card-ops{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
/* 关于：版本 / 更新日志 / 隐藏入口 + 免责声明 */

.modal{position:fixed;inset:0;z-index:9500;display:flex;align-items:center;justify-content:center;

.modal .mf .input{width:100%}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
/* toast（对齐项目 toastBus：成功/错误/提示） */
.toast{position:fixed;left:50%;bottom:clamp(18px,4vh,40px);transform:translateX(-50%);z-index:9800;

  box-shadow:0 8px 24px rgba(12,12,14,.24);max-width:88vw}
@media (width<=767px){
  .set-head{gap:10px}
  .about-row{flex-wrap:wrap;gap:6px}
  .about-row .k{min-width:0;width:100%}
  .src-head{flex-wrap:wrap}
  .src-head .ops{margin-left:0;width:100%}
  .modal .panel{max-height:92vh}

/* ---------- 移动端菜单列表 + 子页（真实 Settings 移动形态；桌面不受影响） ---------- */
.m-menu,.m-back{display:none}
.m-item{display:flex;align-items:center;gap:12px;width:100%;padding:clamp(12px,2.2vh,16px) 2px;

.m-item .m-ic img{width:100%;height:100%;object-fit:cover}

  .rail-aside > main{display:none}
  .m-menu{display:block}
  .rail-aside.sub > main{display:block}

  .m-back{display:inline-flex;align-items:center;gap:4px;margin-bottom:6px;padding:6px 10px 6px 0;
    border:0;background:none;font:inherit;font-size:clamp(13px,3.4vw,15px);font-weight:700;color:var(--ink-2);cursor:pointer}
  .m-back:hover{color:var(--accent)}

/* ---------- toast / 弹窗 ---------- */
var toastTimer = null;
function toast(msg){
  var old = document.querySelector('.toast'); if(old) old.remove();
  var el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.remove(); }, 2200);
}
function modal(html){
  var m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = '<div class="panel">'+html+'</div>';
  m.addEventListener('click', function(e){ if(e.target===m) m.remove(); });
  document.body.appendChild(m);
  return m;
}
function confirmBox(title, desc, onOk){
  var m = modal('<h3>'+KINO_E.esc(title)+'</h3><p class="desc">'+KINO_E.esc(desc)+'</p>'+
    '<div class="acts"><button class="btn" data-no type="button">取消</button>'+
    '<button class="btn btn--accent" data-yes type="button">确认</button></div>');
  m.querySelector('[data-no]').addEventListener('click', function(){ m.remove(); });
  m.querySelector('[data-yes]').addEventListener('click', function(){ m.remove(); onOk(); });
}
function inputBox(title, desc, fields, onOk){
  var body = fields.map(function(f){
    return '<div class="mf"><span class="lbl">'+KINO_E.esc(f.label)+'</span>'+
      '<input class="input" data-f="'+f.key+'" type="'+(f.type||'text')+'" value="'+KINO_E.esc(f.value||'')+'" placeholder="'+KINO_E.esc(f.ph||'')+'"></div>';
  }).join('');
  var m = modal('<h3>'+KINO_E.esc(title)+'</h3><p class="desc">'+KINO_E.esc(desc)+'</p>'+body+
    '<div class="acts"><button class="btn" data-no type="button">取消</button>'+
    '<button class="btn btn--solid" data-yes type="button">保存</button></div>');
  var first = m.querySelector('input'); if(first) first.focus();
  m.querySelector('[data-no]').addEventListener('click', function(){ m.remove(); });
  m.querySelector('[data-yes]').addEventListener('click', function(){
    var out = {};
    Array.prototype.forEach.call(m.querySelectorAll('input[data-f]'), function(i){ out[i.getAttribute('data-f')] = i.value.trim(); });
    m.remove(); onOk(out);
  });
}

/* ---------- 备份（对齐 settingsBackup.ts：{version,exportedAt,settings,collections,history}） ---------- */
function collectBackup(){
  var favs = [], hist = [];
  try { favs = JSON.parse(localStorage.getItem('kino-demo-favs')||'[]'); } catch(e) {}
  try { hist = JSON.parse(localStorage.getItem('kino-demo-history')||'[]'); } catch(e) {}
  return { version:1, exportedAt:new Date().toISOString(), settings:CFG,
    collections:favs, history:hist };
}
function exportBackup(){
  var data = collectBackup();
  var blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'kinotv-backup-' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.json';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast('已导出设置与数据');
}
function applyBackup(obj){
  if(!obj || typeof obj!=='object' || !obj.settings || typeof obj.settings!=='object') throw new Error('文件格式不正确：缺少设置数据');
  Object.keys(DEF).forEach(function(k){ if(k in obj.settings) CFG[k] = obj.settings[k]; });
  save();
  if(Array.isArray(obj.collections)) try { localStorage.setItem('kino-demo-favs', JSON.stringify(obj.collections)); } catch(e) {}
  if(Array.isArray(obj.history)) try { localStorage.setItem('kino-demo-history', JSON.stringify(obj.history)); } catch(e) {}
}
var importInput = null;
function ensureImportInput(){
  if(importInput) return importInput;
  importInput = document.createElement('input');
  importInput.type = 'file'; importInput.accept = 'application/json,.json'; importInput.style.display = 'none';
  importInput.addEventListener('change', function(){
    var f = importInput.files && importInput.files[0]; importInput.value = '';
    if(!f) return;
    f.text().then(function(txt){
      try { applyBackup(JSON.parse(txt)); toast('已导入并恢复数据'); render(); }
      catch(err){ toast('导入失败：' + (err.message||'文件解析错误')); }
    }, function(){ toast('导入失败：文件读取错误'); });
  });
  document.body.appendChild(importInput);
  return importInput;
}

    CUR = b.getAttribute('data-tab'); render(); mEnter();
  });
  document.getElementById('m-menu').addEventListener('click', function(e){
    var b = e.target.closest('[data-m]'); if(!b) return;
    CUR = b.getAttribute('data-m'); render(); mEnter();
  });
  document.getElementById('m-back').addEventListener('click', function(){
    document.querySelector('.rail-aside').classList.remove('sub');
  });
  document.getElementById('tab-q').addEventListener('input', function(){
    var q = this.value.trim();
    document.getElementById('tabs').innerHTML = TABS.filter(function(x){ return !q || x.label.indexOf(q)>=0; })
      .map(function(x){ return '<button class="rail-item'+(x.key===CUR?' on':'')+'" data-tab="'+x.key+'" type="button"><span class="ic">'+x.icon+'</span>'+x.label+'</button>'; }).join('');
  });

  document.addEventListener('click', function(e){
    var s = e.target.closest('[data-sw]');
    if(s){ var k = s.getAttribute('data-sw'); CFG[k] = !CFG[k]; save();
      s.querySelector('.sw').setAttribute('aria-checked', CFG[k]?'true':'false');
      if(k==='tvMode') render();          /* TV 模式切换会增删「过扫描 / 界面缩放」两行 */
      return; }

    var th = e.target.closest('[data-theme]');
    if(th){ CFG.theme = th.getAttribute('data-theme'); save(); applyTheme();
      Array.prototype.forEach.call(document.querySelectorAll('[data-theme]'), function(x){
        x.classList.toggle('on', x.getAttribute('data-theme')===CFG.theme); });
      return; }

    var sk = e.target.closest('[data-skin]');
    if(sk){ CFG.skin = sk.getAttribute('data-skin'); save();
      Array.prototype.forEach.call(document.querySelectorAll('[data-skin]'), function(x){
        x.classList.toggle('on', x.getAttribute('data-skin')===CFG.skin); });
      toast('皮肤已切换为「'+sk.textContent.trim()+'」（美术资源在本 demo 不可用）');
      return; }

    var inc = e.target.closest('[data-inc]');
    if(inc){
      var key = inc.getAttribute('data-inc'), by = parseInt(inc.getAttribute('data-by'),10);
      var min = parseInt(inc.getAttribute('data-min'),10), max = parseInt(inc.getAttribute('data-max'),10);
      var v = Math.min(max, Math.max(min, (parseInt(CFG[key],10)||0) + by));
      CFG[key] = v; save(); render(); return; }

    var tog = e.target.closest('[data-tog]');
    if(tog){
      var kind = tog.getAttribute('data-tog'), url = tog.getAttribute('data-url');
      var set = enabledSet(kind), i = set.indexOf(url);
      if(i>=0){
        if(set.length<=1){ toast('至少保留一个启用源'); return; }
        set.splice(i,1);
      } else {
        if(set.length>=MAX_ENABLED[kind]){ toast('最多启用 '+MAX_ENABLED[kind]+' 个'+kind+'源'); return; }
        set.push(url);
      }
      render(); return; }

    var more = e.target.closest('[data-more]');
    if(more){ var kd = more.getAttribute('data-more'); SHOW_ALL[kd] = !SHOW_ALL[kd]; render(); return; }

    var add = e.target.closest('[data-add]');
    if(add){ toast('新增自定义源（真实项目打开 SourceModal：名称 / 地址 / 详情 / 超时 / 重试）'); return; }
    var ed = e.target.closest('[data-edit]');
    if(ed){ toast('编辑源（真实项目打开 SourceModal，内置源可停用不可删除）'); return; }
    var im = e.target.closest('[data-import]');
    if(im){ toast('源导入支持 文件 / URL / 文本 三种方式（本 demo 不发起网络请求）'); return; }
    var ex = e.target.closest('[data-export]');
    if(ex){
      var kk = ex.getAttribute('data-export');
      var list = kk==='video'?VIDEO_SOURCES:kk==='iptv'?IPTV_SOURCES:EPG_SOURCES;
      var blob = new Blob([JSON.stringify(list.map(function(x){ return {name:x[0], url:x[1]}; }),null,2)], {type:'application/json'});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'kino-'+kk+'-sources.json';
      document.body.appendChild(a); a.click(); a.remove();
      toast('已导出 '+list.length+' 个'+kk+'源'); return; }

    var cfg = e.target.closest('[data-cfg]');
    if(cfg){
      var key2 = cfg.getAttribute('data-cfg');
      if(key2==='baidu'){
        inputBox('百度翻译 API','配置百度翻译开放平台的 App ID 和密钥，用于自动翻译字幕功能。',
          [{key:'translationAppId',label:'App ID',value:CFG.translationAppId},{key:'translationApiKey',label:'密钥',value:CFG.translationApiKey,type:'password'}],
          function(v){ CFG.translationAppId = v.translationAppId||''; CFG.translationApiKey = v.translationApiKey||''; save(); render(); toast('已保存'); });
      } else {
        var tips = {
          tmdbAccessToken:'配置后首页 TMDB 发现可用（真实项目内该字段加密存储）',
          corsProxy:'CORS 代理用于绕过浏览器跨域限制，留空则直连。',
          proxyUrl:'IPTV 播放依赖此代理绕过跨域限制，格式如 https://your-worker.workers.dev',
          proxyPattern:'匹配正则的 URL 不走代理，其余走代理；留空则所有地址都走代理。',
        };
        inputBox(cfg.textContent.trim()==='修改' ? '修改配置' : '配置', tips[key2]||'',
          [{key:key2,label:key2,value:CFG[key2],ph:'https://…'}],
          function(v){ CFG[key2] = v[key2]||''; save(); render(); toast('已保存'); });
      }
      return; }

    if(e.target.closest('#profile-btn')){
      inputBox('编辑个人资料','设置昵称与头像地址（真实项目内点头像打开 ProfileEditModal）。',
        [{key:'username',label:'昵称',value:CFG.username,ph:'未设置昵称'},{key:'avatar',label:'头像 URL',value:CFG.avatar,ph:'https://…'}],
        function(v){ CFG.username = v.username||''; CFG.avatar = v.avatar||''; save(); render(); toast('已保存'); });
      return; }

    var act = e.target.closest('[data-act]');
    if(act){
      var a2 = act.getAttribute('data-act');
      if(a2==='export'){ exportBackup(); return; }
      if(a2==='import'){ ensureImportInput().click(); return; }
      if(a2==='version'){ toast('当前 v1.29.0（demo 不发起更新检测）'); return; }
      if(a2==='changelog'){ location.href = '../CHANGELOG.md'; return; }
      if(a2==='hidden'){
        /* 隐藏入口：连续点击 3 次（真实项目进入 /proxy-setup 一键配置代理页） */
        TAPS++; clearTimeout(TAP_TIMER); TAP_TIMER = setTimeout(function(){ TAPS = 0; }, 3000);
        if(TAPS < 3){ toast('再点击 ' + (3-TAPS) + ' 次进入一键配置代理页'); }
        else { TAPS = 0; toast('真实项目跳转 /proxy-setup；本 demo 打开「源检测」页'); location.href = 'e-source-checker.html'; }
        return; }
    }

    var cf = e.target.closest('[data-confirm]');
    if(cf){
      var kind2 = cf.getAttribute('data-confirm');
      var favN = 0, hisN = 0;
      try { favN = JSON.parse(localStorage.getItem('kino-demo-favs')||'[]').length; } catch(e) {}
      try { hisN = JSON.parse(localStorage.getItem('kino-demo-history')||'[]').length; } catch(e) {}
      var T = { all:'恢复默认并清空数据', reset:'恢复设置默认', collections:'清空我的收藏', history:'清空观看历史', cache:'清除全部缓存' };
      var D = {
        all:'将设置页内容全部恢复默认，并清空收藏与观看历史，此操作不可恢复。',
        reset:'仅重置设置项，收藏与观看历史不受影响。',
        collections:'将清空全部 '+favN+' 条收藏，此操作不可恢复。',
        history:'将清空全部 '+hisN+' 条观看历史，此操作不可恢复。',
        cache:'将清除频道列表、节目单、首页与类目数据、源检测结果等缓存，清除后将在下次访问时自动重新加载。不影响设置、收藏、历史等个人数据。',
      };
      confirmBox(T[kind2], D[kind2], function(){
        if(kind2==='reset' || kind2==='all'){ CFG = Object.assign({}, DEF); save(); applyTheme(); applyScale(); }
        if(kind2==='collections' || kind2==='all'){ try { localStorage.setItem('kino-demo-favs','[]'); } catch(e) {} }
        if(kind2==='history' || kind2==='all'){ try { localStorage.setItem('kino-demo-history','[]'); } catch(e) {} }
        if(kind2==='cache'){
          try { localStorage.removeItem('kino-demo-hist-seeded'); localStorage.removeItem('kino-demo-coll-seeded'); } catch(e) {}
        }
        render();
        toast({reset:'设置已恢复默认',collections:'收藏已清空',history:'观看历史已清空',cache:'已清除全部缓存',all:'已恢复默认并清空收藏、历史'}[kind2]);
      });
      return; }
  });

  document.addEventListener('change', function(e){
    var s2 = e.target.closest('[data-sel]');
    if(s2){ CFG[s2.getAttribute('data-sel')] = s2.value; save();
      if(s2.getAttribute('data-sel')==='uiScale') applyScale();
      return; }
    var r = e.target.closest('[data-rng]');
    if(r){ CFG[r.getAttribute('data-rng')] = parseInt(r.value,10); save(); render(); return; }
  });
}

KINO_E.boot({ key:'settings', title:'设置' }).then(function(){
  applyTheme(); applyScale();
  render(); renderMMenu(); bind();
  if(window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ if(CFG.theme==='system') applyTheme(); });
});
</script>
</body>
</html>
