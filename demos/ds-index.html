<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>设计 Skill 分层评估 · Demo 总览（3 款）</title>
<style>
:root{
  --shell-bg:#0f0f13; --shell-fg:#e9e7e2; --shell-dim:#8b8983;
  --shell-line:#2a2a32; --shell-accent:#3ddc97; --shell-warn:#ffb44d;
  --shell-mono:"JetBrains Mono","Consolas",monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body{
  background:var(--shell-bg); color:var(--shell-fg);
  font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
/* ── 顶部切换条 ─────────────────────────── */
.shell-bar{
  flex:0 0 auto; display:flex; align-items:center; gap:4px;
  padding:8px 16px 6px; border-bottom:1px solid var(--shell-line);
  background:#16161b; flex-wrap:wrap;
}
.shell-bar.row2{
  padding:6px 16px 9px; border-bottom:1px solid #202026; background:#121217;
}
.shell-brand{
  font-family:var(--shell-mono); font-weight:700; letter-spacing:.06em;
  margin-right:14px; font-size:13px; color:var(--shell-accent); white-space:nowrap;
}
.shell-label{
  font-size:11px; color:var(--shell-dim); letter-spacing:.14em;
  margin:0 8px 0 2px; white-space:nowrap;
}
.shell-tab{
  appearance:none; border:1px solid transparent; background:transparent;
  color:var(--shell-dim); font-size:12.5px; line-height:1;
  padding:7px 12px; border-radius:999px; cursor:pointer;
  white-space:nowrap; font-family:inherit;
  transition:color .15s, border-color .15s, background .15s;
}
.shell-tab:hover{ color:var(--shell-fg); }
.shell-tab.active{ color:var(--shell-fg); border-color:var(--shell-line); background:#22222a; }
.shell-tab .tno{
  font-family:var(--shell-mono); color:var(--shell-accent);
  margin-right:6px; font-size:11px;
}
.shell-tab.no .tno{ color:#ff7a6b; }
.shell-note{
  margin-left:auto; font-size:11.5px; color:var(--shell-dim); white-space:nowrap;
}
.shell-note b{ color:var(--shell-fg); font-weight:600; }
/* ── demo 容器 ─────────────────────────── */
.shell-stage{ flex:1 1 auto; position:relative; background:var(--shell-bg); overflow:hidden; }
.shell-frame{
  position:absolute; inset:0; width:100%; height:100%; border:0;
  display:none; background:#fff;
}
.shell-frame.active{ display:block; }
</style>
</head>
<body>

<nav class="shell-bar" id="shellBar">
  <span class="shell-brand">设计 Skill 分层评估</span>
  <span class="shell-label">对照</span>
  <button class="shell-tab active" data-demo="ds-1-naive"><span class="tno">DS-1</span>原方案直译 · 冲突</button>
  <button class="shell-tab" data-demo="ds-2-unified"><span class="tno">DS-2</span>修正方案 · 借手法</button>
  <button class="shell-tab no" data-demo="ds-3-foundation"><span class="tno">DS-3</span>地基对照 · 12 套比对</button>
  <span class="shell-note">结论：<b>地基不换</b> · 4 个 skill 只借<b>结构手法</b>与<b>材质手法</b></span>
</nav>

<nav class="shell-bar row2">
  <span class="shell-label">看什么</span>
  <span class="shell-note" id="hint" style="margin-left:0">
    DS-1 = 首页(impeccable) / 详情(editorial) / 播放器(glassmorphism) 各套原生皮肤 → 看<b>品牌跳变</b>与<b>中文失守</b>
  </span>
</nav>

<div class="shell-stage" id="shellStage"></div>

<script>
(function () {
  var stage = document.getElementById("shellStage");
  var tabs = Array.prototype.slice.call(document.querySelectorAll("#shellBar .shell-tab"));
  var hint = document.getElementById("hint");
  var frames = {};
  var current = null;

  var HINTS = {
    "ds-1-naive": "DS-1 = 首页(impeccable) / 详情(editorial) / 播放器(glassmorphism) 各套原生皮肤 → 看<b>品牌跳变</b>与<b>中文失守</b>",
    "ds-2-unified": "DS-2 = 同样三页，三栏共用项目 token，只借构图 / 栅格 / 材质 → 看<b>差异只剩构图密度</b>",
    "ds-3-foundation": "DS-3 = 项目 BASELINE 与 12 套 skill 的逐维度对齐 + 4 套地基实物对比 → 看<b>谁最贴近</b>"
  };

  function getFrame(name) {
    if (!frames[name]) {
      var f = document.createElement("iframe");
      f.className = "shell-frame";
      f.setAttribute("title", name);
      f.src = name + ".html";
      stage.appendChild(f);
      frames[name] = f;
    }
    return frames[name];
  }

  function show(name) {
    if (current === name) return;
    tabs.forEach(function (t) {
      t.classList.toggle("active", t.getAttribute("data-demo") === name);
    });
    if (current && frames[current]) frames[current].classList.remove("active");
    getFrame(name).classList.add("active");
    current = name;
    hint.innerHTML = HINTS[name] || "";
  }

  tabs.forEach(function (t) {
    t.addEventListener("click", function () { show(t.getAttribute("data-demo")); });
  });

  show("ds-1-naive");
})();
</script>
</body>
</html>
