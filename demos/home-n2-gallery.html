<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KinoTV Demo N2 — 画廊白盒 · 极简展陈</title>
<style>
/* ============================================================
   Demo N2 · 画廊白盒（Gallery White Cube）
   美术馆式展陈：纯白底 + 超大留白 + 海报即展品（裸排无框）+ 黑字极细/极粗对比
   模块对齐现有首页：Hero / 继续观看 / 7 行 / 分类入口
   零卡片 · 首屏预算制 · 列数梯度 · 封顶 2200 · 真实 CMS 数据
   ============================================================ */
:root{
  --bg:#f7f6f3; --ink:#111113; --ink-2:#5b5b60; --ink-3:#a3a3a8;
  --rule:#e3e1da; --hot:#111113;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --content-max:2200px;
  --pad-x:clamp(20px,3vw,56px); --gap:clamp(14px,1.2vw,24px);
  --poster-n:6; --cont-n:4;
}
@media (width>=1440px){ :root{--pad-x:64px; --poster-n:7; --cont-n:5} }
@media (width>=1920px){ :root{--pad-x:104px; --poster-n:8; --cont-n:6} }
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:100%;object-fit:cover}
.page{max-width:var(--content-max);margin:0 auto;padding:0 var(--pad-x)}

/* ---------- 顶部：极简字标 + 导航 ---------- */
.top{display:flex;align-items:baseline;gap:clamp(18px,2vw,40px);padding:clamp(18px,3vh,34px) 0 0;flex-wrap:wrap}
.logo{font-size:clamp(18px,1.5vw,26px);font-weight:900;letter-spacing:.02em}
.logo em{font-style:normal;color:var(--ink-3);font-weight:300}
.top nav{display:flex;gap:clamp(14px,1.4vw,30px);flex-wrap:wrap}
.top nav a{font-size:clamp(13px,.86vw,15px);color:var(--ink-2);transition:.2s}
.top nav a.on,.top nav a:hover{color:var(--ink);font-weight:700}
.data-badge{margin-left:auto;font-size:clamp(10.5px,.68vw,12px);color:var(--ink-3);
  border:1px solid var(--rule);border-radius:99px;padding:2px 10px;white-space:nowrap}
.data-badge b{color:var(--ink);font-weight:700}

/* ---------- Hero：左字右图对开（无遮罩，海报干净呈现） ---------- */
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,4fr);
  gap:clamp(28px,3.4vw,72px);align-items:end;
  height:clamp(340px,48vh,580px);margin-top:clamp(18px,3vh,36px)}
.hero .txt{display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:clamp(4px,1vh,14px);min-width:0}
.hero .kick{font-size:clamp(11px,.72vw,12.5px);letter-spacing:.34em;color:var(--ink-3);text-transform:uppercase;margin-bottom:clamp(10px,1.6vh,20px)}
.hero h1{font-size:clamp(34px,6.4vh,76px);font-weight:900;line-height:1.04;letter-spacing:-.01em;margin-bottom:clamp(10px,1.8vh,22px)}
.hero .meta{display:flex;gap:clamp(10px,1vw,20px);flex-wrap:wrap;font-size:clamp(12px,.8vw,14.5px);color:var(--ink-2);margin-bottom:clamp(12px,2vh,26px)}
.hero .meta .sc{font-weight:900}
.hero .actions{display:flex;gap:clamp(10px,1vw,18px);align-items:center}
.hero .btn{border-radius:999px;padding:clamp(9px,1.3vh,13px) clamp(20px,2vw,36px);
  font-size:clamp(13px,.86vw,15.5px);font-weight:800;cursor:pointer;transition:.2s}
.hero .btn.dark{background:var(--ink);color:#fff}
.hero .btn.dark:hover{background:#000}
.hero .btn.line{border:1px solid var(--ink);color:var(--ink)}
.hero .btn.line:hover{background:var(--ink);color:#fff}
.hero .pic{position:relative;align-self:stretch;overflow:hidden;border-radius:clamp(8px,.6vw,14px);background:#ebe9e2}
.hero .pic img{position:absolute;inset:0;transition:transform 6s}
.hero .pic:hover img{transform:scale(1.02)}
.hero .pic .tag{position:absolute;left:clamp(12px,1.2vw,24px);top:clamp(12px,1.2vw,24px);
  font-size:clamp(10.5px,.7vw,12px);font-weight:800;letter-spacing:.1em;color:var(--ink);
  background:rgba(247,246,243,.92);border-radius:4px;padding:4px 10px}

/* ---------- 展签式行标题（大黑字 + 细注） ---------- */
.sec{margin-top:clamp(34px,6vh,72px)}
.sec-head{display:flex;align-items:baseline;gap:clamp(14px,1.4vw,28px);
  border-bottom:1px solid var(--rule);padding-bottom:clamp(10px,1.6vh,18px);margin-bottom:clamp(14px,2.2vh,26px)}
.sec-head .idx{font-size:clamp(11px,.72vw,12.5px);letter-spacing:.28em;color:var(--ink-3)}
.sec-head h2{font-size:clamp(24px,2.6vw,44px);font-weight:900;letter-spacing:.01em}
.sec-head .sub{font-size:clamp(11.5px,.76vw,13.5px);color:var(--ink-3)}
.sec-head .more{margin-left:auto;font-size:clamp(12px,.8vw,14px);color:var(--ink-2)}
.sec-head .more:hover{color:var(--ink)}

/* ---------- 分类入口：展签行 ---------- */
.cats{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:clamp(18px,2vw,40px);row-gap:10px;
  margin-top:clamp(14px,2.4vh,28px)}
.cats a{font-size:clamp(15px,1.3vw,24px);font-weight:900;transition:.2s;cursor:pointer}
.cats a:hover{color:transparent;-webkit-text-stroke:1.2px var(--ink)}
.cats a .n{font-size:clamp(11px,.72vw,13px);font-weight:400;color:var(--ink-3);margin-left:6px;vertical-align:baseline}

/* ---------- 继续观看 ---------- */
.cont-grid{display:grid;grid-template-columns:repeat(var(--cont-n),minmax(0,1fr));gap:var(--gap)}
.cont-cell{cursor:pointer;min-width:0}
.cont-cell .th{aspect-ratio:16/9;overflow:hidden;border-radius:clamp(6px,.5vw,10px);position:relative;background:#ebe9e2;
  transition:transform .3s, box-shadow .3s}
.cont-cell:hover .th{transform:translateY(-3px);box-shadow:0 18px 40px -18px rgba(17,17,19,.28)}
.cont-cell .th img{position:absolute;inset:0;transition:transform .5s}
.cont-cell:hover .th img{transform:scale(1.05)}
.cont-cell .th .time{position:absolute;right:9px;bottom:9px;font-size:clamp(10px,.66vw,11.5px);color:#fff;
  background:rgba(17,17,19,.72);padding:2px 8px;border-radius:5px}
.cont-cell .prog{height:2px;background:var(--rule);position:relative;margin-top:clamp(8px,1.2vh,12px)}
.cont-cell .prog b{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.cont-cell h4{font-size:clamp(14px,.95vw,17px);font-weight:800;margin-top:clamp(8px,1.2vh,13px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cont-cell p{font-size:clamp(11.5px,.74vw,13px);color:var(--ink-3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 海报横滚（展品间距 = 留白） ---------- */
.row-scroll{display:grid;grid-auto-flow:column;
  grid-auto-columns:calc((100% - (var(--poster-n) - 1)*var(--gap)) / var(--poster-n));gap:var(--gap);
  overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:10px;scrollbar-width:none}
.row-scroll::-webkit-scrollbar{height:0}
.row-scroll .p{scroll-snap-align:start;position:relative;aspect-ratio:2/3;overflow:hidden;
  border-radius:clamp(6px,.5vw,10px);cursor:pointer;background:#ebe9e2;transition:transform .3s, box-shadow .3s}
.row-scroll .p:hover{transform:translateY(-5px);box-shadow:0 26px 48px -22px rgba(17,17,19,.32)}
.row-scroll .p img{position:absolute;inset:0;transition:transform .5s}
.row-scroll .p:hover img{transform:scale(1.05)}
.row-scroll .p .lab{position:absolute;left:0;right:0;bottom:0;padding:46px 12px 10px;color:#fff;
  background:linear-gradient(180deg,transparent,rgba(17,17,19,.88));opacity:0;transition:.3s}
.row-scroll .p:hover .lab{opacity:1}
.row-scroll .p .lab h4{font-size:clamp(13px,.9vw,15.5px);font-weight:800}
.row-scroll .p .lab p{font-size:clamp(10.5px,.68vw,12px);opacity:.78}
.row-scroll .p .sc{position:absolute;top:10px;right:10px;font-size:clamp(10.5px,.7vw,12px);font-weight:900;
  background:var(--bg);color:var(--ink);padding:2px 9px;border-radius:5px;
  max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 骨架 ---------- */
.skl{position:relative;overflow:hidden;background:#ebe9e2}
.skl::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:shimmer 1.4s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.skl-line{height:13px;border-radius:4px;margin-top:8px}

footer{margin:clamp(34px,6vh,72px) 0 clamp(24px,3.4vh,44px);padding-top:clamp(12px,1.6vh,20px);
  border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;
  font-size:clamp(11.5px,.76vw,13.5px);color:var(--ink-3)}
</style>
<style id="xdev-css">
/* ==== 设备适配层：TV 10-foot / 投影仪 / 超宽 ==== */
html[data-device="tv"]{--poster-n:6;--cont-n:4;--content-max:2200px}
html[data-device="tv"] body{zoom:1.5;padding:3.5vh 3.5vw!important;box-sizing:border-box}
html[data-device="tv"] :focus{outline:3px solid #d4a24e!important;outline-offset:3px;border-radius:4px}
html[data-device="beamer"]{--poster-n:7;--cont-n:5}
html[data-device="beamer"] body{zoom:1.4}
html[data-device="beamer"][data-invert="1"] body{filter:invert(1) hue-rotate(180deg);background:#fff}
html[data-device="beamer"][data-invert="1"] img,html[data-device="beamer"][data-invert="1"] video{filter:invert(1) hue-rotate(180deg)}
@media (width>=2560px){:root{--content-max:2600px;--pad-x:124px;--poster-n:9;--cont-n:7}}
@media (min-aspect-ratio:21/9){:root{--content-max:min(3000px,92vw);--pad-x:144px;--poster-n:10;--cont-n:8}}
.xdev-badge{position:fixed;right:14px;bottom:12px;z-index:99999;font:600 11px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.12em;color:#d4a24e;background:rgba(16,16,20,.82);border:1px solid rgba(212,162,78,.5);border-radius:999px;padding:6px 12px;pointer-events:none}
</style>
</head>
<body>
<div class="page">

  <header class="top">
    <span class="logo">KinoTV <em>/ 影视馆</em></span>
    <nav>
      <a class="on" href="#">首页</a><a href="#">电影</a><a href="#">剧集</a><a href="#">综艺</a><a href="#">动漫</a><a href="#">IPTV</a>
    </nav>
    <span class="data-badge" id="data-badge">真实接口拉取中…</span>
  </header>

  <!-- Hero 对开 -->
  <section class="hero" id="hero"></section>

  <!-- 分类展签行 -->
  <nav class="cats" id="cats"></nav>

  <!-- 继续观看 -->
  <section class="sec">
    <div class="sec-head"><span class="idx">EXHIBIT 01</span><h2>继续观看</h2><span class="sub">进度为演示值</span>
      <a class="more" href="#">全部记录 →</a></div>
    <div class="cont-grid" id="cont-grid"></div>
  </section>

  <!-- 7 行 -->
  <div id="rows"></div>

  <footer>
    <span>KinoTV — Demo N2 · 画廊白盒 · 标题/海报/简介来自内置 CMS 源（豆瓣 dbzy5 / 茅台 maotaizy）</span>
    <span>仅供风格评审</span>
  </footer>

</div>

<script>
/* ============ 数据层：与 E 基准同口径 ============ */
const SOURCES = [
  { name: "豆瓣资源", api: "https://caiji.dbzy5.com/api.php/provide/vod" },
  { name: "茅台资源", api: "https://caiji.maotaizy.cc/api.php/provide/vod" }
];
const TYPE_NAME = { 1: "电影", 2: "剧集", 3: "综艺", 4: "动漫" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const stripHtml = (s) => String(s ?? "").replace(/<[^>]*>/g, "").replace(/\s+/g, " ").trim();
const hash = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };

async function cms(api, params) {
  const url = api + "?" + new URLSearchParams(params).toString();
  const res = await fetch(url, { signal: AbortSignal.timeout(10000) });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const j = await res.json();
  if (j.code != null && j.code !== 1) throw new Error(j.msg || "CMS 业务异常");
  return j;
}
function mapItem(x, srcName) {
  return {
    id: x.vod_id, title: x.vod_name || "未命名", pic: x.vod_pic || "",
    type: TYPE_NAME[x.type_id_1 ?? x.type_id] || "影视", year: x.vod_year || "",
    remarks: x.vod_remarks || "", cls: (x.vod_class || "").split(",")[0] || "",
    score: parseFloat(x.vod_score) > 0 ? x.vod_score : null,
    content: stripHtml(x.vod_content), src: srcName
  };
}
async function fetchAll() {
  const jobs = [
    cms(SOURCES[0].api, { ac: "videolist", pg: 1, h: 168 }),
    cms(SOURCES[1].api, { ac: "videolist", pg: 1, h: 168 }),
    ...[1, 2, 3, 4].flatMap((t) => SOURCES.map((s) => cms(s.api, { ac: "videolist", t, pg: 1 })))
  ];
  const r = (await Promise.allSettled(jobs)).map((x) => x.status === "fulfilled" ? x.value.list ?? [] : []);
  const uniq = (arr) => { const s = new Set(); return arr.filter((x) => !s.has(x.title) && s.add(x.title)); };
  const byType = (i) => uniq([...r[2 + i * 2], ...r[3 + i * 2]].map((x) => mapItem(x, SOURCES[0].name)));
  return {
    latest: uniq([...r[0], ...r[1]].map((x) => mapItem(x, x.vod_pic?.includes("dbzy") ? SOURCES[0].name : SOURCES[1].name))),
    byType: { 1: byType(0), 2: byType(1), 3: byType(2), 4: byType(3) },
    totals: {}
  };
}

const ROT = (arr, k) => arr.length ? [...arr.slice(k % arr.length), ...arr.slice(0, k % arr.length)] : arr;
const byScore = (arr) => [...arr].sort((a, b) => (b.score || 0) - (a.score || 0));
let DATA = null, ROWS = [];

function buildRows(D) {
  return [
    { idx: "EXHIBIT 02", title: "正在热映", sub: "院线在映", items: D.byType[1].slice(0, 14) },
    { idx: "EXHIBIT 03", title: "热门电影", sub: "按收录热度", items: ROT(D.byType[1], 5) },
    { idx: "EXHIBIT 04", title: "高分电影", sub: "评分优先", items: byScore(D.byType[1]) },
    { idx: "EXHIBIT 05", title: "即将上映", sub: "新片预告", items: ROT(D.byType[1], 9) },
    { idx: "EXHIBIT 06", title: "热门剧集", sub: "按收录热度", items: D.byType[2].slice(0, 14) },
    { idx: "EXHIBIT 07", title: "高分剧集", sub: "评分优先", items: byScore(D.byType[2]) },
    { idx: "EXHIBIT 08", title: "今日播出", sub: "近 24h 更新", items: D.latest.slice(0, 14) }
  ];
}

function renderSkeletons() {
  $("hero").innerHTML = `<div class="txt"><div class="skl skl-line" style="width:120px"></div>
    <div class="skl skl-line" style="height:52px;width:60%"></div><div class="skl skl-line" style="width:40%"></div></div>
    <div class="pic"><div class="skl" style="position:absolute;inset:0"></div></div>`;
  $("cont-grid").innerHTML = Array(4).fill(0).map(() =>
    `<div class="cont-cell"><div class="th skl"></div><div class="skl skl-line" style="width:60%"></div></div>`).join("");
  $("rows").innerHTML = Array(3).fill(0).map(() => `
    <section class="sec"><div class="sec-head"><span class="skl skl-line" style="width:150px;margin:0"></span></div>
      <div class="row-scroll">${Array(6).fill(0).map(() => `<div class="p skl"></div>`).join("")}</div></section>`).join("");
}

function renderBadge(ok) {
  $("data-badge").innerHTML = ok
    ? `真实数据 · <b>${esc(SOURCES.map((s) => s.name).join("/"))}</b>`
    : `离线演示数据（接口不可达）`;
}

function renderHero(h) {
  if (!h) { $("hero").innerHTML = ""; return; }
  $("hero").innerHTML = `
    <div class="txt">
      <div class="kick">Featured · ${esc(h.src)} 收录</div>
      <h1>${esc(h.title)}</h1>
      <div class="meta">
        ${h.score ? `<span class="sc">★ ${esc(h.score)}</span>` : ""}
        <span>${esc(h.year)}</span><span>${esc(h.type)}</span>
        ${h.cls ? `<span>${esc(h.cls)}</span>` : ""}${h.remarks ? `<span>${esc(h.remarks)}</span>` : ""}
      </div>
      <div class="actions"><a class="btn dark">▶ 立即播放</a><a class="btn line">查看详情</a></div>
    </div>
    <div class="pic"><img src="${esc(h.pic)}" alt="${esc(h.title)}" loading="eager" onerror="this.remove()">
      <span class="tag">ON VIEW · 正在展出</span></div>`;
}

function renderCats(totals) {
  const cats = [["电影", totals[1]], ["剧集", totals[2]], ["综艺", totals[3]], ["动漫", totals[4]], ["IPTV 直播", 126]];
  $("cats").innerHTML = cats.map(([n, c]) =>
    `<a href="#">${esc(n)}${c != null ? `<span class="n">${(+c).toLocaleString()} 部</span>` : ""}</a>`).join("");
}

function renderContinue(items) {
  $("cont-grid").innerHTML = items.slice(1, 7).map((c) => {
    const prog = 20 + (hash(c.title) % 70);
    return `<div class="cont-cell">
      <div class="th"><img src="${esc(c.pic)}" alt="${esc(c.title)}" loading="lazy" onerror="this.parentElement.classList.add('skl');this.remove()">
        <span class="time">${esc(c.remarks || c.cls || c.type)}</span></div>
      <div class="prog"><b style="width:${prog}%"></b></div>
      <h4>${esc(c.title)}</h4><p>${esc(c.cls || c.type)} · ${esc(c.year)}</p></div>`;
  }).join("");
}

function renderRows() {
  $("rows").innerHTML = ROWS.map((r) => `
    <section class="sec">
      <div class="sec-head"><span class="idx">${esc(r.idx)}</span><h2>${esc(r.title)}</h2>
        <span class="sub">${esc(r.sub)} · ${r.items.length} 部</span><a class="more" href="#">更多 →</a></div>
      <div class="row-scroll">${r.items.slice(0, 12).map((it) => `
        <div class="p"><img src="${esc(it.pic)}" alt="${esc(it.title)}" loading="lazy" onerror="this.parentElement.classList.add('skl');this.remove()">
          <span class="sc">${esc(it.remarks || it.score || it.year)}</span>
          <div class="lab"><h4>${esc(it.title)}</h4><p>${esc(it.cls || it.type)} · ${esc(it.year)}</p></div>
        </div>`).join("")}</div>
    </section>`).join("");
}

function useFallback() {
  const mk = (n, t) => Array.from({ length: n }, (_, i) => ({
    title: t + " " + (i + 1), pic: "", type: "剧集", year: "2026",
    remarks: "更新至第 " + (i + 3) + " 集", cls: "演示", score: null, src: "离线", content: ""
  }));
  DATA = { latest: mk(12, "演示条目"), byType: { 1: mk(12, "演示电影"), 2: mk(12, "演示剧集"), 3: [], 4: [] } };
}

(async () => {
  renderSkeletons();
  let ok = true;
  try {
    DATA = await fetchAll();
    if (!DATA.latest.length) throw new Error("empty");
  } catch (e) { useFallback(); ok = false; }
  renderBadge(ok);
  ROWS = buildRows(DATA);
  renderHero(DATA.latest[0]);
  renderCats(DATA.totals);
  renderContinue(DATA.latest);
  renderRows();
  Promise.all([1, 2, 3, 4].flatMap((t) => SOURCES.map(async (s) => {
    try { return { t, total: (await cms(s.api, { ac: "videolist", t, pg: 1 })).total || 0 }; }
    catch { return { t, total: 0 }; }
  }))).then((rs) => {
    const sum = {};
    rs.forEach(({ t, total }) => { sum[t] = (sum[t] || 0) + total; });
    DATA.totals = sum;
    renderCats(sum);
  });
})();
</script>
<script id="xdev-js">
(function(){
  var d=new URLSearchParams(location.search).get("device");
  if(!d)return;
  document.documentElement.setAttribute("data-device",d);
  var b=document.createElement("div");
  b.className="xdev-badge";
  b.textContent=d==="tv"?"TV · 10-FOOT MODE":d==="beamer"?"PROJECTOR MODE":"";
  if(b.textContent)document.body.appendChild(b);
  if(d==="beamer"){
    addEventListener("load",function(){setTimeout(function(){
      var lum=function(a){if(!a)return 1;var m=a.match(/[\d.]+/g);if(!m||m.length<3)return 1;if(m.length>3&&+m[3]===0)return 1;return .2126*(+m[0]/255)+.7152*(+m[1]/255)+.0722*(+m[2]/255)};
