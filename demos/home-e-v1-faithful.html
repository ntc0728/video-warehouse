<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KinoTV Demo E-V1 — 报刊版式 · 现有首页结构忠实版</title>
<style>
/* ============================================================
   Demo E-V1 · 报刊版式 × 现有首页结构 1:1 忠实融合
   模块顺序 = 现有首页（Home/index.tsx ≥1024 分支）：
   报头(Header) → TopStrip 导读带 → 两栏(左栏趋势 rail + 右列 HeroBili 对开+换一换)
   → 继续观看 → 7 行横滚（正在热映/热门电影/高分电影/即将上映/热门剧集/高分剧集/今日播出）
   数据：CMS 真实接口（豆瓣/茅台源），零卡片，首屏预算制，封顶 2200
   ============================================================ */
:root{
  --paper:#fbfaf7; --ink:#141416; --ink-2:#57575f; --ink-3:#98989f;
  --rule:#d8d5cd; --accent:#b03a1e;
  --serif:"Noto Serif SC","Source Han Serif SC","STSong",serif;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --content-max:2200px;
  --pad-x:clamp(16px,2.4vw,44px); --gap:clamp(12px,1vw,20px);
  --poster-n:6; --cont-n:4; --side-n:2;
}
@media (width>=1440px){ :root{--pad-x:60px; --poster-n:7; --cont-n:5; --side-n:3} }
@media (width>=1920px){ :root{--pad-x:100px; --poster-n:8; --cont-n:6} }
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:100%;object-fit:cover}
.page{max-width:var(--content-max);margin:0 auto;padding:0 var(--pad-x)}

/* ---------- 报头 ---------- */
.masthead{padding-top:clamp(16px,2.4vh,28px)}
.mast-row{display:flex;align-items:baseline;justify-content:space-between;gap:20px;
  border-bottom:3px solid var(--ink);padding-bottom:clamp(8px,1.2vh,14px)}
.brand{font-family:var(--serif);font-size:clamp(26px,2.2vw,42px);font-weight:900;letter-spacing:.04em}
.brand em{color:var(--accent);font-style:normal}
.edition{font-size:clamp(11.5px,.76vw,13.5px);color:var(--ink-2);text-align:right;line-height:1.7}
.mast-nav{display:flex;gap:clamp(16px,1.6vw,32px);padding:clamp(8px,1.2vh,12px) 0;
  border-bottom:1px solid var(--rule);font-size:clamp(13px,.85vw,15px);align-items:center;flex-wrap:wrap}
.mast-nav a{color:var(--ink-2);transition:.2s}
.mast-nav a.on,.mast-nav a:hover{color:var(--ink);font-weight:700}
.mast-nav .search{margin-left:auto;color:var(--ink-3)}
.data-badge{font-size:clamp(10.5px,.68vw,12px);color:var(--ink-3);border:1px solid var(--rule);
  border-radius:99px;padding:2px 10px;white-space:nowrap}
.data-badge b{color:var(--accent);font-weight:700}

/* ---------- TopStrip 导读带（对应 HomeTopStrip） ---------- */
.topstrip{display:flex;gap:clamp(16px,1.8vw,36px);align-items:baseline;flex-wrap:wrap;
  padding:clamp(10px,1.5vh,16px) 0;border-bottom:1px solid var(--rule);margin-top:clamp(10px,1.6vh,18px)}
.topstrip .lead{font-family:var(--serif);font-weight:900;font-size:clamp(14px,1vw,18px)}
.topstrip .item{font-size:clamp(12px,.8vw,14px);color:var(--ink-2)}
.topstrip .item b{color:var(--accent);font-weight:800}
.topstrip .stamp{margin-left:auto;font-size:clamp(11px,.72vw,13px);color:var(--ink-3)}

/* ---------- 两栏：左栏趋势 rail + 右列 ---------- */
.two-col{display:grid;grid-template-columns:clamp(240px,19vw,340px) minmax(0,1fr);
  gap:clamp(24px,2.6vw,56px);margin-top:clamp(14px,2.2vh,26px);align-items:start}
.rail{position:sticky;top:clamp(12px,2vh,24px)}
.rail-head{border-top:3px solid var(--ink);padding-top:clamp(8px,1.2vh,14px);margin-bottom:clamp(8px,1.4vh,16px)}
.rail-head h3{font-family:var(--serif);font-size:clamp(17px,1.3vw,24px);font-weight:900}
.rail-head .sub{font-size:clamp(11px,.72vw,13px);color:var(--ink-3);margin-top:2px}
.rail-list .ri{display:grid;grid-template-columns:clamp(22px,1.8vw,32px) minmax(0,1fr);gap:clamp(8px,1vw,16px);
  align-items:baseline;padding:clamp(7px,1.1vh,12px) 0;border-bottom:1px solid var(--rule);cursor:pointer}
.rail-list .ri .no{font-family:var(--serif);font-weight:900;color:var(--ink-3);font-size:clamp(13px,1vw,17px)}
.rail-list .ri:nth-child(-n+3) .no{color:var(--accent)}
.rail-list .ri b{font-size:clamp(13px,.9vw,15.5px);font-weight:700;display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-list .ri span{font-size:clamp(10.5px,.7vw,12.5px);color:var(--ink-3)}
.rail-foot{margin-top:clamp(10px,1.6vh,18px);font-size:clamp(11px,.72vw,13px);color:var(--ink-3);line-height:1.7}

/* ---------- HeroBili 对开（banner + 侧卡网格 + 换一换） ---------- */
.hero{height:clamp(320px,46vh,540px);display:grid;
  grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(18px,1.8vw,36px)}
.hero-main{position:relative;overflow:hidden;border-radius:clamp(6px,.5vw,10px);background:#eceade}
.hero-main img{position:absolute;inset:0;transition:transform 6s}
.hero-main:hover img{transform:scale(1.025)}
.hero-main .veil{position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(12,12,14,.88))}
.hero-main .cap{position:absolute;left:0;right:0;bottom:0;padding:clamp(14px,2vh,26px);color:#fff}
.hero-main .cap .kick{font-size:clamp(10.5px,.68vw,12px);letter-spacing:.26em;color:#e8c9a0;font-weight:800;margin-bottom:6px}
.hero-main .cap h1{font-family:var(--serif);font-size:clamp(22px,3.4vh,42px);font-weight:900;line-height:1.2;margin-bottom:6px}
.hero-main .cap p{font-size:clamp(11.5px,.74vw,13px);opacity:.85;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero-side{display:flex;flex-direction:column;min-width:0}
.hero-cards{flex:1;display:grid;grid-template-columns:repeat(var(--side-n),minmax(0,1fr));
  grid-auto-rows:1fr;gap:clamp(10px,1vw,18px);min-height:0}
.hero-card{display:grid;grid-template-rows:1fr auto;overflow:hidden;cursor:pointer;min-height:0}
.hero-card .th{position:relative;overflow:hidden;border-radius:clamp(4px,.4vw,7px);background:#eceade}
.hero-card .th img{position:absolute;inset:0;transition:transform .5s}
.hero-card:hover .th img{transform:scale(1.05)}
.hero-card b{font-size:clamp(11.5px,.78vw,14px);font-weight:700;margin-top:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shuffle{margin-top:clamp(8px,1.2vh,14px);text-align:right;font-size:clamp(12px,.8vw,14px);
  color:var(--ink-2);cursor:pointer;font-weight:700}
.shuffle:hover{color:var(--accent)}
.shuffle::before{content:"⟳ ";font-weight:900}

/* ---------- 小节头 ---------- */
.sec{margin-top:clamp(24px,4vh,48px)}
.sec-head{display:flex;align-items:baseline;gap:clamp(12px,1.1vw,20px);
  border-bottom:1px solid var(--rule);padding-bottom:clamp(8px,1.2vh,14px);margin-bottom:clamp(14px,2vh,24px)}
.sec-head .no{font-family:var(--serif);font-size:clamp(22px,2vw,38px);font-weight:900;color:var(--accent);line-height:1}
.sec-head h2{font-family:var(--serif);font-size:clamp(20px,1.9vw,34px);font-weight:900}
.sec-head .sub{font-size:clamp(11.5px,.76vw,13.5px);color:var(--ink-3)}
.sec-head .more{margin-left:auto;font-size:clamp(12px,.8vw,14px);color:var(--ink-2)}
.sec-head .more:hover{color:var(--ink)}

/* ---------- 继续观看（对应 home-continue-row） ---------- */
.cont-grid{display:grid;grid-template-columns:repeat(var(--cont-n),minmax(0,1fr));gap:var(--gap)}
.cont-cell{cursor:pointer;min-width:0}
.cont-cell .th{aspect-ratio:16/9;overflow:hidden;border-radius:clamp(4px,.4vw,7px);position:relative;background:#eceade}
.cont-cell .th img{position:absolute;inset:0;transition:transform .5s}
.cont-cell:hover .th img{transform:scale(1.05)}
.cont-cell .th .time{position:absolute;right:7px;bottom:7px;font-size:clamp(10px,.66vw,11.5px);color:#fff;background:rgba(12,12,14,.6);padding:2px 7px;border-radius:4px}
.cont-cell .prog{height:2px;background:var(--rule);position:relative;margin-top:clamp(6px,.9vh,10px)}
.cont-cell .prog b{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.cont-cell h4{font-family:var(--serif);font-size:clamp(14px,.95vw,17px);font-weight:900;margin-top:clamp(6px,1vh,11px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cont-cell p{font-size:clamp(11.5px,.74vw,13px);color:var(--ink-3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 7 行横滚（对应 TMDBMovieRow，报刊小节化） ---------- */
.row-scroll{display:grid;grid-auto-flow:column;
  grid-auto-columns:calc((100% - (var(--poster-n) - 1)*var(--gap)) / var(--poster-n));gap:var(--gap);
  overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px;scrollbar-width:thin}
.row-scroll::-webkit-scrollbar{height:5px}
.row-scroll::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}
.row-scroll .p{scroll-snap-align:start;position:relative;aspect-ratio:2/3;overflow:hidden;
  border-radius:clamp(4px,.4vw,7px);cursor:pointer;background:#eceade}
.row-scroll .p img{position:absolute;inset:0;transition:transform .5s}
.row-scroll .p:hover img{transform:scale(1.05)}
.row-scroll .p .lab{position:absolute;left:0;right:0;bottom:0;padding:40px 11px 9px;color:#fff;
  background:linear-gradient(180deg,transparent,rgba(12,12,14,.85));opacity:0;transition:.3s}
.row-scroll .p:hover .lab{opacity:1}
.row-scroll .p .lab h4{font-size:clamp(12.5px,.88vw,15.5px);font-weight:700}
.row-scroll .p .lab p{font-size:clamp(10.5px,.68vw,12px);opacity:.75}
.row-scroll .p .sc{position:absolute;top:clamp(6px,.55vw,10px);right:clamp(6px,.55vw,10px);
  font-size:clamp(10.5px,.7vw,12px);font-weight:800;background:#fff;color:var(--ink);
  padding:2px 7px;border-radius:4px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 骨架 ---------- */
.skl{position:relative;overflow:hidden;background:#eceade}
.skl::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shimmer 1.4s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.skl-line{height:13px;border-radius:4px;margin-top:8px}

footer{margin:clamp(28px,5vh,56px) 0 clamp(22px,3vh,40px);padding-top:clamp(12px,1.6vh,20px);
  border-top:3px solid var(--ink);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;
  font-size:clamp(11.5px,.76vw,13.5px);color:var(--ink-3)}
</style>
<style id="xdev-css">
/* ==== 设备适配层：TV 10-foot / 投影仪 / 超宽（?device= 或真实视口触发） ==== */
html[data-device="tv"]{--poster-n:6;--cont-n:4;--side-n:2;--content-max:2200px}
html[data-device="tv"] body{zoom:1.5;padding:3.5vh 3.5vw!important;box-sizing:border-box}
html[data-device="tv"] :focus{outline:3px solid #d4a24e!important;outline-offset:3px;border-radius:4px}
html[data-device="beamer"]{--poster-n:7;--cont-n:5;--side-n:2}
html[data-device="beamer"] body{zoom:1.4}
html[data-device="beamer"][data-invert="1"] body{filter:invert(1) hue-rotate(180deg);background:#fff}
html[data-device="beamer"][data-invert="1"] img,html[data-device="beamer"][data-invert="1"] video{filter:invert(1) hue-rotate(180deg)}
@media (width>=2560px){:root{--content-max:2600px;--pad-x:120px;--poster-n:9;--cont-n:7;--side-n:3}}
@media (min-aspect-ratio:21/9){:root{--content-max:min(3000px,92vw);--pad-x:140px;--poster-n:10;--cont-n:8}}
.xdev-badge{position:fixed;right:14px;bottom:12px;z-index:99999;font:600 11px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.12em;color:#d4a24e;background:rgba(16,16,20,.82);border:1px solid rgba(212,162,78,.5);border-radius:999px;padding:6px 12px;pointer-events:none}
</style>
</head>
<body>
<div class="page">

  <header class="masthead">
    <div class="mast-row">
      <div class="brand">Kino<em>TV</em> 影视日报</div>
      <div class="edition" id="edition"></div>
    </div>
    <nav class="mast-nav">
      <a class="on" href="#">首页</a><a href="#">剧集</a><a href="#">电影</a><a href="#">综艺</a><a href="#">动漫</a><a href="#">榜单</a><a href="#">IPTV</a>
      <span class="data-badge" id="data-badge">真实接口拉取中…</span>
      <span class="search">搜索 ⌘K</span>
    </nav>
  </header>

  <!-- TopStrip 导读带（HomeTopStrip） -->
  <div class="topstrip">
    <span class="lead">本页导读</span>
    <span class="item">继续观看 <b id="ts-cont">—</b> 部</span>
    <span class="item">我的收藏 <b id="ts-fav">—</b> 部</span>
    <span class="item">今日更新 <b id="ts-new">—</b> 条</span>
    <span class="stamp" id="ts-stamp"></span>
  </div>

  <!-- 两栏：左栏今日趋势 rail + 右列 HeroBili 对开 -->
  <div class="two-col">
    <aside class="rail">
      <div class="rail-head"><h3>今日趋势</h3><div class="sub">分类热度榜 · 近 7 日真实收录</div></div>
      <div class="rail-list" id="rail-list"></div>
      <p class="rail-foot">热度值由收录热度推导，为演示口径；点击条目查看详情。</p>
    </aside>
    <div class="hero" id="hero"></div>
  </div>

  <!-- 继续观看 -->
  <section class="sec">
    <div class="sec-head">
      <span class="no">01</span><h2>继续观看</h2><span class="sub">真实片源 · 进度为演示值</span>
      <a class="more" href="#">全部记录 →</a>
    </div>
    <div class="cont-grid" id="cont-grid"></div>
  </section>

  <!-- 7 行横滚（与现有首页同行标题同顺序） -->
  <div id="rows"></div>

  <footer>
    <span>KinoTV — Demo E-V1 · 报刊版式 × 现有首页结构忠实版 · 标题/海报/简介来自内置 CMS 源（豆瓣 dbzy5 / 茅台 maotaizy）</span>
    <span>仅供风格评审</span>
  </footer>

</div>

<script>
/* ============ 数据层：与 E 基准同口径的 MacCMS 真实接口 ============ */
const SOURCES = [
  { name: "豆瓣资源", api: "https://caiji.dbzy5.com/api.php/provide/vod" },
  { name: "茅台资源", api: "https://caiji.maotaizy.cc/api.php/provide/vod" }
];
const TYPE_NAME = { 1: "电影", 2: "剧集", 3: "综艺", 4: "动漫" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const stripHtml = (s) => String(s ?? "").replace(/<[^>]*>/g, "").replace(/\s+/g, " ").trim();
const hash = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };

async function cms(api, params) {
  const url = api + "?" + new URLSearchParams(params).toString();
  const res = await fetch(url, { signal: AbortSignal.timeout(10000) });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const j = await res.json();
  if (j.code != null && j.code !== 1) throw new Error(j.msg || "CMS 业务异常");
  return j;
}
function mapItem(x, srcName) {
  return {
    id: x.vod_id, title: x.vod_name || "未命名", pic: x.vod_pic || "",
    type: TYPE_NAME[x.type_id_1 ?? x.type_id] || "影视", year: x.vod_year || "",
    remarks: x.vod_remarks || "", cls: (x.vod_class || "").split(",")[0] || "",
    score: parseFloat(x.vod_score) > 0 ? x.vod_score : null,
    content: stripHtml(x.vod_content), src: srcName
  };
}
async function fetchAll() {
  const jobs = [
    cms(SOURCES[0].api, { ac: "videolist", pg: 1, h: 168 }),
    cms(SOURCES[1].api, { ac: "videolist", pg: 1, h: 168 }),
    ...[1, 2].flatMap((t) => SOURCES.map((s) => cms(s.api, { ac: "videolist", t, pg: 1 })))
  ];
  const [latestDb, latestMt, movieDb, movieMt, tvDb, tvMt] = (await Promise.allSettled(jobs)).map((r) => r.status === "fulfilled" ? r.value.list ?? [] : []);
  const uniq = (arr) => { const s = new Set(); return arr.filter((x) => !s.has(x.title) && s.add(x.title)); };
  const latest = uniq([...latestDb, ...latestMt].map((x) => mapItem(x, x.vod_pic?.includes("dbzy") ? SOURCES[0].name : SOURCES[1].name)));
  const movies = uniq([...movieDb, ...movieMt].map((x) => mapItem(x, SOURCES[0].name)));
  const tvs = uniq([...tvDb, ...tvMt].map((x) => mapItem(x, SOURCES[1].name)));
  return { latest, movies, tvs };
}
/* 7 行数据映射（对应现有首页 7 个 TMDB 区块；CMS 池有限，用同池不同切片 + 轮转） */
const ROT = (arr, k) => arr.length ? [...arr.slice(k % arr.length), ...arr.slice(0, k % arr.length)] : arr;
function buildRows(D) {
  return [
    { title: "正在热映", sub: "院线在映", items: D.movies.slice(0, 14) },
    { title: "热门电影", sub: "按收录热度", items: ROT(D.movies, 5) },
    { title: "高分电影", sub: "评分优先", items: [...D.movies].sort((a, b) => (b.score || 0) - (a.score || 0)) },
    { title: "即将上映", sub: "新片预告", items: ROT(D.movies, 9) },
    { title: "热门剧集", sub: "按收录热度", items: D.tvs.slice(0, 14) },
    { title: "高分剧集", sub: "评分优先", items: [...D.tvs].sort((a, b) => (b.score || 0) - (a.score || 0)) },
    { title: "今日播出", sub: "近 24h 更新", items: D.latest.slice(0, 14) }
  ];
}

/* ============ 渲染 ============ */
let DATA = null, ROWS = [], heroIdx = 0;

function renderSkeletons() {
  $("rail-list").innerHTML = Array(6).fill(0).map(() =>
    `<div class="ri"><span class="skl skl-line" style="width:20px;margin:0"></span><span class="skl skl-line" style="margin:0"></span></div>`).join("");
  $("hero").innerHTML = `
    <div class="hero-main"><div class="skl" style="position:absolute;inset:0"></div></div>
    <div class="hero-side"><div class="hero-cards">${Array(4).fill(0).map(() => `<div class="hero-card"><div class="th skl"></div></div>`).join("")}</div></div>`;
  $("cont-grid").innerHTML = Array(4).fill(0).map(() =>
    `<div class="cont-cell"><div class="th skl"></div><div class="skl skl-line" style="width:60%"></div></div>`).join("");
  renderRowsSkeleton();
}
function renderRowsSkeleton() {
  $("rows").innerHTML = Array(3).fill(0).map((_, i) => `
    <section class="sec"><div class="sec-head"><span class="skl skl-line" style="width:34px;margin:0"></span>
      <span class="skl skl-line" style="width:120px;margin:0"></span></div>
      <div class="row-scroll">${Array(6).fill(0).map(() => `<div class="p skl"></div>`).join("")}</div>
    </section>`).join("");
}

function renderMasthead(ok) {
  const d = new Date();
  const week = Math.ceil(((d - new Date(d.getFullYear(), 0, 1)) / 864e5 + 1) / 7);
  const wc = "日一二三四五六"[d.getDay()];
  $("edition").innerHTML = `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日 · 星期${wc}<br>第 ${week} 周 · 总第 1,204 期`;
  $("ts-stamp").textContent = `更新于 ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")} · 编号 01–07 对应首页七行`;
  $("data-badge").innerHTML = ok
    ? `真实数据 · <b>${esc(SOURCES.map((s) => s.name).join("/"))}</b>`
    : `离线演示数据（接口不可达）`;
}

function renderTopStrip(D) {
  $("ts-cont").textContent = Math.min(6, D.latest.length - 1);
  $("ts-fav").textContent = 3 + (hash(String(new Date().toDateString())) % 9);
  $("ts-new").textContent = D.latest.length;
}

/* 左栏趋势 rail（对应 CategoryHeatRow variant=rail） */
function renderRail(items) {
  $("rail-list").innerHTML = items.slice(0, 8).map((t, i) => {
    const heat = (98.4 - i * 2.1 - (hash(t.title) % 10) / 10).toFixed(1);
    return `<div class="ri"><span class="no">${String(i + 1).padStart(2, "0")}</span>
      <div><b>${esc(t.title)}</b><span>${esc(t.cls || t.type)} · 热度 ${heat}</span></div></div>`;
  }).join("");
}

/* HeroBili 对开：banner = trending[heroIdx]，侧卡 = 其后 side-n×2 张，换一换轮转 */
function heroPick() {
  const pool = DATA.latest;
  const sideN = +(getComputedStyle(document.documentElement).getPropertyValue("--side-n").trim() || 2);
  const main = pool[heroIdx % pool.length];
  const side = Array.from({ length: sideN * 2 }, (_, i) => pool[(heroIdx + 1 + i) % pool.length]);
  return { main, side };
}
function renderHero() {
  const { main, side } = heroPick();
  $("hero").innerHTML = `
    <a class="hero-main"><img src="${esc(main.pic)}" alt="${esc(main.title)}" loading="eager" onerror="this.remove()">
      <div class="veil"></div>
      <div class="cap"><div class="kick">今日头条 · ${esc(main.src)} 收录</div>
        <h1>${esc(main.title)}</h1><p>${esc(main.content || `${main.cls || main.type} · ${main.year} · ${main.remarks || "正片"}`)}</p></div>
    </a>
    <div class="hero-side">
      <div class="hero-cards">${side.map((s) => `
        <a class="hero-card"><div class="th"><img src="${esc(s.pic)}" alt="${esc(s.title)}" loading="lazy" onerror="this.parentElement.classList.add('skl');this.remove()"></div>
          <b>${esc(s.title)}</b></a>`).join("")}</div>
      <a class="shuffle" id="shuffle">换一换</a>
    </div>`;
  $("shuffle").addEventListener("click", () => { heroIdx += 1 + Math.floor(hash(String(heroIdx)) % 3); renderHero(); });
}

function renderContinue(items) {
  $("cont-grid").innerHTML = items.slice(1, 7).map((c) => {
    const prog = 20 + (hash(c.title) % 70);
    return `<div class="cont-cell">
      <div class="th"><img src="${esc(c.pic)}" alt="${esc(c.title)}" loading="lazy" onerror="this.parentElement.classList.add('skl');this.remove()">
        <span class="time">${esc(c.remarks || c.cls || c.type)}</span></div>
      <div class="prog"><b style="width:${prog}%"></b></div>
      <h4>${esc(c.title)}</h4><p>${esc(c.cls || c.type)} · ${esc(c.year)} · ${esc(c.src)}</p></div>`;
  }).join("");
}

function renderRows() {
  $("rows").innerHTML = ROWS.map((r, i) => `
    <section class="sec">
      <div class="sec-head"><span class="no">${String(i + 2).padStart(2, "0")}</span><h2>${esc(r.title)}</h2>
        <span class="sub">${esc(r.sub)} · 真实片库</span><a class="more" href="#">更多 →</a></div>
      <div class="row-scroll">${r.items.slice(0, 12).map((it) => `
        <div class="p"><img src="${esc(it.pic)}" alt="${esc(it.title)}" loading="lazy" onerror="this.parentElement.classList.add('skl');this.remove()">
          <span class="sc">${esc(it.remarks || it.score || it.year)}</span>
          <div class="lab"><h4>${esc(it.title)}</h4><p>${esc(it.cls || it.type)} · ${esc(it.year)}</p></div>
        </div>`).join("")}</div>
    </section>`).join("");
}

/* 离线兜底 */
function useFallback() {
  const mk = (n, t) => Array.from({ length: n }, (_, i) => ({
    title: t + " " + (i + 1), pic: "", type: "剧集", year: "2026",
    remarks: "更新至第 " + (i + 3) + " 集", cls: "演示", score: null, src: "离线", content: ""
  }));
  DATA = { latest: mk(12, "演示条目"), movies: mk(12, "演示电影"), tvs: mk(12, "演示剧集") };
}

(async () => {
  renderSkeletons();
  try {
    DATA = await fetchAll();
    if (!DATA.latest.length) throw new Error("empty");
    renderMasthead(true);
  } catch (e) {
    useFallback();
    renderMasthead(false);
  }
  ROWS = buildRows(DATA);
  renderTopStrip(DATA);
  renderRail(DATA.latest);
  renderHero();
  renderContinue(DATA.latest);
  renderRows();
})();
</script>
<script id="xdev-js">
(function(){
  var d=new URLSearchParams(location.search).get("device");
  if(!d)return;
  document.documentElement.setAttribute("data-device",d);
  var b=document.createElement("div");
  b.className="xdev-badge";
  b.textContent=d==="tv"?"TV · 10-FOOT MODE":d==="beamer"?"PROJECTOR MODE":"";
  if(b.textContent)document.body.appendChild(b);
  if(d==="beamer"){
    addEventListener("load",function(){setTimeout(function(){
      var lum=function(a){if(!a)return 1;var m=a.match(/[\d.]+/g);if(!m||m.length<3)return 1;if(m.length>3&&+m[3]===0)return 1;return .2126*(+m[0]/255)+.7152*(+m[1]/255)+.0722*(+m[2]/255)};
      var lv=lum(getComputedStyle(document.body).backgroundColor);
      if(lv>=1)lv=lum(getComputedStyle(document.documentElement).backgroundColor);
      if(lv>.5)document.documentElement.setAttribute("data-invert","1");
    },300)});
  }
})();
</script>
</body>
