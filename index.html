<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/src/assets/icon/KinoTV.webp" />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <!-- viewport（2026-09-15 修订）：
         · 加 viewport-fit=cover —— 否则 env(safe-area-inset-*) 在 iOS / 刘海屏恒为 0，
           全站已有的安全区规则（TabBar / Drawer / 播放器 / BottomSheet）名存实亡；
         · 移除 maximum-scale / minimum-scale / user-scalable=no —— 三者共同禁止用户缩放，
           违反 WCAG 1.4.4（文本可放大至 200%）。合规替代是本项目已有的应用内 uiScale 手动档
           （设置页「界面缩放」），用户仍可整体放大界面。
         ⚠️ 连带效应：cover 生效后下列 env() 从 0 变为真实值，需确认未与父容器 padding 叠加
           （已核对）：BottomSheet.tsx:103 + Drawer.css:85 + UniversalPlayer.css:1530/1539/2757-2821。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1890ff" />
    <title>kinoTv</title>
    <!--@layout-tokens-->
    <style>
      /* 启动骨架（2026-09-11 建立；2026-09-15 升级为「按路由分支」）：
         HTML 一到浏览器就可见，消除「JS 请求/解析期间纯白屏」。

         为什么按路由分支：全站只有这一份 index.html（Vite 单入口 + SPA fallback，
         任意路径都返回它），静态 DOM 无法按路由拆分 —— 于是「刷新 /collections 也看到
         首页同构骨架」，再被目标页自身骨架替换，形成结构错构跳变。现在由下方内联脚本
         读 location 判定页型，就地换成本页同构的骨架：
           首页 TopStrip+左趋势榜栏+HeroBili 融合卡（banner+右卡网格+换一换）+海报行
             （左栏与右卡仅 ≥1024 非 TV，与 .home-two-col / HeroBili 启用条件同构）/
           IPTV·Browse·收藏·历史 左栏+筛选条+网格（左栏仅 ≥1024，与真实页
             RecordShell / Browse grid 同构；Browse 左栏 = FilterBar 筛选组「label + 2 列 chips + 组间分割线」，
             非频道列表条，2026-09-21 用户反馈修正）/ Chart 标签条+榜单行（--chart-cols 单真源，桌面 2 列）/
           Detail hero（含真实页同款 max-height 曲线）+右侧信息栏+tabs+内容卡（镜像 DetailSkeleton）/ Person hero+文本行 /
           播放页 16:9 黑场+右侧面板列（面板总高与播放器等高，镜像 .player-sidebar 比例分配）/ 其余路由 顶栏+提示（垂直居中）；
           /iptv/play 无顶栏（真实页是全屏播放器，不走 AppLayout）。
           静态默认（无 JS / 内联脚本失败的降级态）是**中性形态**（仅顶栏+提示）：
           home 形态也由脚本构建 —— 保证任何降级场景下非首页路由都不会
           漏出首页轮廓（2026-09-20 用户要求；此前静态默认写死 home 形态，
           SKEL-017 曾在 commit 时刻读到它，证明该窗口真实可观测）。

         硬约束（勿改）：
         1. 颜色零依赖 —— 此刻 bundle CSS（index.css）与 JS 都还没加载，故颜色硬编码
            对齐 variables.css（布局 token 例外：已由上方注入的 layout-tokens.css 提供，
            骨架可直读 var(--card-cols) 等，见约束 2）。浅色 bg #f5f5f5 / surface #fff /
            border #e8e8e8(=--color-border-light) / skeleton #f0f0f0；深色 bg #141414 /
            surface #1f1f1f / border #2b2b2b / skeleton #2a2a2a。
            ⚠️ 骨架填充色与描边色分开维护：填充对齐页面骨架 shimmer 的亮端
            （浅色 --color-placeholder-shimmer-a #f0f0f0；深色取深色 shimmer
            #1f1f1f↔#303030 的中值 #2a2a2a），描边恒 #e8e8e8 / #2b2b2b。
            两者曾经共用 #e8e8e8，导致启动骨架比页面骨架明显偏深（#f0f0f0 ↔ #e6e6e6
            扫光），交接时出现一次「由深变浅」的跳变。
         2. 列数 / 栏宽单真源 = layout-tokens.css（2026-09-21 收敛，注入到上方 <style>）：
            骨架网格一律读 var(--card-cols / --iptv-cols / --iptv-page-cols / --history-cols)，
            左栏读 var(--rail-w / --home-rail-w) —— 与真实页同一份 token、同一套断点/设备
            判定，任意视口恒同构。⚠️ 勿再在骨架里手抄断点阶梯或 JS 镜像表（colCount 旧疾，
            第二真源必然漂移；约定见 useGridCols.ts）。改列数/栏宽只改 layout-tokens.css。
            设备档由脚本写 <html> 的 data-device（tv/app/''，与 AppLayout 同值）触发 token 覆盖；
            data-cols 仅供骨架结构选择器（home/detail 两栏、heroBili 宽屏）使用，不再决定列数。
            mobile-web 与 web 同走视口阶梯（token 只做 not([data-device="app"]) 门控），无需单列。
         3. pointer-events:none 保证即使移除失败也不拦点击（防 E2E 误判遮挡）。
         4. 尺寸用 vh / % / rem 或注入的布局 token（--card-cols / --rail-w 等）；不用 100dvh
            （App 内会溢出），不引 bundle 才有的 token（颜色/间距等仍硬编码）。
         5. 只做「轮廓级同构」：区块数量/方位/卡片比例对齐，不追逐像素 —— 真源仍是
            各页自己的骨架组件（Browse/Collections/IPTV/Person/Detail 的 *Skeleton）。
            新增路由页型时，同步在此补一条 shape 与构建分支。 */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: #f5f5f5;
        color: #999;
        font: 400 13px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        pointer-events: none;
        user-select: none;
      }

      /* 顶栏骨架 */
      .bs-header {
        display: flex;
        flex-shrink: 0;
        gap: 16px;
        align-items: center;
        height: 60px;
        padding: 0 16px;
        background: #fff;
        border-bottom: 1px solid #e8e8e8;
      }
      .bs-logo {
        flex-shrink: 0;
        width: 32px;
        height: 32px;
        overflow: hidden;
        background: #f0f0f0;
        border-radius: 8px;
      }
      .bs-logo img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .bs-nav { display: flex; gap: 12px; align-items: center; margin-left: auto; }
      .bs-nav i { display: block; width: 3.5rem; height: 0.75rem; background: #f0f0f0; border-radius: 6px; }
      .bs-nav i:first-child { width: 9rem; }

      /* 内容骨架。flex:1 + min-height:0 —— 撑满顶栏以下的剩余视口高（2026-09-20
         用户反馈「内容未撑满容器高度」）：填充行溢出由 overflow:hidden 裁剪。 */
      .bs-body { display: flex; flex: 1 1 auto; flex-direction: column; gap: 16px; min-height: 0; padding: 16px; }
      /* 内容盒对齐（2026-09-22 全站三态实测审计，非仅 home）：镜像 .page-padding 的
         --page-pad-x 分档（≥768 起 ≈14.333px（space-lg clamp 顶）/ 60 / 100 / 140）与
         主流页内容 2200 封顶居中。旧固定 16px 不封顶 → 各页主列宽普遍比真实页宽
         30–250px，React 挂载瞬间横缩抖动。play 形态（全屏播放器，不走 AppLayout）除外。
         ui-scale 自动档骨架读不到（bundle token），残余偏差为已知取舍。 */
      @media (width >= 768px) {
        #boot-splash:not([data-shape="play"]) .bs-body { padding-inline: 14.333px; }
      }
      @media (width >= 1440px) {
        #boot-splash:not([data-shape="play"]) .bs-body { padding-inline: 60px; }
      }
      @media (width >= 1920px) {
        #boot-splash:not([data-shape="play"]) .bs-body { padding-inline: 100px; }
      }
      @media (width >= 2560px) {
        #boot-splash:not([data-shape="play"]) .bs-body { padding-inline: 140px; }
      }
      #boot-splash:not([data-shape="play"]) .bs-body > * {
        width: 100%;
        max-width: 2200px;
        margin-inline: auto;
        /* 块高防压（2026-09-22 实测）：bs-body 是 flex column，内容超视口时默认
           shrink 会等比压扁各块（person hero 17rem 实测被压到 171px）——骨架宁多不缺，
           溢出由 overflow:hidden 裁剪，块高必须自洽 */
        flex-shrink: 0;
      }
      .bs-hero { width: 100%; aspect-ratio: 16 / 9; max-height: 42vh; background: #f0f0f0; border-radius: 12px; }

      /* 卡片网格：--poster 竖版海报 2:3（读 --card-cols）/ --channel 频道 3:2（--iptv-cols）/
         --record 记录卡 16:9（--history-cols）/ --iptvpage IPTV 页频道 3:2（--iptv-page-cols）/
         --chart 榜单行块（--chart-cols，2026-09-21 迁入单真源：桌面 2 / ≤1023 与 App 单列）。
         列数一律读注入的 layout-tokens.css token（见约束 2），勿在此手写阶梯。
         ⚠️ 勿把 .bs-row 当某档复用 —— 元素同时带 bs-row + bs-row--xxx 两个类，写 .bs-row
         的列数会串到其它网格。 */
      .bs-row { display: grid; gap: 12px; }
      /* 列数单真源 = 注入的 layout-tokens.css（见 head 的 <!--@layout-tokens-->），此处只读 var()，
         不再自带断点阶梯 / 设备档。fallback = 移动基础档，仅在注入 style 缺失的极端降级下生效。 */
      .bs-row--poster { grid-template-columns: repeat(var(--card-cols, 3), 1fr); }
      .bs-row--channel { grid-template-columns: repeat(var(--iptv-cols, 2), 1fr); }
      .bs-row--iptvpage { grid-template-columns: repeat(var(--iptv-page-cols, 2), 1fr); }
      .bs-row--record { grid-template-columns: repeat(var(--history-cols, 1), 1fr); }
      .bs-row--chart { grid-template-columns: repeat(var(--chart-cols, 1), minmax(0, 1fr)); gap: 5px; }
      /* 榜单行块（2026-09-22 实测修正）：镜像 .chart-list__skeleton 行卡几何 ——
         行高 桌面 ≈17.5rem×13.2 基 ≈ 231px / 移动 ≈213px，内含 16:9 缩略图槽 + 两行文本；
         旧单块 3.5rem 与真实差 5 倍，数据到达时榜单区高度跳变一整屏 */
      .bs-chartitem { display: flex; gap: 10px; align-items: center; height: 17.5rem; padding: 12px; background: #f0f0f0; border-radius: 12px; }
      @media (width <= 767px) { .bs-chartitem { height: 16.1rem; } }
      .bs-chartitem__img { flex: 0 0 12.1rem; aspect-ratio: 16 / 9; background: #e4e4e4; border-radius: 8px; }
      .bs-chartitem__lines { display: flex; flex: 1 1 auto; flex-direction: column; gap: 6px; min-width: 0; }
      .bs-chartitem__lines i { display: block; height: 0.9rem; background: #e4e4e4; border-radius: 4px; }
      .bs-chartitem__lines i:last-child { width: 45%; }
      /* person 形态（2026-09-22 实测新增）：hero 对齐 PersonSkeleton 同档高
         （桌面 17rem≈224 有图档近似；移动真实内容驱动 ≈293px=21.2rem）；
         作品网格读 --person-work-cols（与真实/页骨架三方同源） */
      .bs-person-hero { width: 100%; height: 17rem; background: #f0f0f0; border-radius: 12px; }
      @media (width <= 767px) { .bs-person-hero { height: 21.2rem; } }
      .bs-row--work { grid-template-columns: repeat(var(--person-work-cols, 4), minmax(0, 1fr)); }
      .bs-card { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
      .bs-cover, .bs-line { display: block; background: #f0f0f0; border-radius: 8px; }
      .bs-cover { aspect-ratio: 2 / 3; }
      .bs-line { width: 76%; height: 0.75rem; border-radius: 6px; }
      .bs-line--short { width: 52%; }
      .bs-row--channel .bs-cover { aspect-ratio: 3 / 2; }
      .bs-row--record .bs-cover { aspect-ratio: 16 / 9; }
      .bs-row--iptvpage .bs-cover { aspect-ratio: 3 / 2; }

      /* 筛选条（Browse 结果条 / 收藏·历史顶部筛选卡 / IPTV 计数条） */
      .bs-filter {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 12px 16px;
        background: #fff;
        border: 1px solid #e8e8e8;
        border-radius: 12px;
      }
      .bs-chip { display: block; width: 3.5rem; height: 1.5rem; background: #f0f0f0; border-radius: 999px; }
      .bs-chip--wide { width: 7rem; }
      .bs-chip--end { margin-left: auto; width: 5.5rem; }

      /* 分区头 / 榜单行 / 文本行 */
      .bs-sec { display: block; width: 4.5rem; height: 1rem; background: #f0f0f0; border-radius: 6px; }
      .bs-list { display: flex; flex-direction: column; gap: 12px; }
      .bs-list i { display: block; height: 3.5rem; background: #f0f0f0; border-radius: 8px; }
      .bs-lines { display: flex; flex-direction: column; gap: 10px; }
      .bs-lines i { display: block; height: 1rem; background: #f0f0f0; border-radius: 6px; }
      .bs-lines i:nth-child(1) { width: 14rem; height: 1.75rem; }
      .bs-lines i:nth-child(2) { width: 9rem; }
      .bs-lines i:nth-child(3) { width: 100%; }
      .bs-lines i:nth-child(4) { width: 68%; }

      /* 左栏（IPTV 频道分类）：<1024 不显示，与真实页「移动端换成顶部筛选卡」同构 */
      .bs-split { display: flex; flex-direction: column; gap: 16px; }
      .bs-rail { display: none; }
      .bs-split__main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
      /* Browse 左栏筛选组（镜像真实 FilterBar rail 化，2026-09-21 用户反馈修正）：
         每组 = 组标题小字 + 固定 2 列 chips（2026-09-14 拍板恒两列），组间 1px 分割线 */
      .bs-fgroup { display: flex; flex-direction: column; gap: 6px; }
      .bs-fgroup + .bs-fgroup { margin-top: 6px; padding-top: 10px; border-top: 1px solid #e8e8e8; }
      .bs-fgroup__chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 8px; }

      /* 提示绝对定位钉在视口底：内容按视口填满后仍可见（若留在文档流，
         填满后的溢出会把提示推出 overflow:hidden 的裁剪区） */
      .bs-tip {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 4px 0 20px;
        text-align: center;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      /* 中性形态（plain，脚本挂类）：提示在视口内真垂直居中（2026-09-20 用户要求）。
         top+bottom+margin:auto 居中有内容时会被顶栏/内容压住，故只在空 body 的
         plain 档启用，不串到其它形态。 */
      #boot-splash[data-shape="plain"] .bs-tip {
        top: 0;
        height: max-content;
        margin: auto;
      }

      @keyframes boot-pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }

      /* 列数断点阶梯 + 设备档覆盖已全部删除：改由注入的 layout-tokens.css 单真源驱动
         （上方 .bs-row--* 读 var(--card-cols) 等，设备档由脚本写 <html> 的 data-device 触发
         token 的 TV/App 覆盖）。旧手抄 @media 阶梯 + data-cols 覆盖是第二真源，与真实网格
         必然漂移；删除后骨架列数恒与真实页一致（同一份 token、同一视口/设备判定）。 */

      /* IPTV 左栏：≥1024 才出现（与 .iptv-skeleton--rail 同构）。
         ⚠️ 选择器必须带 .bs-split 前缀：home 形态的左栏（.bs-home .bs-rail）
         阈值/宽度/描边都不同源，裸 .bs-rail 会串档。 */
      @media (width >= 1024px) {
        .bs-split { flex: 1 1 auto; flex-direction: row; gap: 24px; align-items: flex-start; min-height: 0; }
        .bs-split .bs-rail {
          display: flex;
          flex: 0 0 var(--rail-w, clamp(148px, 10vw, 248px));
          flex-direction: column;
          gap: 6px;
          padding-right: 8px;
          border-right: 1px solid #e8e8e8;
        }
        .bs-split__main { display: flex; flex: 1 1 auto; flex-direction: column; gap: 16px; min-width: 0; min-height: 0; }
        .bs-split .bs-rail i { display: block; height: 1.75rem; background: #f0f0f0; border-radius: 6px; }
        .bs-split .bs-rail i.bs-rail__title { width: 4rem; height: 0.875rem; margin-bottom: 6px; }
        /* Browse 筛选组尺寸（需带 .bs-split .bs-rail 前缀压过上方裸 i 规则 0,2,1） */
        .bs-split .bs-rail .bs-fgroup__label { width: 2.5rem; height: 0.75rem; border-radius: 4px; }
        .bs-split .bs-rail .bs-fgroup__chips i { height: 1.5rem; border-radius: 999px; }
        html[data-theme="dark"] .bs-split .bs-rail { border-right-color: #2b2b2b; }
        html[data-theme="dark"] .bs-fgroup + .bs-fgroup { border-top-color: #2b2b2b; }
      }

      /* 首页（2026-09-20 二次重构，用户要求与真实宽屏首页同构）：
         镜像 Home/index.tsx 宽屏分支 —— TopStrip → .home-two-col（左榜栏 + 右主列），
         右主列 = HeroBili 融合卡（banner + 右卡网格 + 换一换）+ 海报行。
         栏宽镜像 --home-rail-w 真源：240（1024–1919）/ 260（≥1920，此前误写 ≥2560）。
         <1024 / TV：回单列经典 hero（与 HeroBannerClassic 同构），榜栏隐藏。 */
      .bs-home { display: flex; flex: 1 1 auto; flex-direction: column; gap: 14.333px; min-height: 0; }
      /* 过渡带：镜像真实 .home-topstrip 卡片壳（surface + border + radius + 同 padding），
         此前只有三根裸条 → 高度差 10px，B→C 纵向抖动 */
      .bs-home__strip { display: flex; gap: 8px; align-items: center; padding: 5px 7px; background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; }
      .bs-home__strip i { display: block; width: 7rem; height: 1.5rem; background: #f0f0f0; border-radius: 999px; }
      .bs-home__strip i:first-child { width: 10rem; }
      .bs-home__cols { display: flex; flex: 1 1 auto; flex-direction: column; gap: 14.333px; min-height: 0; }
      .bs-home .bs-rail { display: none; }
      .bs-home__main { display: flex; flex: 1 1 auto; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; }

      /* 左栏：今日趋势榜卡（镜像 .cqa-trend rail 变体：卡壳 + 标题 + 海报行列表） */
      .bs-home__railcard { display: flex; flex-direction: column; gap: 10px; padding: 12px; background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; }
      /* 左栏榜行：海报镜像真实 --cqa-poster-w/h 64×96（≥1920 → 72×108，Home.css 同源）；
         旧 40×60 行高差 44px，左栏密度与真实页不一致 */
      .bs-heat { display: flex; gap: 8px; align-items: center; padding: 4px 0; }
      .bs-heat__poster { flex: 0 0 64px; aspect-ratio: 2 / 3; background: #f0f0f0; border-radius: 6px; }
      @media (width >= 1920px) { #boot-splash .bs-heat__poster { flex-basis: 72px; } }
      .bs-heat__text { display: flex; flex: 1 1 auto; flex-direction: column; gap: 6px; min-width: 0; }
      .bs-heat__text i { display: block; height: 0.75rem; background: #f0f0f0; border-radius: 6px; }
      .bs-heat__text i:last-child { width: 55%; }

      /* 「继续观看」行占位（2026-09-22 审计补）：真实页首屏恒有此行
         （userDataLoading || continueItems 非空时渲染），旧骨架漏掉 → React 挂载时
         凭空多出一整行（≈200–320px）纵向抖动。轮廓级镜像 .home-continue-row：

         固定 PLAIN_MS 后才按当前 location 换成本页同构骨架（含 home）并挂 data-shape-ready——
         换形是就地重建 body，plain 与同构永不叠层（用户 2026-09-22 硬要求：「绝对不是覆盖」）。

        var body = document.getElementById('bs-body');
        var tip = document.getElementById('bs-tip');

        if (location.hash.charAt(0) === '#' && location.hash.charAt(1) === '/') {

           多次发生「骨架列数与真实网格差一档」；useGridCols.ts 约定：列数真源只读 CSS token）。
           现 getComputedStyle 读 --card-cols 等的当前计算值，与真实页网格同源（同一份
           layout-tokens.css 驱动）。用于「填充卡数 = 列数整数倍」（否则首/末行留空槽）。
           必须在 data-device 写入（上方）之后调用，计算值才含设备档。 */
        var __cs = getComputedStyle(document.documentElement);
        function __tokInt(name, fb) { var n = parseInt(__cs.getPropertyValue(name), 10); return n > 0 ? n : fb; }
        var COLS = {
          poster: __tokInt('--card-cols', 3),
          channel: __tokInt('--iptv-cols', 2),
          record: __tokInt('--history-cols', 1),
          iptvpage: __tokInt('--iptv-page-cols', 2),
          chart: __tokInt('--chart-cols', 1),
          work: __tokInt('--person-work-cols', 4),
        };
        function colCount(kind) { return COLS[kind] || 3; }
        /* 满行网格：卡数向上取整到列数整数倍 */
        function fullGrid(kind, minRows) {
          var c = colCount(kind);
          return grid(kind, c * Math.max(1, Math.ceil(minRows)));
        }
        function filterBar() {
          var bar = el('bs-filter', 'div');
          bar.appendChild(el('bs-chip bs-chip--wide'));
          for (var i = 0; i < 4; i++) bar.appendChild(el('bs-chip'));
          bar.appendChild(el('bs-chip bs-chip--end'));
          return bar;
        }
        function rail() {
          var aside = el('bs-rail', 'div');
          aside.appendChild(el('bs-rail__title'));
          for (var i = 0; i < 9; i++) aside.appendChild(el(''));
          return aside;
        }
        /* Browse 专属左栏（2026-09-21 用户反馈修正）：真实页 ≥1024 左栏是 FilterBar
           rail 化的筛选组（类型/分类/地区/年份，每组 label + 2 列 chips，组间分割线），
           不是 IPTV 那种频道列表条 —— 旧的通用 rail() 用在这里属结构错构。
           组数/顺序镜像 FilterBar.tsx；chips 数为轮廓级近似（真实随数据变），
           取偶数保证 2 列满行。 */
        function filterRail() {
          var aside = el('bs-rail', 'div');
          var counts = [6, 8, 6, 8];
          for (var g = 0; g < counts.length; g++) {
            var group = el('bs-fgroup', 'div');
            group.appendChild(el('bs-fgroup__label'));
            var chips = el('bs-fgroup__chips', 'div');
            for (var i = 0; i < counts[g]; i++) chips.appendChild(el(''));
            group.appendChild(chips);
            aside.appendChild(group);
          }
          return aside;
        }
        function listRows(count) {
          var list = el('bs-list', 'div');
          for (var i = 0; i < count; i++) list.appendChild(el(''));
          return list;
        }
        /* 榜单行网格（chart 专用）：行卡镜像 .chart-list__skeleton（16:9 图槽 + 两行文本，
           行高由 CSS .bs-chartitem 控制），区别于旧单灰块（与真实差 5 倍高）；
           铺在 --chart-cols 列网格里与真实 .chart-list 同构 */
        function chartRows(count) {
          var row = el('bs-row bs-row--chart', 'div');
          for (var i = 0; i < count; i++) {
            var item = el('bs-chartitem', 'div');
            item.appendChild(el('bs-chartitem__img'));
            var linesBox = el('bs-chartitem__lines', 'div');
            linesBox.appendChild(el(''));
            linesBox.appendChild(el(''));
            item.appendChild(linesBox);
            row.appendChild(item);
          }
          return row;
        }
        function lines(count) {
          var box = el('bs-lines', 'div');
          for (var i = 0; i < count; i++) box.appendChild(el(''));
          return box;
        }
        function hero() { return el('bs-hero', 'div'); }
        /* 首页左栏：今日趋势榜卡（标题 + 海报行列表，行数镜像真实栏 TOP 20——
           「已知常量不当未知」2026-09-21：旧 8 行在 1920×1080 下填不满视口；
           真实榜 20 行总高本就超出首屏，骨架同观感，溢出由 overflow 裁剪） */
        function heatRail() {
          var card = el('bs-home__railcard', 'div');
          card.appendChild(el('bs-sec'));
          for (var i = 0; i < 20; i++) card.appendChild(heatItem());
          return card;
        }
        function heatItem() {
          var item = el('bs-heat', 'div');
          item.appendChild(el('bs-heat__poster', 'div'));
          var text = el('bs-heat__text', 'div');
          text.appendChild(el(''));
          text.appendChild(el(''));
          item.appendChild(text);
          return item;
        }
        /* 继续观看行（镜像 .home-continue-row，CSS 见上方 .bs-cont 块） */
        function contRow() {
          var wrap = el('bs-cont', 'div');
          wrap.appendChild(el('bs-cont__head'));
          var cards = el('bs-cont__cards', 'div');
          for (var i = 0; i < 5; i++) {
            var c = el('bs-contcard', 'div');
            c.appendChild(el('bs-contcard__cover'));
            c.appendChild(el('bs-contcard__bar'));
            c.appendChild(el('bs-contcard__bar bs-contcard__bar--sm'));
            cards.appendChild(c);
          }
          wrap.appendChild(cards);
          return wrap;
        }
        /* HeroBili 融合卡：banner（提示居中区）+ 右卡网格（列数×2 行，
           useHeroSideCols 同源断点：1024–1280 → 2 列，≥1281 → 3 列）+ 换一换竖条 */
        function heroBili(wide) {
          var card = el('bs-herobili', 'div');
          var gridBox = el('bs-herobili__grid', 'div');
          gridBox.appendChild(el('bs-herobili__banner', 'div'));
          if (wide) {
            var right = el('bs-herobili__right', 'div');
            var cards = el('bs-herocards', 'div');
            var cols = window.matchMedia('(min-width: 1281px)').matches ? 3 : 2;
            for (var i = 0; i < cols * 2; i++) {
              var c = el('bs-herocard', 'div');
              c.appendChild(el('bs-herocard__cover'));
              c.appendChild(el('bs-herocard__title'));
              cards.appendChild(c);
            }
            right.appendChild(cards);
            var shuffle = el('bs-shuffle', 'div');
            shuffle.appendChild(el(''));
            shuffle.appendChild(el(''));
            right.appendChild(shuffle);
            gridBox.appendChild(right);
          }
          card.appendChild(gridBox);
          return card;
        }
        /* 通用左栏+主列包裹（collections / history / iptv 走默认频道式 rail；
           browse 传入 filterRail）：<1024 CSS 自动堆叠，榜栏隐藏 */
        function withRail(mainBlocks, railNode) {
          var split = el('bs-split', 'div');
          split.appendChild(railNode || rail());
          var main = el('bs-split__main', 'div');
          for (var i = 0; i < mainBlocks.length; i++) main.appendChild(mainBlocks[i]);
          split.appendChild(main);
          return split;
        }
        /* Detail 顶部：hero 16:9 + 右侧 chips/信息网格（镜像 DetailSkeleton：
           chips 4 / 信息卡 8 / 尾行 2；≥1024 非 app/tv 两栏 1.4fr/1fr 由 CSS 接管） */
        function detailTop() {
          var top = el('bs-detail__top', 'div');
          top.appendChild(el('bs-detail__hero', 'div'));
          var side = el('bs-detail__side', 'div');
          side.appendChild(sec());
          var chips = el('bs-detail__chips', 'div');
          for (var i = 0; i < 4; i++) chips.appendChild(el('bs-chip'));
          side.appendChild(chips);
          var info = el('bs-detail__infogrid', 'div');
          for (var j = 0; j < 8; j++) info.appendChild(el(''));
          side.appendChild(info);
          side.appendChild(el('bs-line'));
          side.appendChild(el('bs-line bs-line--short'));
          top.appendChild(side);
          return top;
        }
        /* Detail 内容卡：演员（圆头像 12 槽）+ 简介 3 行 + 剧照 6 张（常量与
           DetailSkeleton.tsx 同源：CAST_SLOTS=12 / OVERVIEW_LINES=3 / STILL_COUNT=6） */
        function detailContent() {
          var content = el('bs-detail__content', 'div');
          content.appendChild(sec());
          var cast = el('bs-detail__cast', 'div');
          for (var i = 0; i < 12; i++) {
            var item = el('bs-castitem', 'div');
            item.appendChild(el(''));
            item.appendChild(el(''));
            cast.appendChild(item);
          }
          content.appendChild(cast);
          content.appendChild(sec());
          var overview = el('bs-lines', 'div');
          for (var k = 0; k < 3; k++) overview.appendChild(el(''));
          content.appendChild(overview);
          content.appendChild(sec());
          var stills = el('bs-detail__stills', 'div');
          for (var m = 0; m < 6; m++) stills.appendChild(el(''));
          content.appendChild(stills);
          return content;
        }
        /* Detail 推荐区：标题 + poster 满行网格（镜像 .detail-skeleton__recommend） */
        function recommendBlock() {
          var wrap = el('bs-detail__recommend', 'div');
          wrap.appendChild(sec());
          wrap.appendChild(fullGrid('poster', 1));
          return wrap;
        }
        var sec = function () { return el('bs-sec'); };
        var BUILD = {
          plain: function () { return []; },
          /* home：镜像宽屏首页 —— TopStrip → two-col（左趋势榜栏 + 右主列），
             右主列 = HeroBili 融合卡（banner+右卡网格+换一换）+ 首行海报。
             <1024 / TV（cols==='tv'）：回单列经典 hero（与 HeroBannerClassic 同构），
             榜栏/右卡由 CSS 隐藏，与 useIsWideDesktop / HeroBili 启用条件同源。 */
          home: function () {
            var wide = window.matchMedia('(min-width: 1024px)').matches && cols !== 'tv';
            var home = el('bs-home', 'div');
            var strip = el('bs-home__strip', 'div');
            strip.appendChild(el(''));
            strip.appendChild(el(''));
            strip.appendChild(el(''));
            home.appendChild(strip);
            var two = el('bs-home__cols', 'div');
            if (wide) {
              var railBox = el('bs-rail', 'div');
              railBox.appendChild(heatRail());
              two.appendChild(railBox);
            }
            var main = el('bs-home__main', 'div');
            main.appendChild(heroBili(wide));
            main.appendChild(contRow());
            main.appendChild(fullGrid('poster', 1));
            two.appendChild(main);
            home.appendChild(two);
            return [home];
          },
          /* browse：≥1024 真实页是「左栏 FilterBar 筛选组 + 右结果区」（Browse.css grid
             var(--rail-w) minmax(0,1fr)）—— 骨架左栏用 filterRail 同构 */
          browse: function () { return [withRail([filterBar(), fullGrid('poster', 2)], filterRail())]; },
          chart: function () { return [filterBar(), chartRows(colCount('chart') * 4)]; },
          /* collections / history（2026-09-22 实测修正）：真实页（RecordShell + 页骨架）
             顶部**没有筛选条**，旧 filterBar 属结构错构 → 删除；
             collections = 影视收藏区 + IPTV 收藏区双分区（随数据判定，骨架恒显）；
             history = 单组记录网格（真实另有时间轴，轮廓级以 rail 对应） */
          collections: function () { return [withRail([sec(), fullGrid('poster', 1), sec(), fullGrid('channel', 1)])]; },
          history: function () { return [withRail([sec(), fullGrid('record', 2)])]; },
          iptv: function () {
            return [withRail([filterBar(), sec(), fullGrid('iptvpage', 2)])];
          },
          /* detail：镜像 DetailSkeleton.tsx —— top（hero+右侧信息）→ tabs（2 枚）→
             内容卡（演员/简介/剧照）；推荐行由 FILL 补 */
          detail: function () {
            var tabs = el('bs-detail__tabs', 'div');
            tabs.appendChild(el(''));
            tabs.appendChild(el(''));
            return [detailTop(), tabs, detailContent()];
          },
          /* person（2026-09-22 实测重构）：旧「16:9 hero + 文本行」与真实页不符——
             真实 = hero（有图档 ≈224）+ tabs + 作品网格（--person-work-cols）；
             旧文本行代替作品网格属结构错构 */
          person: function () {
            var tabs = el('bs-detail__tabs', 'div');
            tabs.appendChild(el(''));
            tabs.appendChild(el(''));
            return [el('bs-person-hero', 'div'), tabs, fullGrid('work', 2)];
          },
          /* 播放页：主播放区（16:9 黑场）+ 桌面右面板列。
             用 div 而非默认的 i（`<i>` 是 inline，aspect-ratio / 高度不生效，
             同款的 .bs-cover / .bs-line 都是显式 display:block 才成立）。 */
          player: function () {
            var wrap = el('bs-player', 'div');
            wrap.appendChild(el('bs-player__stage', 'div'));
            var side = el('bs-player__side', 'div');
            side.appendChild(el('bs-player__panel', 'div'));
            side.appendChild(el('bs-player__panel bs-player__panel--tall', 'div'));
            wrap.appendChild(side);
            return [wrap];
          },
        };

        /* 填满首屏：按当前视口高度逐行补占位块，直到内容底边到达
           「视口高 − 底部提示区预留」。宁多不缺 —— 超出部分由 overflow:hidden
           裁掉，与真实页「网格自然溢出首屏」同观感；上限 24 次防异常视口
           （0 高 / 缩放极端值）死循环。home / collections 补分区头（.bs-sec），
           对齐真实页「分区标题 + 卡片行」的节奏。列数仍由 CSS 档位唯一决定。
           ⚠️ 量法：.bs-body 是 flex:1 撑满容器，scrollHeight 恒等于容器高
           （不溢出时量不到内容高）→ 改量「host 末子元素底边 − body 顶边」
           （2026-09-20 修复：scrollHeight 法在 body 撑满后填充循环永不触发）。 */
        function contentBottom(host) {
          var last = host.lastElementChild;
          if (!last) return 0;
          return last.getBoundingClientRect().bottom - body.getBoundingClientRect().top;
        }
        function fillRows(host, maker, withSec) {
          var header = splash.querySelector('.bs-header');
          var target = window.innerHeight - (header ? header.offsetHeight : 0) - 48;
          var guard = 0;
          while (guard++ < 24 && contentBottom(host) < target) {
            if (withSec) host.appendChild(sec());
            host.appendChild(maker());
          }
        }
        var FILL = {
          home: function () {
            var host = body.querySelector('.bs-home__main') || body;
            fillRows(host, function () { return fullGrid('poster', 1); }, true);
          },
          browse: function () { fillRows(body.querySelector('.bs-split__main') || body, function () { return fullGrid('poster', 1); }); },
          chart: function () { fillRows(body, function () { return chartRows(colCount('chart')); }); },
          collections: function () { fillRows(body.querySelector('.bs-split__main') || body, function () { return fullGrid('channel', 1); }, true); },
          history: function () { fillRows(body.querySelector('.bs-split__main') || body, function () { return fullGrid('record', 1); }); },
          iptv: function () {
            fillRows(body.querySelector('.bs-split__main') || body, function () { return fullGrid('iptvpage', 1); });
          },
          /* detail：推荐区 = 标题 + poster 行（镜像真实页底部两个推荐行，
             宁多不缺由 overflow 裁剪） */
          detail: function () { fillRows(body, recommendBlock); },
          person: function () { fillRows(body, function () { return fullGrid('work', 1); }); },
        };

        /* ── 第二段：PLAIN_MS 后才换入目标页同构轮廓（两段顺序式，非叠层）──
           换形前 splash 一直是静态 plain 启动页；若 React 先提交并摘除了骨架，
           此处检测到元素已不在则直接放弃（第二段自然跳过，不复活启动页）。 */
        var PLAIN_MS = 400;
        function revealShape() {
          if (!document.getElementById('boot-splash')) return;
          splash.setAttribute('data-shape', shape);
          if (shape === 'play') tip.textContent = '正在打开播放器…';
          else if (shape === 'player') tip.textContent = '正在加载影片…';

          var build = BUILD[shape];
          if (build) {
            var blocks = build();
            var frag = document.createDocumentFragment();
            for (var i = 0; i < blocks.length; i++) frag.appendChild(blocks[i]);
            body.textContent = '';
            body.appendChild(frag);
          }

          /* home 形态完全由 BUILD.home 构建（静态 HTML 已是中性空 body），
             此处按视口补行填满首屏 */
          var fill = FILL[shape];
          if (fill) fill();

          /* 就绪标记：换形 / 构建 / 填充全部完成后才挂。E2E 用
             waitForSelector('#boot-splash[data-shape-ready]') 精确同步到「第二段已就位、
             React 尚未摘除」窗口 —— 两段式后更早的 readyState / attached 信号读到的都是
             第一段 plain，禁止用作换形完成依据。 */
          splash.setAttribute('data-shape-ready', '1');
        }
        window.setTimeout(revealShape, PLAIN_MS);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
