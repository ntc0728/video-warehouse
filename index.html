<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/src/assets/icon/KinoTV.webp" />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <!-- viewport（2026-09-15 修订）：
         · 加 viewport-fit=cover —— 否则 env(safe-area-inset-*) 在 iOS / 刘海屏恒为 0，
           全站已有的安全区规则（TabBar / Drawer / 播放器 / BottomSheet）名存实亡；
         · 移除 maximum-scale / minimum-scale / user-scalable=no —— 三者共同禁止用户缩放，
           违反 WCAG 1.4.4（文本可放大至 200%）。合规替代是本项目已有的应用内 uiScale 手动档
           （设置页「界面缩放」），用户仍可整体放大界面。
         ⚠️ 连带效应：cover 生效后下列 env() 从 0 变为真实值，需确认未与父容器 padding 叠加
           （已核对）：BottomSheet.tsx:103 + Drawer.css:85 + UniversalPlayer.css:1530/1539/2757-2821。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1890ff" />
    <title>kinoTv</title>
    <!--@layout-tokens-->
    <style>
      /* 启动骨架（2026-09-11 建立；2026-09-15 升级为「按路由分支」）：
         HTML 一到浏览器就可见，消除「JS 请求/解析期间纯白屏」。

         为什么按路由分支：全站只有这一份 index.html（Vite 单入口 + SPA fallback，
         任意路径都返回它），静态 DOM 无法按路由拆分 —— 于是「刷新 /collections 也看到
         首页同构骨架」，再被目标页自身骨架替换，形成结构错构跳变。现在由下方内联脚本
         读 location 判定页型，就地换成本页同构的骨架：
           首页 TopStrip+左趋势榜栏+HeroBili 融合卡（banner+右卡网格+换一换）+海报行
             （左栏与右卡仅 ≥1024 非 TV，与 .home-two-col / HeroBili 启用条件同构）/
           IPTV·Browse·收藏·历史 左栏+筛选条+网格（左栏仅 ≥1024，与真实页
             RecordShell / Browse grid 同构）/ Chart 标签条+榜单行 /
           Detail hero+右侧信息栏+tabs+内容卡（镜像 DetailSkeleton）/ Person hero+文本行 /
           播放页 16:9 黑场+右侧面板列 / 其余路由 顶栏+提示（垂直居中）；
           /iptv/play 无顶栏（真实页是全屏播放器，不走 AppLayout）。
           静态默认（无 JS / 内联脚本失败的降级态）是**中性形态**（仅顶栏+提示）：
           home 形态也由脚本构建 —— 保证任何降级场景下非首页路由都不会
           漏出首页轮廓（2026-09-20 用户要求；此前静态默认写死 home 形态，
           SKEL-017 曾在 commit 时刻读到它，证明该窗口真实可观测）。

         硬约束（勿改）：
         1. 颜色零依赖 —— 此刻 bundle CSS（index.css）与 JS 都还没加载，故颜色硬编码
            对齐 variables.css（布局 token 例外：已由上方注入的 layout-tokens.css 提供，
            骨架可直读 var(--card-cols) 等，见约束 2）。浅色 bg #f5f5f5 / surface #fff /
            border #e8e8e8(=--color-border-light) / skeleton #f0f0f0；深色 bg #141414 /
            surface #1f1f1f / border #2b2b2b / skeleton #2a2a2a。
            ⚠️ 骨架填充色与描边色分开维护：填充对齐页面骨架 shimmer 的亮端
            （浅色 --color-placeholder-shimmer-a #f0f0f0；深色取深色 shimmer
            #1f1f1f↔#303030 的中值 #2a2a2a），描边恒 #e8e8e8 / #2b2b2b。
            两者曾经共用 #e8e8e8，导致启动骨架比页面骨架明显偏深（#f0f0f0 ↔ #e6e6e6
            扫光），交接时出现一次「由深变浅」的跳变。
         2. 列数 / 栏宽单真源 = layout-tokens.css（2026-09-21 收敛，注入到上方 <style>）：
            骨架网格一律读 var(--card-cols / --iptv-cols / --iptv-page-cols / --history-cols)，
            左栏读 var(--rail-w / --home-rail-w) —— 与真实页同一份 token、同一套断点/设备
            判定，任意视口恒同构。⚠️ 勿再在骨架里手抄断点阶梯或 JS 镜像表（colCount 旧疾，
            第二真源必然漂移；约定见 useGridCols.ts）。改列数/栏宽只改 layout-tokens.css。
            设备档由脚本写 <html> 的 data-device（tv/app/''，与 AppLayout 同值）触发 token 覆盖；
            data-cols 仅供骨架结构选择器（home/detail 两栏、heroBili 宽屏）使用，不再决定列数。
            mobile-web 与 web 同走视口阶梯（token 只做 not([data-device="app"]) 门控），无需单列。
         3. pointer-events:none 保证即使移除失败也不拦点击（防 E2E 误判遮挡）。
         4. 尺寸用 vh / % / rem 或注入的布局 token（--card-cols / --rail-w 等）；不用 100dvh
            （App 内会溢出），不引 bundle 才有的 token（颜色/间距等仍硬编码）。
         5. 只做「轮廓级同构」：区块数量/方位/卡片比例对齐，不追逐像素 —— 真源仍是
            各页自己的骨架组件（Browse/Collections/IPTV/Person/Detail 的 *Skeleton）。
            新增路由页型时，同步在此补一条 shape 与构建分支。 */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: #f5f5f5;
        color: #999;
        font: 400 13px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        pointer-events: none;
        user-select: none;
      }

      /* 顶栏骨架 */
      .bs-header {
        display: flex;
        flex-shrink: 0;
        gap: 16px;
        align-items: center;
        height: 60px;
        padding: 0 16px;
        background: #fff;
        border-bottom: 1px solid #e8e8e8;
      }
      .bs-logo {
        flex-shrink: 0;
        width: 32px;
        height: 32px;
        overflow: hidden;
        background: #f0f0f0;
        border-radius: 8px;
      }
      .bs-logo img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .bs-nav { display: flex; gap: 12px; align-items: center; margin-left: auto; }
      .bs-nav i { display: block; width: 3.5rem; height: 0.75rem; background: #f0f0f0; border-radius: 6px; }
      .bs-nav i:first-child { width: 9rem; }

      /* 内容骨架。flex:1 + min-height:0 —— 撑满顶栏以下的剩余视口高（2026-09-20
         用户反馈「内容未撑满容器高度」）：填充行溢出由 overflow:hidden 裁剪。 */
      .bs-body { display: flex; flex: 1 1 auto; flex-direction: column; gap: 16px; min-height: 0; padding: 16px; }
      .bs-hero { width: 100%; aspect-ratio: 16 / 9; max-height: 42vh; background: #f0f0f0; border-radius: 12px; }

      /* 卡片网格：--poster 竖版海报 2:3（读 --card-cols）/ --channel 频道 3:2（--iptv-cols）/
         --record 记录卡 16:9（--history-cols）/ --iptvpage IPTV 页频道 3:2（--iptv-page-cols）。
         列数一律读注入的 layout-tokens.css token（见约束 2），勿在此手写阶梯。
         ⚠️ 勿把 .bs-row 当某档复用 —— 元素同时带 bs-row + bs-row--xxx 两个类，写 .bs-row
         的列数会串到其它网格。 */
      .bs-row { display: grid; gap: 12px; }
      /* 列数单真源 = 注入的 layout-tokens.css（见 head 的 <!--@layout-tokens-->），此处只读 var()，
         不再自带断点阶梯 / 设备档。fallback = 移动基础档，仅在注入 style 缺失的极端降级下生效。 */
      .bs-row--poster { grid-template-columns: repeat(var(--card-cols, 3), 1fr); }
      .bs-row--channel { grid-template-columns: repeat(var(--iptv-cols, 2), 1fr); }
      .bs-row--iptvpage { grid-template-columns: repeat(var(--iptv-page-cols, 2), 1fr); }
      .bs-row--record { grid-template-columns: repeat(var(--history-cols, 1), 1fr); }
      .bs-card { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
      .bs-cover, .bs-line { display: block; background: #f0f0f0; border-radius: 8px; }
      .bs-cover { aspect-ratio: 2 / 3; }
      .bs-line { width: 76%; height: 0.75rem; border-radius: 6px; }
      .bs-line--short { width: 52%; }
      .bs-row--channel .bs-cover { aspect-ratio: 3 / 2; }
      .bs-row--record .bs-cover { aspect-ratio: 16 / 9; }
      .bs-row--iptvpage .bs-cover { aspect-ratio: 3 / 2; }

      /* 筛选条（Browse 结果条 / 收藏·历史顶部筛选卡 / IPTV 计数条） */
      .bs-filter {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 12px 16px;
        background: #fff;
        border: 1px solid #e8e8e8;
        border-radius: 12px;
      }
      .bs-chip { display: block; width: 3.5rem; height: 1.5rem; background: #f0f0f0; border-radius: 999px; }
      .bs-chip--wide { width: 7rem; }
      .bs-chip--end { margin-left: auto; width: 5.5rem; }

      /* 分区头 / 榜单行 / 文本行 */
      .bs-sec { display: block; width: 4.5rem; height: 1rem; background: #f0f0f0; border-radius: 6px; }
      .bs-list { display: flex; flex-direction: column; gap: 12px; }
      .bs-list i { display: block; height: 3.5rem; background: #f0f0f0; border-radius: 8px; }
      .bs-lines { display: flex; flex-direction: column; gap: 10px; }
      .bs-lines i { display: block; height: 1rem; background: #f0f0f0; border-radius: 6px; }
      .bs-lines i:nth-child(1) { width: 14rem; height: 1.75rem; }
      .bs-lines i:nth-child(2) { width: 9rem; }
      .bs-lines i:nth-child(3) { width: 100%; }
      .bs-lines i:nth-child(4) { width: 68%; }

      /* 左栏（IPTV 频道分类）：<1024 不显示，与真实页「移动端换成顶部筛选卡」同构 */
      .bs-split { display: flex; flex-direction: column; gap: 16px; }
      .bs-rail { display: none; }
      .bs-split__main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

      /* 提示绝对定位钉在视口底：内容按视口填满后仍可见（若留在文档流，
         填满后的溢出会把提示推出 overflow:hidden 的裁剪区） */
      .bs-tip {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 4px 0 20px;
        text-align: center;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      /* 中性形态（plain，脚本挂类）：提示在视口内真垂直居中（2026-09-20 用户要求）。
         top+bottom+margin:auto 居中有内容时会被顶栏/内容压住，故只在空 body 的
         plain 档启用，不串到其它形态。 */
      #boot-splash[data-shape="plain"] .bs-tip {
        top: 0;
        height: max-content;
        margin: auto;
      }

      @keyframes boot-pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }

      /* 列数断点阶梯 + 设备档覆盖已全部删除：改由注入的 layout-tokens.css 单真源驱动
         （上方 .bs-row--* 读 var(--card-cols) 等，设备档由脚本写 <html> 的 data-device 触发
         token 的 TV/App 覆盖）。旧手抄 @media 阶梯 + data-cols 覆盖是第二真源，与真实网格
         必然漂移；删除后骨架列数恒与真实页一致（同一份 token、同一视口/设备判定）。 */

      /* IPTV 左栏：≥1024 才出现（与 .iptv-skeleton--rail 同构）。
         ⚠️ 选择器必须带 .bs-split 前缀：home 形态的左栏（.bs-home .bs-rail）
         阈值/宽度/描边都不同源，裸 .bs-rail 会串档。 */
      @media (width >= 1024px) {
        .bs-split { flex: 1 1 auto; flex-direction: row; gap: 24px; align-items: flex-start; min-height: 0; }
        .bs-split .bs-rail {
          display: flex;
          flex: 0 0 var(--rail-w, clamp(148px, 10vw, 248px));
          flex-direction: column;
          gap: 6px;
          padding-right: 8px;
          border-right: 1px solid #e8e8e8;
        }
        .bs-split__main { display: flex; flex: 1 1 auto; flex-direction: column; gap: 16px; min-width: 0; min-height: 0; }
        .bs-split .bs-rail i { display: block; height: 1.75rem; background: #f0f0f0; border-radius: 6px; }
        .bs-split .bs-rail i.bs-rail__title { width: 4rem; height: 0.875rem; margin-bottom: 6px; }
        html[data-theme="dark"] .bs-split .bs-rail { border-right-color: #2b2b2b; }
      }

      /* 首页（2026-09-20 二次重构，用户要求与真实宽屏首页同构）：
         镜像 Home/index.tsx 宽屏分支 —— TopStrip → .home-two-col（左榜栏 + 右主列），
         右主列 = HeroBili 融合卡（banner + 右卡网格 + 换一换）+ 海报行。
         栏宽镜像 --home-rail-w 真源：240（1024–1919）/ 260（≥1920，此前误写 ≥2560）。
         <1024 / TV：回单列经典 hero（与 HeroBannerClassic 同构），榜栏隐藏。 */
      .bs-home { display: flex; flex: 1 1 auto; flex-direction: column; gap: 12px; min-height: 0; }
      .bs-home__strip { display: flex; gap: 8px; }
      .bs-home__strip i { display: block; width: 7rem; height: 1.5rem; background: #f0f0f0; border-radius: 999px; }
      .bs-home__strip i:first-child { width: 10rem; }
      .bs-home__cols { display: flex; flex: 1 1 auto; flex-direction: column; gap: 16px; min-height: 0; }
      .bs-home .bs-rail { display: none; }
      .bs-home__main { display: flex; flex: 1 1 auto; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; }

      /* 左栏：今日趋势榜卡（镜像 .cqa-trend rail 变体：卡壳 + 标题 + 海报行列表） */
      .bs-home__railcard { display: flex; flex-direction: column; gap: 10px; padding: 12px; background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; }
      .bs-heat { display: flex; gap: 8px; align-items: center; }
      .bs-heat__poster { flex: 0 0 40px; aspect-ratio: 2 / 3; background: #f0f0f0; border-radius: 6px; }
      .bs-heat__text { display: flex; flex: 1 1 auto; flex-direction: column; gap: 6px; min-width: 0; }
      .bs-heat__text i { display: block; height: 0.75rem; background: #f0f0f0; border-radius: 6px; }
      .bs-heat__text i:last-child { width: 55%; }

      /* HeroBili 融合卡：--bs-main-w 镜像 .home-two-col__main 的真源公式分母
         （min(100vw,2200) − 2×page-pad − rail − gap；page-pad 阶梯 16/60/100/140
         与 variables.css 同源）；sideW 0.48（1024–1280）/ 0.56（≥1281）/ 0.66（≥2560），
         bannerH 系数 0.31 / 0.24 / 0.277 —— 全部与 Home.css 生效点同值。 */
      .bs-herobili {
        --bs-main-w: calc(min(100vw, 2200px) - 32px);
        --bs-side-w: calc(var(--bs-main-w) * 0.48);
        --bs-banner-h: calc(var(--bs-main-w) * 0.31);
        padding: 12px 16px 16px;
        background: #fff;
        border: 1px solid #e8e8e8;
        border-radius: 12px;
      }
      .bs-herobili__grid { display: flex; flex-direction: column; gap: 10px; }
      .bs-herobili__banner {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        max-height: 42vh;
        overflow: hidden;
        background: #f0f0f0;
        border-radius: 8px;
      }
      /* 「正在启动」提示在 home 形态下垂直居中（用户要求）：视口中线 + translateY 归位 */
      #boot-splash[data-shape="home"] .bs-tip { top: 50%; bottom: auto; transform: translateY(-50%); padding: 4px 0; }
      .bs-herobili__right { display: none; }
      .bs-herocards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .bs-herocard { display: flex; flex-direction: column; overflow: hidden; background: #fff; border: 1px solid #e8e8e8; border-radius: 8px; }
      .bs-herocard__cover { display: block; aspect-ratio: 16 / 9; background: #f0f0f0; }
      .bs-herocard__title { display: block; height: 0.75rem; margin: 8px 10px; background: #f0f0f0; border-radius: 6px; }
      .bs-shuffle { display: none; }

      @media (width >= 1024px) {
        #boot-splash:not([data-cols="tv"]) .bs-home__cols { flex-direction: row; gap: 16px; align-items: flex-start; }
        #boot-splash:not([data-cols="tv"]) .bs-home .bs-rail { display: block; flex: 0 0 var(--home-rail-w, 240px); }
        /* 宽屏档 hero 真源：高度/右栏宽改由 token 派生，不再用 aspect-ratio */
        #boot-splash:not([data-cols="tv"]) .bs-herobili {
          --bs-main-w: calc(min(100vw, 2200px) - 2 * var(--bs-pad, 16px) - var(--home-rail-w, 240px) - 16px);
        }
        #boot-splash:not([data-cols="tv"]) .bs-herobili__grid { flex-direction: row; gap: 10px; }
        #boot-splash:not([data-cols="tv"]) .bs-herobili__banner { flex: 1 1 0; min-width: 0; height: var(--bs-banner-h); max-height: none; aspect-ratio: auto; }
        #boot-splash:not([data-cols="tv"]) .bs-herobili__right {
          display: grid;
          flex: 0 0 var(--bs-side-w);
          grid-template-columns: minmax(0, 1fr) auto;
          column-gap: 8px;
          align-items: start;
        }
        #boot-splash:not([data-cols="tv"]) .bs-shuffle {
          display: flex;
          flex-direction: column;
          gap: 4px;
          justify-content: center;
          align-items: center;
          width: 1.75rem;
          padding: 10px 2px;
          background: #fff;
          border: 1px solid #e8e8e8;
          border-radius: 8px;
        }
        .bs-shuffle i { display: block; width: 0.875rem; height: 0.875rem; background: #f0f0f0; border-radius: 4px; }
        .bs-shuffle i:last-child { width: 0.625rem; height: 2.5rem; border-radius: 3px; }
      }
      /* page-pad 阶梯（variables.css 同源）：1440 → 60、1920 → 100、2560 → 140 */
      @media (width >= 1440px) { #boot-splash:not([data-cols="tv"]) .bs-herobili { --bs-pad: 60px; } }
      @media (width >= 1281px) { #boot-splash:not([data-cols="tv"]) .bs-herobili { --bs-side-w: calc(var(--bs-main-w) * 0.56); --bs-banner-h: calc(var(--bs-main-w) * 0.24); } }
      @media (width >= 1920px) {
        #boot-splash:not([data-cols="tv"]) .bs-home .bs-rail { flex-basis: var(--home-rail-w, 260px); }
        #boot-splash:not([data-cols="tv"]) .bs-herobili { --bs-pad: 100px; --bs-main-w: calc(min(100vw, 2200px) - 2 * var(--bs-pad) - var(--home-rail-w, 260px) - 16px); }
      }
      @media (width >= 2560px) {
        #boot-splash:not([data-cols="tv"]) .bs-herobili { --bs-pad: 140px; --bs-side-w: calc(var(--bs-main-w) * 0.66); --bs-banner-h: calc(var(--bs-main-w) * 0.277); }
      }
      /* 右卡列数（useHeroSideCols 同源断点）：1024–1280 → 2 列×2 行；≥1281 → 3 列×2 行 */
      @media (width >= 1281px) { #boot-splash:not([data-cols="tv"]) .bs-herocards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

      html[data-theme="dark"] .bs-home__strip i,
      html[data-theme="dark"] .bs-heat__poster,
      html[data-theme="dark"] .bs-heat__text i,
      html[data-theme="dark"] .bs-herobili__banner,
      html[data-theme="dark"] .bs-herocard__cover,
      html[data-theme="dark"] .bs-herocard__title,
      html[data-theme="dark"] .bs-shuffle i { background: #2a2a2a; }
      html[data-theme="dark"] .bs-home__railcard,
      html[data-theme="dark"] .bs-herobili,
      html[data-theme="dark"] .bs-herocard,
      html[data-theme="dark"] .bs-shuffle { background: #1f1f1f; border-color: #2b2b2b; }

      /* Detail 形态（2026-09-20 重构，镜像 DetailSkeleton.tsx 真实结构）：
         top（hero 16:9 + 右侧 chips/信息网格；≥1024 非 app/tv 两栏 1.4fr/1fr，

        var FILL = {
          home: function () {
            var host = body.querySelector('.bs-home__main') || body;
            fillRows(host, function () { return fullGrid('poster', 1); }, true);
          },
          browse: function () { fillRows(body.querySelector('.bs-split__main') || body, function () { return fullGrid('poster', 1); }); },
          chart: function () { fillRows(body, function () { return listRows(8); }); },
          collections: function () { fillRows(body.querySelector('.bs-split__main') || body, function () { return fullGrid('channel', 1); }, true); },
          history: function () { fillRows(body.querySelector('.bs-split__main') || body, function () { return fullGrid('record', 1); }); },
          iptv: function () {
            fillRows(body.querySelector('.bs-split__main') || body, function () { return fullGrid('iptvpage', 1); });
          },
          /* detail：推荐区 = 标题 + poster 行（镜像真实页底部两个推荐行，
             宁多不缺由 overflow 裁剪） */
          detail: function () { fillRows(body, recommendBlock); },
          person: function () { fillRows(body, function () { return lines(4); }); },
        };

        splash.setAttribute('data-shape', shape);
        if (shape === 'play') tip.textContent = '正在打开播放器…';
        else if (shape === 'player') tip.textContent = '正在加载影片…';

        var build = BUILD[shape];
        if (build) {
          var blocks = build();
          var frag = document.createDocumentFragment();
          for (var i = 0; i < blocks.length; i++) frag.appendChild(blocks[i]);
          body.textContent = '';
          body.appendChild(frag);
        }

        /* home 形态完全由 BUILD.home 构建（静态 HTML 已是中性空 body），
           此处按视口补行填满首屏 */
        var fill = FILL[shape];
        if (fill) fill();

        /* 就绪标记：data-shape / body 构建 / 填充全部完成后才挂。E2E 用
           waitForSelector('#boot-splash[data-shape-ready]') 精确同步到「内联脚本已跑完、
           但被延迟的 main.tsx 尚未执行（React 未挂载摘除骨架）」这段窗口 —— 既不会在
           分块解析竞态下读到 HTML 静态默认 data-shape，也不会等到 React 摘除后截空。
           ⚠️ 不能用 waitForFunction(readyState!=='loading') 替代：那要等被拦延迟的
           main.tsx（deferred module）执行完，届时 React 已挂载、骨架可能已被摘除。 */
        splash.setAttribute('data-shape-ready', '1');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
