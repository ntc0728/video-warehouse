<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/src/assets/icon/KinoTV.webp" />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <!-- viewport（2026-09-15 修订）：
         · 加 viewport-fit=cover —— 否则 env(safe-area-inset-*) 在 iOS / 刘海屏恒为 0，
           全站已有的安全区规则（TabBar / Drawer / 播放器 / BottomSheet）名存实亡；
         · 移除 maximum-scale / minimum-scale / user-scalable=no —— 三者共同禁止用户缩放，
           违反 WCAG 1.4.4（文本可放大至 200%）。合规替代是本项目已有的应用内 uiScale 手动档
           （设置页「界面缩放」），用户仍可整体放大界面。
         ⚠️ 连带效应：cover 生效后下列 env() 从 0 变为真实值，需确认未与父容器 padding 叠加
           （已核对）：BottomSheet.tsx:103 + Drawer.css:85 + UniversalPlayer.css:1530/1539/2757-2821。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1890ff" />
    <title>kinoTv</title>
    <style>
      /* 启动骨架（2026-09-11 建立；2026-09-15 升级为「按路由分支」）：
         HTML 一到浏览器就可见，消除「JS 请求/解析期间纯白屏」。

         为什么按路由分支：全站只有这一份 index.html（Vite 单入口 + SPA fallback，
         任意路径都返回它），静态 DOM 无法按路由拆分 —— 于是「刷新 /collections 也看到
         首页同构骨架」，再被目标页自身骨架替换，形成结构错构跳变。现在由下方内联脚本
         读 location 判定页型，就地换成本页同构的骨架：
           首页 hero+卡片行 / IPTV 左栏+频道网格 / 收藏·历史 筛选卡+网格 /
           Browse 筛选条+海报网格 / Chart 标签条+榜单行 / Detail·Person hero+文本行 /
           播放页 16:9 黑场+右侧面板列 / 其余路由 顶栏+提示；
           /iptv/play 无顶栏（真实页是全屏播放器，不走 AppLayout）。

         硬约束（勿改）：
         1. 必须零依赖 —— 此刻 index.css 与 JS 都还没加载，CSS 变量不可用，
            故颜色硬编码对齐 variables.css：浅色 bg #f5f5f5 / surface #fff /
            border #e8e8e8(=--color-border-light) / skeleton #f0f0f0；深色 bg #141414 /
            surface #1f1f1f / border #2b2b2b / skeleton #2a2a2a。
            ⚠️ 骨架填充色与描边色分开维护：填充对齐页面骨架 shimmer 的亮端
            （浅色 --color-placeholder-shimmer-a #f0f0f0；深色取深色 shimmer
            #1f1f1f↔#303030 的中值 #2a2a2a），描边恒 #e8e8e8 / #2b2b2b。
            两者曾经共用 #e8e8e8，导致启动骨架比页面骨架明显偏深（#f0f0f0 ↔ #e6e6e6
            扫光），交接时出现一次「由深变浅」的跳变。
         2. 列数分档对齐真实网格的四套真源（勿凭感觉改）：
            海报网格 3 →4(768) →5(1024) →6(1280) →7(1440) →8(1920)  = --card-cols（variables.css）
            频道网格 2 →3(768) →4(1024) →5(1440)                     = --iptv-cols（index.css，收藏页 IPTV 卡）
            记录网格 1 →2(480) →3(768) →4(1024) →5(1440) →6(1920)    = .history-grid（History.css，历史页记录卡）
            IPTV 页  2 →3(768) →3(1024) →4(1440) →5(2560)            = --iptv-page-cols（IPTV 页专用，左栏吃宽降一档）
            设备档由脚本写入 data-cols 覆盖：TV 恒 8/5/5/5，App 停基础档 3/2/2
            （与 [data-device] 门控同源；记录网格无 app 门控，故 App 仍走视口阶梯）。
            每种网格各自持有完整阶梯，勿写通用 .bs-row 档（会串档 / 抬特异性，详见下方）。
            ⚠️ mobile-web 档（真实手机 UA 的非 Capacitor 形态）**故意不单列**：2026-09-18
            核查确认 variables.css / index.css 的列数覆盖（--card-cols / --iptv-cols /
            --iptv-page-cols / --history-cols）全部只做 not([data-device="app"]) 门控，
            mobile-web 与 web 走同一条视口阶梯 —— 故 data-cols="web" 已与之等价，
            此项由「待实测」升级为已核实结论，勿再凭感觉补档。
         3. pointer-events:none 保证即使移除失败也不拦点击（防 E2E 误判遮挡）。
         4. 尺寸全用 vh / % / rem，不引 token、不用 100dvh（App 内会溢出）。
         5. 只做「轮廓级同构」：区块数量/方位/卡片比例对齐，不追逐像素 —— 真源仍是
            各页自己的骨架组件（Browse/Collections/IPTV/Person/Detail 的 *Skeleton）。
            新增路由页型时，同步在此补一条 shape 与构建分支。 */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: #f5f5f5;
        color: #999;
        font: 400 13px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        pointer-events: none;
        user-select: none;
      }

      /* 顶栏骨架 */
      .bs-header {
        display: flex;
        flex-shrink: 0;
        gap: 16px;
        align-items: center;
        height: 60px;
        padding: 0 16px;
        background: #fff;
        border-bottom: 1px solid #e8e8e8;
      }
      .bs-logo {
        flex-shrink: 0;
        width: 32px;
        height: 32px;
        overflow: hidden;
        background: #f0f0f0;
        border-radius: 8px;
      }
      .bs-logo img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .bs-nav { display: flex; gap: 12px; align-items: center; margin-left: auto; }
      .bs-nav i { display: block; width: 3.5rem; height: 0.75rem; background: #f0f0f0; border-radius: 6px; }
      .bs-nav i:first-child { width: 9rem; }

      /* 内容骨架 */
      .bs-body { display: flex; flex-direction: column; gap: 16px; padding: 16px; }
      .bs-hero { width: 100%; aspect-ratio: 16 / 9; max-height: 42vh; background: #f0f0f0; border-radius: 12px; }

      /* 卡片网格：--poster 竖版海报 2:3（--card-cols）/ --channel 频道 3:2（--iptv-cols）/
         --record 记录卡 16:9（.history-grid，独立阶梯）/ --iptvpage IPTV 页频道 3:2
         （--iptv-page-cols，左栏吃宽故降一档）
         ⚠️ 每种网格必须持有自己的完整阶梯，勿把 .bs-row 当海报档复用 —— 元素同时带
         bs-row + bs-row--xxx 两个类，任何写 .bs-row 的档位都会串到其它网格；而带 :not()
         的通用档会抬升特异性，反过来压过 .bs-row--xxx 的专属档（App 档曾被压成 3 列）。 */
      .bs-row { display: grid; gap: 12px; }
      .bs-row--poster { grid-template-columns: repeat(3, 1fr); }
      .bs-row--channel,
      .bs-row--iptvpage { grid-template-columns: repeat(2, 1fr); }
      .bs-row--record { grid-template-columns: repeat(1, 1fr); }
      .bs-card { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
      .bs-cover, .bs-line { display: block; background: #f0f0f0; border-radius: 8px; }
      .bs-cover { aspect-ratio: 2 / 3; }
      .bs-line { width: 76%; height: 0.75rem; border-radius: 6px; }
      .bs-line--short { width: 52%; }
      .bs-row--channel .bs-cover { aspect-ratio: 3 / 2; }
      .bs-row--record .bs-cover { aspect-ratio: 16 / 9; }
      .bs-row--iptvpage .bs-cover { aspect-ratio: 3 / 2; }

      /* 筛选条（Browse 结果条 / 收藏·历史顶部筛选卡 / IPTV 计数条） */
      .bs-filter {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 12px 16px;
        background: #fff;
        border: 1px solid #e8e8e8;
        border-radius: 12px;
      }
      .bs-chip { display: block; width: 3.5rem; height: 1.5rem; background: #f0f0f0; border-radius: 999px; }
      .bs-chip--wide { width: 7rem; }
      .bs-chip--end { margin-left: auto; width: 5.5rem; }

      /* 分区头 / 榜单行 / 文本行 */
      .bs-sec { display: block; width: 4.5rem; height: 1rem; background: #f0f0f0; border-radius: 6px; }
      .bs-list { display: flex; flex-direction: column; gap: 12px; }
      .bs-list i { display: block; height: 3.5rem; background: #f0f0f0; border-radius: 8px; }
      .bs-lines { display: flex; flex-direction: column; gap: 10px; }
      .bs-lines i { display: block; height: 1rem; background: #f0f0f0; border-radius: 6px; }
      .bs-lines i:nth-child(1) { width: 14rem; height: 1.75rem; }
      .bs-lines i:nth-child(2) { width: 9rem; }
      .bs-lines i:nth-child(3) { width: 100%; }
      .bs-lines i:nth-child(4) { width: 68%; }

      /* 左栏（IPTV 频道分类）：<1024 不显示，与真实页「移动端换成顶部筛选卡」同构 */
      .bs-split { display: flex; flex-direction: column; gap: 16px; }
      .bs-rail { display: none; }
      .bs-split__main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

      /* 提示改为绝对定位钉在视口底：内容按视口填满后仍可见（若留在文档流，
         填满后的溢出会把提示推出 overflow:hidden 的裁剪区） */
      .bs-tip {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 4px 0 20px;
        text-align: center;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      .bs-body:empty + .bs-tip { padding-top: 32px; }

      @keyframes boot-pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }

      /* 海报网格（--card-cols 真源）：3 →4(768) →5(1024) →6(1280) →7(1440) →8(1920) */
      @media (width >= 768px)  { .bs-row--poster { grid-template-columns: repeat(4, 1fr); } }
      @media (width >= 1024px) { .bs-row--poster { grid-template-columns: repeat(5, 1fr); } }
      @media (width >= 1280px) { .bs-row--poster { grid-template-columns: repeat(6, 1fr); } }
      @media (width >= 1440px) { .bs-row--poster { grid-template-columns: repeat(7, 1fr); } }
      @media (width >= 1920px) { .bs-row--poster { grid-template-columns: repeat(8, 1fr); } }

      /* 频道网格（--iptv-cols 真源）：2 →3(768) →4(1024) →5(1440) */
      @media (width >= 768px)  { .bs-row--channel { grid-template-columns: repeat(3, 1fr); } }
      @media (width >= 1024px) { .bs-row--channel { grid-template-columns: repeat(4, 1fr); } }
      @media (width >= 1440px) { .bs-row--channel { grid-template-columns: repeat(5, 1fr); } }

      /* 记录网格（.history-grid 真源，与 --iptv-cols 不同源，独立阶梯）：
         1 →2(480) →3(768) →4(1024) →5(1440) →6(1920)；App 视口走同一阶梯（.history-grid 无
         app 门控），TV 由下方 data-cols 档恒 5 列覆盖。 */
      @media (width >= 480px)  { .bs-row--record { grid-template-columns: repeat(2, 1fr); } }
      @media (width >= 768px)  { .bs-row--record { grid-template-columns: repeat(3, 1fr); } }
      @media (width >= 1024px) { .bs-row--record { grid-template-columns: repeat(4, 1fr); } }
      @media (width >= 1440px) { .bs-row--record { grid-template-columns: repeat(5, 1fr); } }
      @media (width >= 1920px) { .bs-row--record { grid-template-columns: repeat(6, 1fr); } }

      /* IPTV 页网格（--iptv-page-cols 真源，左栏占宽故 1024 档不升）：2 →3(768) →3(1024) →4(1440) →5(2560) */
      @media (width >= 768px)  { .bs-row--iptvpage { grid-template-columns: repeat(3, 1fr); } }
      @media (width >= 1440px) { .bs-row--iptvpage { grid-template-columns: repeat(4, 1fr); } }
      @media (width >= 2560px) { .bs-row--iptvpage { grid-template-columns: repeat(5, 1fr); } }

      /* 设备档覆盖（与 variables.css / index.css 的 [data-device] 同源，由脚本写入 data-cols）。
         每种网格都给全自己的档，不写通用 .bs-row —— 否则会串档（见上方卡片网格注释）：
         TV：--card-cols 8 / --iptv-cols 5 / --iptv-page-cols 5 / .history-grid 5，不随视口变；
         App：真源 html:not([data-device="app"]) 的门控使 --card-cols / --iptv-cols /
         --iptv-page-cols 停在基础档 → 海报 3 / 频道 2 / IPTV 页 2；记录网格无 app 门控，
         故不给 app 档，继续走视口阶梯（1/2/3/4/5/6）。 */
      #boot-splash[data-cols="tv"] .bs-row--poster { grid-template-columns: repeat(8, 1fr); }
      #boot-splash[data-cols="tv"] .bs-row--channel,
      #boot-splash[data-cols="tv"] .bs-row--record,
      #boot-splash[data-cols="tv"] .bs-row--iptvpage { grid-template-columns: repeat(5, 1fr); }
      #boot-splash[data-cols="app"] .bs-row--poster { grid-template-columns: repeat(3, 1fr); }
      #boot-splash[data-cols="app"] .bs-row--channel,
      #boot-splash[data-cols="app"] .bs-row--iptvpage { grid-template-columns: repeat(2, 1fr); }

      /* IPTV 左栏：≥1024 才出现（与 .iptv-skeleton--rail 同构） */
      @media (width >= 1024px) {
        .bs-split { flex-direction: row; gap: 24px; align-items: flex-start; }
        .bs-rail {
          display: flex;
          flex: 0 0 clamp(148px, 10vw, 248px);
          flex-direction: column;
          gap: 6px;
          padding-right: 8px;
          border-right: 1px solid #e8e8e8;
        }
        .bs-rail i { display: block; height: 1.75rem; background: #f0f0f0; border-radius: 6px; }
        .bs-rail i.bs-rail__title { width: 4rem; height: 0.875rem; margin-bottom: 6px; }
        html[data-theme="dark"] .bs-rail { border-right-color: #2b2b2b; }
      }

      /* 播放页（/play、/play/:id、/player，2026-09-18 补齐）：主播放区（16:9 黑场）
         + 右侧面板列，与真实 .player-main（flex row：.player-video-area + .player-sidebar）
         同构。侧栏骨架由 React 侧 PlayerSidebarSkeleton 承担，此处只做「有一列面板」的轮廓。
         ⚠️ 与 data-shape="play"（/iptv/play 全屏播放器）是两种页型：那个无顶栏、提示居中，
         本档保留顶栏（播放页在 AppLayout 内）。 */
      .bs-player { display: flex; flex-direction: column; gap: 16px; }
      .bs-player__stage {
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 12px;
      }
      .bs-player__side { display: none; flex-direction: column; gap: 12px; }
      .bs-player__panel { height: 7rem; background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; }
      .bs-player__panel--tall { height: 13rem; }

      /* 桌面（≥1024，与 AppLayout 的 wide 起点一致）：播放区吃满剩余宽，右侧出现面板列 */
      @media (width >= 1024px) {
        .bs-player { flex-direction: row; align-items: flex-start; }
        .bs-player__stage { flex: 1 1 auto; min-width: 0; }
        .bs-player__side { display: flex; flex: 0 0 clamp(220px, 18vw, 320px); }
      }

      html[data-theme="dark"] .bs-player__panel { background: #1f1f1f; border-color: #2b2b2b; }

      /* /iptv/play 真实页是全屏播放器（顶层路由，不走 AppLayout）→ 无顶栏，提示居中 */
      #boot-splash[data-shape="play"] .bs-header { display: none; }
      #boot-splash[data-shape="play"] .bs-body { flex: 1; align-items: center; justify-content: center; }

      html[data-theme="dark"] #boot-splash { background: #141414; color: #666; }
      html[data-theme="dark"] .bs-header { background: #1f1f1f; border-bottom-color: #2b2b2b; }
      html[data-theme="dark"] .bs-filter { background: #1f1f1f; border-color: #2b2b2b; }
      html[data-theme="dark"] .bs-logo,
      html[data-theme="dark"] .bs-nav i,
      html[data-theme="dark"] .bs-hero,
      html[data-theme="dark"] .bs-cover,
      html[data-theme="dark"] .bs-line,
      html[data-theme="dark"] .bs-chip,
      html[data-theme="dark"] .bs-sec,
      html[data-theme="dark"] .bs-list i,
      html[data-theme="dark"] .bs-lines i,
      html[data-theme="dark"] .bs-rail i { background: #2a2a2a; }

      @media (prefers-reduced-motion: reduce) { .bs-tip { animation: none; } }
    </style>
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('app-settings');
          if (raw) {
            var state = JSON.parse(raw);
            var theme = state.state && state.state.theme;
            if (theme === 'dark') {
              document.documentElement.setAttribute('data-theme', 'dark');
            } else if (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches) {
              document.documentElement.setAttribute('data-theme', 'dark');
            }
            /* 阶段 C 首帧防闪：手动档 uiScale>0 时在 React mount 前预写内联 --ui-scale，
               避免 ≥1920 大屏首帧闪自动档值；0=自动时不写，交回 @media 判定。 */
            var uiScale = state.state && state.state.uiScale;
            if (typeof uiScale === 'number' && uiScale > 0) {
              document.documentElement.style.setProperty('--ui-scale', String(uiScale));
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true" data-shape="home">
      <div class="bs-header">
        <div class="bs-logo">
          <img src="/src/assets/icon/KinoTV.webp" alt="" onerror="this.style.display='none'" />
        </div>
        <div class="bs-nav"><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="bs-body" id="bs-body">
        <div class="bs-hero"></div>
        <div class="bs-row bs-row--poster"><i class="bs-cover"></i><i class="bs-cover"></i><i class="bs-cover"></i><i class="bs-cover"></i><i class="bs-cover"></i><i class="bs-cover"></i><i class="bs-cover"></i><i class="bs-cover"></i></div>
      </div>
      <div class="bs-tip" id="bs-tip">正在启动…</div>
    </div>
    <script>
      /* 启动骨架的「按路由分支」：静态默认是首页形态（无 JS 时的兜底），
         这里按当前 location 就地换成本页同构的骨架。脚本同步执行且位于 #root 之前，
         赶在首帧绘制前完成，不会出现「先闪首页骨架、再换成目标页骨架」。
         路由判定与 src/routes.tsx 对齐；App 端走 HashRouter，故同时读 hash。 */
      (function () {
        var splash = document.getElementById('boot-splash');
        var body = document.getElementById('bs-body');
        var tip = document.getElementById('bs-tip');
        if (!splash || !body || !tip) return;

        var path = location.pathname;
        if (location.hash.charAt(0) === '#' && location.hash.charAt(1) === '/') {
          path = location.hash.slice(1);
        }
        path = path.replace(/\/+$/, '') || '/';

        var shape = 'plain';
        if (path === '/') shape = 'home';
        else if (path === '/iptv/play') shape = 'play';
        else if (path === '/iptv') shape = 'iptv';
        else if (path === '/browse') shape = 'browse';
        else if (path === '/chart') shape = 'chart';
        else if (path === '/collections') shape = 'collections';
        else if (path === '/history') shape = 'history';
        else if (path.indexOf('/detail/') === 0) shape = 'detail';
        else if (path.indexOf('/person/') === 0) shape = 'person';
        /* 播放页两条路径都覆盖（2026-09-18 补）：/play 与 /player 是同一页的两条路由，
           /play/:id 是详情/历史进入播放的实际形态（此前三条全部落 plain —— 无顶栏无内容），
           故 indexOf 判定必须排在 /iptv/play 之后（后者不以 /play 开头，不冲突）。 */
        else if (path === '/play' || path === '/player' || path.indexOf('/play/') === 0) shape = 'player';

        /* 设备档（决定列数分档，与真源 [data-device] 覆盖同源）：
           TV 恒 8 / 5 / 5 列，App 停在基础档 3 / 2 / 2，Web 走视口断点。
           判定顺序与 useIsTV（设置页强制开关 → UA）一致；App 用 Capacitor 运行时判定。 */
        var cols = 'web';
        try {
          var settings = JSON.parse(localStorage.getItem('app-settings') || '{}').state || {};
          var ua = navigator.userAgent.toLowerCase();
          if (settings.tvMode === true || /(smart-tv|hbbtv|roku|viera|webos|tizen|googletv|appletv|crkey|playstation|xbox)|\btv\b/.test(ua)) {
            cols = 'tv';
          } else if (window.Capacitor && typeof window.Capacitor.isNativePlatform === 'function' && window.Capacitor.isNativePlatform()) {
            cols = 'app';
          }
        } catch (e) {}
        splash.setAttribute('data-cols', cols);

        function el(cls, tag) {
          var node = document.createElement(tag || 'i');
          if (cls) node.className = cls;
          return node;
        }
        function grid(kind, count) {
          var row = el('bs-row bs-row--' + kind, 'div');
          for (var i = 0; i < count; i++) {
            var card = el('bs-card', 'div');
            card.appendChild(el('bs-cover'));
            card.appendChild(el('bs-line'));
            if (kind === 'record') card.appendChild(el('bs-line bs-line--short'));
            row.appendChild(card);
          }
          return row;
        }
        function filterBar() {
          var bar = el('bs-filter', 'div');
          bar.appendChild(el('bs-chip bs-chip--wide'));
          for (var i = 0; i < 4; i++) bar.appendChild(el('bs-chip'));
          bar.appendChild(el('bs-chip bs-chip--end'));
          return bar;
        }
        function rail() {
          var aside = el('bs-rail', 'div');
          aside.appendChild(el('bs-rail__title'));
          for (var i = 0; i < 9; i++) aside.appendChild(el(''));
          return aside;
        }
        function listRows(count) {
          var list = el('bs-list', 'div');
          for (var i = 0; i < count; i++) list.appendChild(el(''));
          return list;
        }
        function lines(count) {
          var box = el('bs-lines', 'div');
          for (var i = 0; i < count; i++) box.appendChild(el(''));
          return box;
        }
        function hero() { return el('bs-hero', 'div'); }
        var sec = function () { return el('bs-sec'); };
        var BUILD = {
          plain: function () { return []; },
          browse: function () { return [filterBar(), grid('poster', 16)]; },
          chart: function () { return [filterBar(), listRows(8)]; },
          collections: function () { return [filterBar(), sec(), grid('poster', 8), sec(), grid('channel', 6)]; },
          history: function () { return [filterBar(), grid('record', 8)]; },
          iptv: function () {
            var split = el('bs-split', 'div');
            split.appendChild(rail());
            var main = el('bs-split__main', 'div');
            main.appendChild(filterBar());
            main.appendChild(sec());
            main.appendChild(grid('iptvpage', 12));
            split.appendChild(main);
            return [split];
          },
          detail: function () { return [hero(), lines(4)]; },
          person: function () { return [hero(), lines(4)]; },
          /* 播放页：主播放区（16:9 黑场）+ 桌面右面板列。
             用 div 而非默认的 i（`<i>` 是 inline，aspect-ratio / 高度不生效，
             同款的 .bs-cover / .bs-line 都是显式 display:block 才成立）。 */
          player: function () {
            var wrap = el('bs-player', 'div');
            wrap.appendChild(el('bs-player__stage', 'div'));
            var side = el('bs-player__side', 'div');
            side.appendChild(el('bs-player__panel', 'div'));
            side.appendChild(el('bs-player__panel bs-player__panel--tall', 'div'));
            wrap.appendChild(side);
            return [wrap];
          },
        };

        /* 填满首屏：按当前视口高度逐行补占位块，直到骨架内容高度到达
           「视口高 − 底部提示区预留」。宁多不缺 —— 超出部分由 overflow:hidden
           裁掉，与真实页「网格自然溢出首屏」同观感；上限 24 次防异常视口
           （0 高 / 缩放极端值）死循环。home / collections 补分区头（.bs-sec），
           对齐真实页「分区标题 + 卡片行」的节奏。高度全部量渲染结果
           （body.scrollHeight），不在 JS 里另估行高，列数仍由 CSS 档位唯一决定。 */
        function fillRows(host, maker, withSec) {
          var header = splash.querySelector('.bs-header');
          var target = window.innerHeight - (header ? header.offsetHeight : 0) - 48;
          var guard = 0;
          while (guard++ < 24 && body.scrollHeight < target) {
            if (withSec) host.appendChild(sec());
            host.appendChild(maker());
          }
        }
        var FILL = {
          home: function () { fillRows(body, function () { return grid('poster', 8); }, true); },
          browse: function () { fillRows(body, function () { return grid('poster', 8); }); },
          chart: function () { fillRows(body, function () { return listRows(8); }); },
          collections: function () { fillRows(body, function () { return grid('channel', 6); }, true); },
          history: function () { fillRows(body, function () { return grid('record', 8); }); },
          iptv: function () {
            fillRows(body.querySelector('.bs-split__main') || body, function () { return grid('iptvpage', 6); });
          },
          detail: function () { fillRows(body, function () { return lines(4); }); },
          person: function () { fillRows(body, function () { return lines(4); }); },
        };

        splash.setAttribute('data-shape', shape);
        if (shape === 'play') tip.textContent = '正在打开播放器…';
        else if (shape === 'player') tip.textContent = '正在加载影片…';

        var build = BUILD[shape];
        if (build) {
          var blocks = build();
          var frag = document.createDocumentFragment();
          for (var i = 0; i < blocks.length; i++) frag.appendChild(blocks[i]);
          body.textContent = '';
          body.appendChild(frag);
        }

        /* home 形态的静态 HTML 也在此时按视口补行（首轮 hero + 1 行是
           无 JS 时的兜底，绘制前这里已补齐，不会先闪「单行」再变高） */
        var fill = FILL[shape];
        if (fill) fill();
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
