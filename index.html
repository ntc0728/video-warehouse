<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/src/assets/icon/KinoTV.webp" />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1890ff" />
    <title>kinoTv</title>
    <style>
      /* 启动骨架（2026-09-11 升级）：HTML 一到浏览器就可见，消除「JS 请求/解析期间纯白屏」。
         原版只有 logo + 「正在启动…」，冷启动（依赖预打包 ~5s + 首屏 133 模块 transform）
         期间被感知为白屏；现改为**与首页同构的首屏骨架**：顶栏 + Hero + 卡片行。

         硬约束（勿改）：
         1. 必须零依赖 —— 此刻 index.css 与 JS 都还没加载，CSS 变量不可用，
            故颜色硬编码对齐 variables.css：浅色 bg #f5f5f5 / surface #fff /
            border #e8e8e8 / skeleton #e8e8e8；深色 bg #141414 / surface #1f1f1f /
            border #2b2b2b / skeleton #2a2a2a。
         2. 列数分档对齐 --card-cols：3 →4(768) →5(1024) →6(1280) →7(1440) →8(1920)。
         3. pointer-events:none 保证即使移除失败也不拦点击（防 E2E 误判遮挡）。
         4. 尺寸全用 vh / % / rem，不引 token、不用 100dvh（App 内会溢出）。 */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: #f5f5f5;
        color: #999;
        font: 400 13px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        pointer-events: none;
        user-select: none;
      }

      /* 顶栏骨架 */
      .bs-header {
        display: flex;
        flex-shrink: 0;
        gap: 16px;
        align-items: center;
        height: 60px;
        padding: 0 16px;
        background: #fff;
        border-bottom: 1px solid #e8e8e8;
      }
      .bs-logo {
        flex-shrink: 0;
        width: 32px;
        height: 32px;
        overflow: hidden;
        background: #e8e8e8;
        border-radius: 8px;
      }
      .bs-logo img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .bs-nav { display: flex; gap: 12px; align-items: center; margin-left: auto; }
      .bs-nav i { display: block; width: 3.5rem; height: 0.75rem; background: #e8e8e8; border-radius: 6px; }
      .bs-nav i:first-child { width: 9rem; }

      /* 内容骨架 */
      .bs-body { display: flex; flex-direction: column; gap: 16px; padding: 16px; }
      .bs-hero { width: 100%; aspect-ratio: 16 / 9; max-height: 42vh; background: #e8e8e8; border-radius: 12px; }
      .bs-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
      .bs-row i { display: block; aspect-ratio: 2 / 3; background: #e8e8e8; border-radius: 8px; }

      .bs-tip { padding: 4px 0 20px; text-align: center; animation: boot-pulse 1.4s ease-in-out infinite; }

      @keyframes boot-pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }

      @media (width >= 768px)  { .bs-row { grid-template-columns: repeat(4, 1fr); } }
      @media (width >= 1024px) { .bs-row { grid-template-columns: repeat(5, 1fr); } }
      @media (width >= 1280px) { .bs-row { grid-template-columns: repeat(6, 1fr); } }
      @media (width >= 1440px) { .bs-row { grid-template-columns: repeat(7, 1fr); } }
      @media (width >= 1920px) { .bs-row { grid-template-columns: repeat(8, 1fr); } }

      html[data-theme="dark"] #boot-splash { background: #141414; color: #666; }
      html[data-theme="dark"] .bs-header { background: #1f1f1f; border-bottom-color: #2b2b2b; }
      html[data-theme="dark"] .bs-logo,
      html[data-theme="dark"] .bs-nav i,
      html[data-theme="dark"] .bs-hero,
      html[data-theme="dark"] .bs-row i { background: #2a2a2a; }

      @media (prefers-reduced-motion: reduce) { .bs-tip { animation: none; } }
    </style>
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('app-settings');
          if (raw) {
            var state = JSON.parse(raw);
            var theme = state.state && state.state.theme;
            if (theme === 'dark') {
              document.documentElement.setAttribute('data-theme', 'dark');
            } else if (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches) {
              document.documentElement.setAttribute('data-theme', 'dark');
            }
            /* 阶段 C 首帧防闪：手动档 uiScale>0 时在 React mount 前预写内联 --ui-scale，
               避免 ≥1920 大屏首帧闪自动档值；0=自动时不写，交回 @media 判定。 */
            var uiScale = state.state && state.state.uiScale;
            if (typeof uiScale === 'number' && uiScale > 0) {
              document.documentElement.style.setProperty('--ui-scale', String(uiScale));
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="bs-header">
        <div class="bs-logo">
          <img src="/src/assets/icon/KinoTV.webp" alt="" onerror="this.style.display='none'" />
        </div>
        <div class="bs-nav"><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="bs-body">
        <div class="bs-hero"></div>
        <div class="bs-row"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="bs-tip">正在启动…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
