<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
  <!-- KinoTV 图片占位图：海报加载失败/缺失时的统一兜底（深色渐变 + 播放图标） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20242e"/>
      <stop offset="1" stop-color="#14171d"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a5266"/>
      <stop offset="1" stop-color="#3a4154"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <!-- 中央播放按钮：圆环 + 三角 -->
  <circle cx="200" cy="280" r="58" fill="none" stroke="url(#ring)" stroke-width="5"/>
  <path d="M184 254 L184 306 L234 280 Z" fill="#6b7488"/>
  <!-- 底部品牌名 -->
  <text x="200" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" letter-spacing="6" fill="#4a5266">KinoTV</text>
</svg>
