name: Build Android APK

# APK 补传/兜底入口：
# - release 事件：⚠️ 2026-08-14 实测（v1.7.2）release 由 GITHUB_TOKEN 创建
#   （author=github-actions[bot]），GITHUB_TOKEN 创建的事件被 GitHub 递归保护吞掉，
#   `on: release: published` **不会触发**本 workflow——此通道仅当 release 由 PAT/App
#   身份创建时可用（配置 RELEASE_PLEASE_TOKEN 后 release 由 PAT 创建 → 自动复活）。
#   自动上传的可靠通道 = release-please.yml 内的 build-apk（release 存在性门控）。
# - workflow_dispatch：手动补传任意版本（填版本号如 1.7.2 → 上传 kinoTv-v1.7.2.apk
#   到 kinotv-v1.7.2 release）。
# ⚠️ tag 前缀必须是 `kinotv-v`（release-please 按 package.json name=kinotv 派生，
#   实际 tag 如 kinotv-v1.7.2）——曾拼 `v${version}` 导致 checkout git exit 1，
#   版本号提取亦须用 `${TAG#kinotv-v}`（`${TAG#v}` 删不掉前缀）。
# 命名规范：kinoTv-v<版本号>.apk（如 kinoTv-v1.7.2.apk）。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: '补传的版本号（不带 v 前缀，如 1.7.1）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      # 手动模式取输入版本拼 kinotv-v 前缀，release 事件直接用 release tag（已含前缀）
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "tag=kinotv-v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # 必须安装 Android SDK：compileSdk 34 + build-tools（含 apksigner）。
      # 否则 ANDROID_HOME 为空，gradle 无法编译、签名步骤找不到 apksigner，
      # 整个 workflow 在 build/sign 阶段失败导致 APK 缺失。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34

      - name: Install dependencies
        # --registry 覆盖提交的 .npmrc（本地用 npmmirror 加速，CI 用 npmjs 官方源更稳）
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/

      - name: Build web assets
        run: pnpm run build
        env:
          CAPACITOR: 'true'

      # android/ 目录被 .gitignore 忽略（不进 git），CI 需先 cap add 生成平台模板
      - name: Add & sync Android platform
        run: |
          pnpm exec cap add android
          pnpm exec cap sync android
          # 应用自定义 res 补丁（values-v31 启动屏 + colors.xml），cap add 模板不含
          Copy-Item -Recurse -Force scripts/android-res-patch/* android/app/src/main/res/
          # 应用 DLNA 投屏补丁（原生 Java 源码 + AndroidManifest 权限合并）
          ./scripts/patch-android-dlna.ps1
          node scripts/sync-android-version.mjs
        shell: pwsh

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      # 签名策略：配置 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
      # ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD 四个 Secrets 用正式 keystore 签名；
      # 未配置时用 keytool 生成临时 keystore 签名（可安装，升级安装会因签名不同而失败）。
      - name: Sign APK
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION="${TAG#kinotv-v}"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            KS_PASS="$ANDROID_KEYSTORE_PASSWORD"
            ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASS="$ANDROID_KEY_PASSWORD"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/keystore.jks" \
              -storepass kinoTv2026 -alias kinoTv -keypass kinoTv2026 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=KinoTV, OU=KinoTV, O=KinoTV, L=Beijing, S=Beijing, C=CN"
            KS_PASS="kinoTv2026"
            ALIAS="kinoTv"
            KEY_PASS="kinoTv2026"
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/keystore.jks" --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$ALIAS" --key-pass "pass:$KEY_PASS" \
            --out "kinoTv-v${VERSION}.apk" "$UNSIGNED"

      - name: Upload APK to Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release upload "$TAG" "kinoTv-v${TAG#kinotv-v}.apk" --clobber
