name: Build Android APK

# 手动补传 APK（workflow_dispatch，填版本号如 1.6.0 → 上传 kinoTv-v1.6.0.apk 到 v1.6.0 release）。
# 自动发布链路已移入 release-please.yml 的 build-apk job（GITHUB_TOKEN 事件不递归触发
# 本 workflow 的 on: release，历史 release 因此全部缺失 APK），本文件仅作兜底入口。
# 命名规范：kinoTv-v<版本号>.apk（如 kinoTv-v1.4.0.apk）。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: '补传的版本号（不带 v 前缀，如 1.6.0）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      # 手动模式取输入版本（拼 v 前缀），release 事件取 release tag
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 必须安装 Android SDK：compileSdk 34 + build-tools（含 apksigner）。
      # 否则 ANDROID_HOME 为空，gradle 无法编译、签名步骤找不到 apksigner，
      # 整个 workflow 在 build/sign 阶段失败导致 APK 缺失。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build
        env:
          CAPACITOR: 'true'

      # android/ 目录被 .gitignore 忽略（不进 git），CI 需先 cap add 生成平台模板
      - name: Add & sync Android platform
        run: |
          npx cap add android
          npx cap sync android
          # 应用自定义 res 补丁（values-v31 启动屏 + colors.xml），cap add 模板不含
          Copy-Item -Recurse -Force scripts/android-res-patch/* android/app/src/main/res/
          node scripts/sync-android-version.mjs
        shell: pwsh

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      # 签名策略：配置 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
      # ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD 四个 Secrets 用正式 keystore 签名；
      # 未配置时用 keytool 生成临时 keystore 签名（可安装，升级安装会因签名不同而失败）。
      - name: Sign APK
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            KS_PASS="$ANDROID_KEYSTORE_PASSWORD"
            ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASS="$ANDROID_KEY_PASSWORD"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/keystore.jks" \
              -storepass kinoTv2026 -alias kinoTv -keypass kinoTv2026 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=KinoTV, OU=KinoTV, O=KinoTV, L=Beijing, S=Beijing, C=CN"
            KS_PASS="kinoTv2026"
            ALIAS="kinoTv"
            KEY_PASS="kinoTv2026"
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/keystore.jks" --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$ALIAS" --key-pass "pass:$KEY_PASS" \
            --out "kinoTv-v${VERSION}.apk" "$UNSIGNED"

      - name: Upload APK to Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release upload "$TAG" "kinoTv-v${TAG#v}.apk" --clobber
