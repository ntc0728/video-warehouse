name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # 默认用 GITHUB_TOKEN；若该仓库未开启「Allow GitHub Actions to create and approve
          # pull requests」（私有库/组织策略常禁用），请创建带 repo 权限的 PAT 存入
          # 仓库 Secrets 的 RELEASE_PLEASE_TOKEN，即可绕过该限制自动开版 PR。
          # ⚠️ 注意：未配置 PAT 时 release 由 GITHUB_TOKEN 创建（author=github-actions[bot]），
          # 该事件被 GitHub 递归保护吞掉，`on: release: published` 永远不会触发；
          # 配置 PAT 后 release 由 PAT 身份创建 → 事件可正常触发（release-android.yml 复活）。
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  # APK 构建（2026-08-14 终版）：
  # 门控 = 本次 push 是否为 release PR 的 merge commit（commit message 含
  # "release-please--branches--master"，GitHub 生成的 merge commit 格式固定，100% 可靠）。
  # 为什么不用 release_created / API 探测：
  # - release_created：release 由 GITHUB_TOKEN 通道创建（v1.7.1~v1.7.4 实证 author=
  #   github-actions[bot]），action 再运行时 release 已存在 → 恒 false → 恒 skipped。
  # - API 探测（target_commitish==GITHUB_SHA）：与 release 发布存在竞态——check 步骤
  #   运行时 release 可能尚在 draft/未入列表（列表 API 不返回 draft），v1.7.4 实测仍 skipped。
  # 本方案零探测：merge commit 必为发版 commit，版本号直接从 checkout 的
  # package.json 读取（release PR 已 bump 版本），无需 tag/release 状态。
  build-apk:
    if: contains(github.event.head_commit.message, 'release-please--branches--master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # 必须安装 Android SDK：compileSdk 34 + build-tools（含 apksigner）。
      # 否则 ANDROID_HOME 为空，gradle 无法编译、签名步骤找不到 apksigner，
      # 整个 workflow 在 build/sign 阶段失败导致 APK 缺失。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34

      - name: Install dependencies
        # --registry 覆盖提交的 .npmrc（本地用 npmmirror 加速，CI 用 npmjs 官方源更稳）
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/

      - name: Build web assets
        run: pnpm run build
        env:
          CAPACITOR: 'true'

      # android/ 目录被 .gitignore 忽略（不进 git），CI 需先 cap add 生成平台模板
      - name: Add & sync Android platform
        run: |
          pnpm exec cap add android
          pnpm exec cap sync android
          # 应用自定义 res 补丁（values-v31 启动屏 + colors.xml），cap add 模板不含
          Copy-Item -Recurse -Force scripts/android-res-patch/* android/app/src/main/res/
          node scripts/sync-android-version.mjs
        shell: pwsh

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      # 签名策略：配置 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
      # ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD 四个 Secrets 用正式 keystore 签名；
      # 未配置时用 keytool 生成临时 keystore 签名（可安装，升级安装会因签名不同而失败）。
      - name: Sign APK
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            KS_PASS="$ANDROID_KEYSTORE_PASSWORD"
            ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASS="$ANDROID_KEY_PASSWORD"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/keystore.jks" \
              -storepass kinoTv2026 -alias kinoTv -keypass kinoTv2026 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=KinoTV, OU=KinoTV, O=KinoTV, L=Beijing, S=Beijing, C=CN"
            KS_PASS="kinoTv2026"
            ALIAS="kinoTv"
            KEY_PASS="kinoTv2026"
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/keystore.jks" --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$ALIAS" --key-pass "pass:$KEY_PASS" \
            --out "kinoTv-v${VERSION}.apk" "$UNSIGNED"

      - name: Upload APK to Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="kinotv-v${VERSION}"
          # release-please job 与本 job 并行，release 可能尚未发布，轮询等待（最长 5 分钟）
          for i in $(seq 1 30); do
            if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done
          gh release upload "${TAG}" "kinoTv-v${VERSION}.apk" --clobber