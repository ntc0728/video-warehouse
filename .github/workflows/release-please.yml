name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # 默认用 GITHUB_TOKEN；若该仓库未开启「Allow GitHub Actions to create and approve
          # pull requests」（私有库/组织策略常禁用），请创建带 repo 权限的 PAT 存入
          # 仓库 Secrets 的 RELEASE_PLEASE_TOKEN，即可绕过该限制自动开版 PR。
          # ⚠️ 注意：未配置 PAT 时 release 由 GITHUB_TOKEN 创建（author=github-actions[bot]），
          # 该事件被 GitHub 递归保护吞掉，`on: release: published` 永远不会触发；
          # 配置 PAT 后 release 由 PAT 身份创建 → 事件可正常触发（release-android.yml 复活）。
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      # 探测本次 push 是否就是「发版 commit」：package.json 版本对应 tag 的 release 存在
      # 且 target 指向当前 HEAD（= release PR 合并的 push）才构建。
      # 为什么不用 release_created：本仓库 release 实际由 GITHUB_TOKEN 通道创建（v1.7.1/v1.7.2
      # 两次实证 author=github-actions[bot]），action 再运行时 release 已存在 →
      # release_created=false → 原门控恒跳过（历史 build-apk 全 skipped 的根因）。
      # 为什么校验 target：仅凭「release 存在」会让普通 push（版本未变）也触发构建，
      # 用 target==HEAD 精确匹配「本次 push 刚发布的版本」。
      - name: Check release exists for HEAD
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="kinotv-v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          TARGET="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json targetCommitish --jq .targetCommitish 2>/dev/null || true)"
          if [ -n "${TARGET}" ] && [ "${TARGET}" = "${GITHUB_SHA}" ]; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

  # APK 构建（2026-08-14 双通道）：
  # 通道 A = release-android.yml 的 on: release: published——仅当 release 由 PAT/
  # App 创建（非 GITHUB_TOKEN）时可触发；当前 release 由 GITHUB_TOKEN 创建 → 事件被
  # 递归保护吞掉，此通道为死链（配置 RELEASE_PLEASE_TOKEN 后自动复活）。
  # 本 job = 始终可用的构建通道：release 已存在（无论谁创建）即构建上传。
  build-apk:
    needs: release-please
    if: needs.release-please.outputs.release_exists == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # 必须安装 Android SDK：compileSdk 34 + build-tools（含 apksigner）。
      # 否则 ANDROID_HOME 为空，gradle 无法编译、签名步骤找不到 apksigner，
      # 整个 workflow 在 build/sign 阶段失败导致 APK 缺失。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build
        env:
          CAPACITOR: 'true'

      # android/ 目录被 .gitignore 忽略（不进 git），CI 需先 cap add 生成平台模板
      - name: Add & sync Android platform
        run: |
          npx cap add android
          npx cap sync android
          # 应用自定义 res 补丁（values-v31 启动屏 + colors.xml），cap add 模板不含
          Copy-Item -Recurse -Force scripts/android-res-patch/* android/app/src/main/res/
          node scripts/sync-android-version.mjs
        shell: pwsh

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      # 签名策略：配置 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
      # ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD 四个 Secrets 用正式 keystore 签名；
      # 未配置时用 keytool 生成临时 keystore 签名（可安装，升级安装会因签名不同而失败）。
      - name: Sign APK
        shell: bash
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          VERSION="${TAG#kinotv-v}"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            KS_PASS="$ANDROID_KEYSTORE_PASSWORD"
            ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASS="$ANDROID_KEY_PASSWORD"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/keystore.jks" \
              -storepass kinoTv2026 -alias kinoTv -keypass kinoTv2026 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=KinoTV, OU=KinoTV, O=KinoTV, L=Beijing, S=Beijing, C=CN"
            KS_PASS="kinoTv2026"
            ALIAS="kinoTv"
            KEY_PASS="kinoTv2026"
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/keystore.jks" --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$ALIAS" --key-pass "pass:$KEY_PASS" \
            --out "kinoTv-v${VERSION}.apk" "$UNSIGNED"

      - name: Upload APK to Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          gh release upload "$TAG" "kinoTv-v${TAG#kinotv-v}.apk" --clobber