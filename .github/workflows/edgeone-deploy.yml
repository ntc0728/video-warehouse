name: Deploy to EdgeOne Pages

# 绕开 EdgeOne 云端构建机（其 nofile 硬上限过低，vite build 必现 EMFILE）：
# 在 GitHub runner 上完成构建，产物用 EdgeOne CLI 直传。
on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # -n 与 EdgeOne 控制台项目名一致；项目不存在会自动创建
      # 钉 1.6.47：1.7.x 声明依赖 @edgeone/pages-blob@0.0.19，公网 npm 最高只有 0.0.18，
      # npx 安装即报 ETARGET（官方发坏的版本）。官方修复后可放开。
      - name: Deploy to EdgeOne Pages
        run: npx edgeone@1.6.47 pages deploy dist -n video-warehouse -e production -t "$EDGEONE_TOKEN"
        env:
          EDGEONE_TOKEN: ${{ secrets.EDGEONE_TOKEN }}
