name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 用 Cloudflare Pages Direct Upload 部署 dist（无需绑定 Git 仓库，token 驱动）。
      # 前置：仓库 Secrets 需配置 CLOUDFLARE_API_TOKEN（Cloudflare API Token，
      #   Account > Cloudflare Pages: Edit 权限）+ CLOUDFLARE_ACCOUNT_ID。
      # 未配置 token 时此 step 自动跳过，仅产出构建产物（可手动上传）。
      - name: Deploy to Cloudflare Pages
        id: pages
        if: secrets.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist --project-name video-warehouse \
            --branch master \
            --commit-dirty=true
